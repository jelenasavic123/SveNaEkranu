<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preusmeravanje - Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
</head>
<body>
    <h1>Preusmeravanje Linkova - Admin Panel</h1>
    <form id="redirectForm">
        <label for="tmdbId">TMDB ID:</label>
        <input type="text" id="tmdbId" required><br><br>
        <label for="url">URL:</label>
        <input type="url" id="url" required><br><br>
        <button type="submit">Dodaj/Izmeni Redirect</button>
    </form>

    <h2>Upute:</h2>
    <p>Unesite TMDB ID i URL da biste dodali ili izmenili preusmeravanje.</p>

    <script>
        // Firebase konfiguracija
        const firebaseConfig = {
            apiKey: "AIzaSyAYdeETi4ypfVTTQsNhn-lfdtx4maOEWrk",
            authDomain: "preusmeravanjeklikova.firebaseapp.com",
            databaseURL: "https://preusmeravanjeklikova-default-rtdb.firebaseio.com",
            projectId: "preusmeravanjeklikova",
            storageBucket: "preusmeravanjeklikova.firebasestorage.app",
            messagingSenderId: "387493682555",
            appId: "1:387493682555:web:73bb870f371ea47d4071de",
            measurementId: "G-QQB1SDP71D"
        };

        // Inicijalizacija Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database(app);

        // Dodavanje ili ažuriranje preusmeravanja
        document.getElementById("redirectForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const tmdbId = document.getElementById("tmdbId").value.trim();
            const url = document.getElementById("url").value.trim();

            if (tmdbId && url) {
                // Reference na 'redirects' u Firebase
                const redirectsRef = database.ref('redirects/' + tmdbId);

                // Upisivanje novog linka
                redirectsRef.set(url)
                    .then(() => {
                        alert("Preusmeravanje je uspešno dodano ili ažurirano!");
                        document.getElementById("redirectForm").reset();
                    })
                    .catch((error) => {
                        console.error("Greška pri dodavanju ili ažuriranju preusmeravanja:", error);
                        alert("Došlo je do greške.");
                    });
            } else {
                alert("Molimo vas da popunite oba polja.");
            }
        });
    </script>
</body>
</html>
