<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Redirect Panel</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
  <h2>Dodaj Redirekciju u Firebase</h2>
  <form id="redirectForm">
    <label for="number">Broj (TMDb ID):</label>
    <input type="text" id="number" placeholder="Unesi broj (TMDb ID)" required>
    <br><br>
    
    <label for="link">Link (URL):</label>
    <input type="url" id="link" placeholder="Unesi URL" required>
    <br><br>
    
    <button type="submit">Dodaj</button>
  </form>

  <script>
    // Firebase konfiguracija
    const firebaseConfig = {
      apiKey: "AIzaSyAYdeETi4ypfVTTQsNhn-lfdtx4maOEWrk",
      authDomain: "preusmeravanjeklikova.firebaseapp.com",
      databaseURL: "https://preusmeravanjeklikova-default-rtdb.firebaseio.com",
      projectId: "preusmeravanjeklikova",
      storageBucket: "preusmeravanjeklikova.appspot.com",
      messagingSenderId: "387493682555",
      appId: "1:387493682555:web:73bb870f371ea47d4071de",
      measurementId: "G-QQB1SDP71D"
    };

    // Inicijalizacija Firebase-a
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Dodavanje podataka u bazu
    document.getElementById('redirectForm').addEventListener('submit', function(event) {
      event.preventDefault(); // Sprečava ponovno učitavanje stranice

      const number = document.getElementById('number').value;
      const link = document.getElementById('link').value;

      if (number && link) {
        const redirectsRef = database.ref('redirects');
        redirectsRef.child(number).set(link)
          .then(() => {
            alert('Redirekcija je uspešno dodata!');
            document.getElementById('redirectForm').reset(); // Resetuje formu
          })
          .catch((error) => {
            console.error('Greška prilikom dodavanja podataka:', error);
            alert('Došlo je do greške. Proveri konzolu za više detalja.');
          });
      } else {
        alert('Popuni oba polja!');
      }
    });
  </script>
</body>
</html>
