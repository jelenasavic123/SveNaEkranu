<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serije - TMDB</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #fff;
        }

        h2, h3 {
            color: #fff;
            font-weight: bold;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Main Content */
        #series-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .series-card {
            position: relative;
            cursor: pointer;
            border-radius: 10px;
            overflow: hidden;
            background-color: #222;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .series-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .series-card h3 {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 18px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }

        .series-card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        /* Loading Spinner */
        #loading {
            text-align: center;
            color: #fff;
            font-size: 20px;
            margin-top: 20px;
        }

        /* Popup */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .popup-content {
            background-color: #1f1f1f;
            padding: 20px;
            border-radius: 10px;
            max-width: 800px;
            width: 90%;
            overflow-y: auto;
            max-height: 80%;
            position: relative;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 30px;
            color: #fff;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 50%;
        }

        /* Info about the series */
        .series-info {
            display: flex;
            margin-bottom: 20px;
            align-items: center;
        }

        .series-info img {
            width: 100px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-right: 20px;
        }

        .series-info div {
            color: #fff;
            font-size: 14px;
        }

        .season-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .season-button {
            padding: 12px 20px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .season-button:hover {
            background-color: #b20710;
        }

        .episode-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .episode-button {
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .episode-button:hover {
            background-color: #e50914;
        }

        /* Language Selection Popup */
        .language-button {
            padding: 12px 20px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            margin-top: 10px;
            width: 100%;
        }

        .language-button:hover {
            background-color: #b20710;
        }

    </style>
</head>
<body>
    <div id="loading" style="display: none;">Učitavanje...</div>
    <div id="series-list"></div>

    <!-- Popup prozor za seriju -->
    <div id="popup" class="popup">
        <div class="popup-content">
            <span id="close" class="close">&times;</span>
            <!-- Info o seriji sa slikom -->
            <div class="series-info">
                <img id="series-poster" src="" alt="Poster serije">
                <div>
                    <h3 id="series-title"></h3>
                    <p id="series-overview"></p>
                    <p><strong>Godina:</strong> <span id="series-year"></span></p>
                    <p><strong>Žanrovi:</strong> <span id="series-genres"></span></p>
                    <p><strong>Broj sezona:</strong> <span id="series-seasons"></span></p>
                    <p><strong>Broj epizoda:</strong> <span id="series-episodes"></span></p>
                </div>
            </div>

            <div id="seasons" class="season-list"></div>

            <div id="episodes" class="episode-list"></div>
        </div>
    </div>

    <!-- Popup za izbor jezika -->
    <div id="language-popup" class="popup">
        <div class="popup-content">
            <span id="close-language-popup" class="close">&times;</span>
            <h2>Izaberite jezik za gledanje</h2>
            <button id="watch-sr" class="language-button">Gledaj na srpskom</button>
            <button id="watch-hr" class="language-button">Gledaj na hrvatskom</button>
        </div>
    </div>

<script>
    const apiKey = '2701858e9bccab54d4d0e4931420a739';
    const netflixProviderId = 8; // Netflix ID
    const baseUrl = 'https://api.themoviedb.org/3/';
    let currentPage = 1; // Keeps track of the current page

    const seriesList = document.getElementById('series-list');
    const popup = document.getElementById('popup');
    const closeBtn = document.getElementById('close');
    const seriesTitle = document.getElementById('series-title');
    const seriesOverview = document.getElementById('series-overview');
    const seriesPoster = document.getElementById('series-poster');
    const seriesYear = document.getElementById('series-year');
    const seriesGenres = document.getElementById('series-genres');
    const seriesSeasons = document.getElementById('series-seasons');
    const seriesEpisodes = document.getElementById('series-episodes');
    const seasonsContainer = document.getElementById('seasons');
    const episodesContainer = document.getElementById('episodes');
    const languagePopup = document.getElementById('language-popup');
    const closeLanguagePopup = document.getElementById('close-language-popup');
    const watchSrButton = document.getElementById('watch-sr');
    const watchHrButton = document.getElementById('watch-hr');
    let currentSeason = 1;
    let currentSeriesId = null;
    let selectedEpisode = null;

    // Function to detect when the user reaches the bottom of the page
    function checkScroll() {
        // When the user scrolls near the bottom of the page, load more series
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
            currentPage++;
            fetchSeries();  // Call your existing function to load more series
        }
    }

    // Attach the scroll event listener
    window.addEventListener('scroll', checkScroll);

    // Modify your fetchSeries function to support infinite scrolling
    async function fetchSeries() {
        document.getElementById('loading').style.display = 'block'; // Show loading message

        // Modify the URL to include the current page
        const apiUrlWithPage = `${baseUrl}discover/tv?api_key=${apiKey}&language=sr-SR&sort_by=popularity.desc&page=${currentPage}&with_watch_providers=${netflixProviderId}&watch_region=US`;
        const response = await fetch(apiUrlWithPage);
        const data = await response.json();
        displaySeries(data.results);
        document.getElementById('loading').style.display = 'none'; // Hide loading message
    }

    function displaySeries(series) {
        series.forEach(seriesItem => {
            const card = document.createElement('div');
            card.classList.add('series-card');
            card.innerHTML = `
                <img src="https://image.tmdb.org/t/p/w500${seriesItem.poster_path}" alt="${seriesItem.name}">
                <h3>${seriesItem.name}</h3>
            `;
            card.addEventListener('click', () => openPopup(seriesItem));
            seriesList.appendChild(card);
        });
    }

    async function openPopup(seriesItem) {
        seriesTitle.textContent = seriesItem.name;
        seriesOverview.textContent = seriesItem.overview;
        seriesPoster.src = `https://image.tmdb.org/t/p/w500${seriesItem.poster_path}`;
        currentSeriesId = seriesItem.id;

        // Preuzmi informacije o sezoni serije
        const seasonsResponse = await fetch(`${baseUrl}tv/${seriesItem.id}?api_key=${apiKey}&language=hr-HR`);
        const seasonData = await seasonsResponse.json();

        // Info o seriji (godina, žanrovi, broj sezona, epizoda)
        seriesYear.textContent = seasonData.first_air_date.split('-')[0];
        seriesGenres.textContent = seasonData.genres.map(genre => genre.name).join(', ');
        seriesSeasons.textContent = seasonData.seasons.length;
        seriesEpisodes.textContent = seasonData.number_of_episodes;

        // Filtriranje sezona, označavanje "Sezone 0" kao specijalne epizode
        const seasons = seasonData.seasons.map(season => {
            if (season.season_number === 0) {
                return {
                    ...season,
                    season_number: 'Specijalne Epizode'  // Promenjujemo naziv za sezonu 0
                };
            }
            return season;
        });

        // Prikazivanje svih sezona
        displaySeasons(seasons);
        episodesContainer.innerHTML = ''; // Clear episodes initially
        popup.style.display = 'flex';
    }

    function displaySeasons(seasons) {
        seasonsContainer.innerHTML = ''; // Clear previous season buttons
        seasons.forEach(season => {
            const seasonButton = document.createElement('button');
            seasonButton.classList.add('season-button');
            seasonButton.textContent = `Sezona ${season.season_number}`;
            seasonButton.addEventListener('click', () => loadEpisodes(season.season_number));
            seasonsContainer.appendChild(seasonButton);
        });
    }

    async function loadEpisodes(seasonNumber) {
        currentSeason = seasonNumber;
        // Clear previous episodes first
        episodesContainer.innerHTML = '';
        const episodesResponse = await fetch(`${baseUrl}tv/${currentSeriesId}/season/${currentSeason}?api_key=${apiKey}&language=hr-HR`);
        const episodesData = await episodesResponse.json();
        displayEpisodes(episodesData.episodes);
    }

    function displayEpisodes(episodes) {
        episodesContainer.innerHTML = ''; // Clear previous episode list
        episodes.forEach(episode => {
            const episodeButton = document.createElement('button');
            episodeButton.classList.add('episode-button');
            
            // Prikazivanje samo broja sezone i epizode, bez naziva epizode
            episodeButton.textContent = `Sezona ${currentSeason}, Epizoda ${episode.episode_number}`;
            
            episodeButton.addEventListener('click', () => openEpisode(episode));
            episodesContainer.appendChild(episodeButton);
        });
    }

    function openEpisode(episode) {
        // Čuvanje odabrane epizode
        selectedEpisode = episode;

        // Prikazivanje popup-a za jezik
        languagePopup.style.display = 'flex';
    }

    closeBtn.addEventListener('click', () => {
        popup.style.display = 'none';
    });

    closeLanguagePopup.addEventListener('click', () => {
        languagePopup.style.display = 'none';
    });

    watchSrButton.addEventListener('click', () => {
        const tmdbId = currentSeriesId;
        window.location.href = `https://vidsrc.vip/embed/tv/${tmdbId}/${currentSeason}/${selectedEpisode.episode_number}&lang=sr`;
    });

    watchHrButton.addEventListener('click', () => {
        const tmdbId = currentSeriesId;
        window.location.href = `https://vidsrc.vip/embed/tv/${tmdbId}/${currentSeason}/${selectedEpisode.episode_number}&lang=hr`;
    });

    fetchSeries();
</script>

</body>
</html>
