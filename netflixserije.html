<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Serije - TMDB</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0; padding: 0;
      background: url('https://jelenasavic123.github.io/SveNaEkranu//slike/pozadina.jpg') center/cover no-repeat fixed;
      color: #fff;
    }
    h2, h3 { color: #fff; font-weight: bold; }
    a { text-decoration: none; color: inherit; }

    #series-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      padding: 20px;
    }
    .series-card {
      position: relative;
      background-color: #333;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .series-card:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
    .series-card img {
      width: 100%;
      border-radius: 10px;
      object-fit: cover;
    }
    .series-card h3 {
      position: absolute; bottom: 10px; left: 10px;
      font-size: 14px; text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
    }
    .series-card .image-container { position: relative; }
    .series-card .rating {
      position: absolute; top: 5px; right: 1px;
      background-color: rgba(0,0,0,0.6); color: #fff;
      font-size: 10px; padding: 5px; border-radius: 5px;
      font-weight: bold; text-align: center;
    }
    #loading { text-align:center; font-size:20px; margin:20px 0; display:none; }
    #filters { padding:10px; background-color:#1f1f1f; border-radius:10px; margin-bottom:10px; }
    #genre-buttons, #year-buttons { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:5px; }
    .genre-button, .year-button {
      padding:5px 10px; background-color:#e50914; border:none; border-radius:5px;
      cursor:pointer; font-size:10px; transition:0.3s;
    }
    .genre-button:hover, .year-button:hover { background-color:#b20710; }

    /* Popup */
    .popup {
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:9999;
    }
    .popup-content {
      background:#1f1f1f; padding:0px; border-radius:10px; max-width:800px; width:90%;
      max-height:80%; overflow-y:auto; position:relative;
    }
    .close {
      position:absolute; top:10px; right:10px; font-size:50px; color:#fff; cursor:pointer;
      background: rgba(0,0,0,0.5); padding:5px 10px; border-radius:50%;
    }
    .series-info { display:flex; margin-bottom:10px; align-items:center; }
    .series-info img { width:100px; height:150px; object-fit:cover; border-radius:10px; margin-right:10px; }
    .series-info div { color:#fff; font-size:12px; }
    .season-list { display:flex; flex-wrap:wrap; gap:15px; justify-content:center; margin-top:20px; }
    .season-button { padding:12px 20px; background:#e50914; color:#fff; border:none; border-radius:30px; cursor:pointer; font-size:12px; }
    .season-button:hover { background:#b20710; }
    .episode-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:5px; margin-top:10px; }
    .episode-button { padding:10px; background:#333; color:#fff; border:none; border-radius:10px; cursor:pointer; font-size:14px; }
    .episode-button:hover { background:#e50914; }

    .language-button { padding:12px 20px; background:#e50914; color:white; border:none; border-radius:10px; cursor:pointer; font-size:15px; margin-top:10px; width:100%; }
    .language-button:hover { background-color:#b20710; }

    #saveToWatchLater { padding:7px 5px; background:#e50914; color:#fff; border:none; border-radius:5px; cursor:pointer; font-size:10px; }
    #saveToWatchLater:hover { background:#f40612; }
    #customAlert {
      display:none; position:fixed; top:20%; left:50%; transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.8); color:#fff; padding:20px 30px; border-radius:10px;
      font-size:16px; text-align:center; z-index:1000; width:80%; max-width:400px;
      backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,0.2);
    }
          .logo {
        margin: 20px 0;
        text-align: center;
      }
      .logo img {
        width: 105px;
      }
      
            /* Vertikalni Sidebar */
      .sidebar {
        position: fixed;
        top: 40%;
        right: 0;
        transform: translateY(-50%);
        background-color: rgba(0, 0, 0, 0.7);
        padding: 30px 25px;
        /* Povećan padding */
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        gap: 30px;
        /* Veći razmak između dugmića */
        z-index: 1000;
      }
      .sidebar-links {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .sidebar-links li {
        margin: 15px 0;
        /* Veći razmak između listi */
      }
      .sidebar-links a {
        text-decoration: none;
        color: white;
        font-size: 13px;
        /* Veći font za bolju čitljivost */
        font-weight: bold;
        text-transform: uppercase;
        padding: 15px 15px;
        /* Povećan padding za šire dugmiće */
        transition: all 0.3s ease;
      }
      .sidebar-links a:hover {
        background-color: rgba(255, 255, 255, 0.1);
        color: #e50914;
        border-radius: 18px;
        /* Veći border-radius za moderan izgled */
      }
  </style>
</head>
<body>
<div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo">
    </div>
    <!-- Vertikalni Sidebar -->
    <div class="sidebar">
      <ul class="sidebar-links">
        <li><a href="https://jelenasavic123.github.io/SveNaEkranu/netflix.html">Netflix Filmovi</a></li>
        <li><a href="https://jelenasavic123.github.io/SveNaEkranu/netflixserije.html">Netflix Serije</a></li>
        <li><a href="https://jelenasavic123.github.io/SveNaEkranu/omiljeno.html">Omiljeni Sadrzaj</a></li>
      </ul>
    </div>

  <div style="padding:20px; max-width:600px; margin:auto;">
    <input type="text" id="seriesSearch" placeholder="Pretraži serije..." style="width:100%; padding:10px; font-size:16px; border-radius:5px; border:1px solid #ccc;">
  </div>

  <div id="loading">Učitavanje...</div>
  <div id="filters">
    <div id="genre-buttons"></div>
    <div id="year-buttons"></div>
  </div>
  <div id="series-list"></div>
  <div style="text-align:center; margin:20px 0;">
    <button id="loadMoreBtn" style="padding:10px 20px; font-size:16px; cursor:pointer; border-radius:5px;">Učitaj još</button>
  </div>

  <!-- Popup prozor -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <span id="close" class="close">&times;</span>
      <div class="series-info">
        <img id="series-poster" src="" alt="Poster">
        <div>
          <h3 id="series-title"></h3>
          <p id="series-overview"></p>
          <p><strong>Godina:</strong> <span id="series-year"></span></p>
          <p><strong>Žanrovi:</strong> <span id="series-genres"></span></p>
          <button id="saveToWatchLater">💾 Dodaj u Omiljeno</button>
          <p><strong>Broj sezona:</strong> <span id="series-seasons"></span></p>
          <p><strong>Broj epizoda:</strong> <span id="series-episodes"></span></p>
        </div>
      </div>
      <div id="seasons" class="season-list"></div>
      <div id="episodes" class="episode-list"></div>
      <div id="customAlert"></div>
    </div>
  </div>

  <!-- Popup za jezik -->
  <div id="language-popup" class="popup">
    <div class="popup-content">
      <span id="close-language-popup" class="close">&times;</span>
      <h2>Izaberite jezik za gledanje</h2>
      <button id="watch-sr" class="language-button">Gledaj na srpskom</button>
      <button id="watch-hr" class="language-button">Gledaj na hrvatskom</button>
    </div>
  </div>

<script>
const apiKey = '2701858e9bccab54d4d0e4931420a739';
const netflixProviderId = 8;
const baseUrl = 'https://api.themoviedb.org/3/';
let currentPage = 1;
let currentGenre = null;
let currentYear = null;
let currentSearch = null;
let searchTimeout = null;

const seriesList = document.getElementById('series-list');
const popup = document.getElementById('popup');
const closeBtn = document.getElementById('close');
const seriesTitle = document.getElementById('series-title');
const seriesOverview = document.getElementById('series-overview');
const seriesPoster = document.getElementById('series-poster');
const seriesYear = document.getElementById('series-year');
const seriesGenres = document.getElementById('series-genres');
const seriesSeasons = document.getElementById('series-seasons');
const seriesEpisodes = document.getElementById('series-episodes');
const seasonsContainer = document.getElementById('seasons');
const episodesContainer = document.getElementById('episodes');
const languagePopup = document.getElementById('language-popup');
const closeLanguagePopup = document.getElementById('close-language-popup');
const watchSrButton = document.getElementById('watch-sr');
const watchHrButton = document.getElementById('watch-hr');
const genreButtonsContainer = document.getElementById('genre-buttons');
const yearButtonsContainer = document.getElementById('year-buttons');
const searchInput = document.getElementById('seriesSearch');

let currentSeason = 1;
let currentSeriesId = null;
let selectedEpisode = null;

// --- Fetch žanrova ---
async function fetchGenres() {
  const response = await fetch(`${baseUrl}genre/tv/list?api_key=${apiKey}&language=en`);
  const data = await response.json();
  data.genres.forEach(genre => {
    const btn = document.createElement('button');
    btn.classList.add('genre-button');
    btn.textContent = genre.name;
    btn.addEventListener('click', () => {
      currentGenre = genre.id;
      currentPage = 1;
      fetchSeries();
    });
    genreButtonsContainer.appendChild(btn);
  });
}

// --- Godine ---
function generateYears() {
  for (let y = 2025; y >= 2014; y--) {
    const btn = document.createElement('button');
    btn.classList.add('year-button');
    btn.textContent = y;
    btn.addEventListener('click', () => {
      currentYear = y;
      currentPage = 1;
      fetchSeries();
    });
    yearButtonsContainer.appendChild(btn);
  }
}

// --- Fetch serije ---
async function fetchSeries() {
  document.getElementById('loading').style.display = 'block';

  let url = '';
  if (currentSearch) {
    url = `${baseUrl}search/tv?api_key=${apiKey}&language=sr-SR&query=${encodeURIComponent(currentSearch)}&page=${currentPage}`;
  } else {
    url = `${baseUrl}discover/tv?api_key=${apiKey}&language=sr-SR&sort_by=popularity.desc&page=${currentPage}&with_watch_providers=${netflixProviderId}&watch_region=US`;
    if (currentGenre) url += `&with_genres=${currentGenre}`;
    if (currentYear) url += `&first_air_date_year=${currentYear}`;
  }

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (currentPage === 1) seriesList.innerHTML = '';
    displaySeries(data.results);

  } catch (err) { console.error(err); }

  document.getElementById('loading').style.display = 'none';
}

// --- Display serije ---
function displaySeries(series) {
  series.forEach(s => {
    const card = document.createElement('div');
    card.classList.add('series-card');
    card.innerHTML = `
      <div class="image-container">
        <img src="https://image.tmdb.org/t/p/w500/${s.poster_path}" alt="${s.name}">
        <div class="rating">${s.vote_average}</div>
      </div>
      <h3>${s.name}</h3>
    `;
    card.addEventListener('click', () => showSeriesDetails(s.id));
    seriesList.appendChild(card);
  });
}

// --- Detalji ---
async function showSeriesDetails(id) {
  currentSeriesId = id;
  const res = await fetch(`${baseUrl}tv/${id}?api_key=${apiKey}&language=sr-SR`);
  const data = await res.json();

  seriesTitle.textContent = data.name;
  seriesOverview.textContent = data.overview;
  seriesPoster.src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
  seriesYear.textContent = data.first_air_date?.split('-')[0] || '';
  seriesGenres.textContent = data.genres.map(g => g.name).join(', ');
  seriesSeasons.textContent = data.number_of_seasons;
  seriesEpisodes.textContent = data.number_of_episodes;

  seasonsContainer.innerHTML = '';
  for (let i = 1; i <= data.number_of_seasons; i++) {
    const btn = document.createElement('button');
    btn.classList.add('season-button');
    btn.textContent = `Sezona ${i}`;
    btn.addEventListener('click', () => fetchEpisodes(i));
    seasonsContainer.appendChild(btn);
  }

  popup.style.display = 'flex';
}

// --- Epizode ---
function fetchEpisodes(seasonNumber) {
  currentSeason = seasonNumber;
  fetch(`${baseUrl}tv/${currentSeriesId}/season/${seasonNumber}?api_key=${apiKey}&language=sr-SR`)
    .then(r => r.json())
    .then(data => {
      episodesContainer.innerHTML = '';
      data.episodes.forEach(ep => {
        const btn = document.createElement('button');
        btn.classList.add('episode-button');
        btn.textContent = `Sezona ${currentSeason}, Epizoda ${ep.episode_number}`;
        btn.addEventListener('click', () => {
          selectedEpisode = ep;
          languagePopup.style.display = 'flex';
        });
        episodesContainer.appendChild(btn);
      });
    });
}

// --- Popup ---
closeBtn.addEventListener('click', () => { popup.style.display='none'; languagePopup.style.display='none'; });
closeLanguagePopup.addEventListener('click', () => { languagePopup.style.display='none'; });

watchSrButton.addEventListener('click', () => {
  if(selectedEpisode) window.location.href=`https://vidsrc.xyz/embed/tv/${currentSeriesId}/${currentSeason}/${selectedEpisode.episode_number}?ds_lang=sr`;
});
watchHrButton.addEventListener('click', () => {
  if(selectedEpisode) window.location.href=`https://vidsrc.xyz/embed/tv/${currentSeriesId}/${currentSeason}/${selectedEpisode.episode_number}?ds_lang=hr`;
});

// --- Infinite scroll ---
window.addEventListener('scroll', () => {
  if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 100) {
    currentPage++;
    fetchSeries();
  }
});

// --- Pretraga ---
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    currentSearch = searchInput.value.trim() || null;
    currentPage = 1;
    fetchSeries();
  }, 400);
});

// --- Watch Later ---
document.getElementById('saveToWatchLater').addEventListener('click', () => {
  const list = JSON.parse(localStorage.getItem('watchLater')) || [];
  if(!list.some(x=>x.id===currentSeriesId)){
    list.push({id:currentSeriesId,title:seriesTitle.textContent,poster:seriesPoster.src});
    localStorage.setItem('watchLater',JSON.stringify(list));
    alert(`Film/serija "${seriesTitle.textContent}" dodata u Omiljeno`);
  } else alert(`Film/serija "${seriesTitle.textContent}" već u Omiljeno`);
});

// --- Init ---
document.addEventListener('DOMContentLoaded', () => {
  fetchGenres();
  generateYears();
  fetchSeries();
});
</script>


</body>
</html>
