<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serije - TMDB</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #fff;
        }

        h2, h3 {
            color: #fff;
            font-weight: bold;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Main Content */
        #series-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .series-card {
            position: relative;
            cursor: pointer;
            border-radius: 10px;
            overflow: hidden;
            background-color: #222;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .series-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .series-card h3 {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 18px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }

        .series-card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        /* Popup */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .popup-content {
            background-color: #1f1f1f;
            padding: 20px;
            border-radius: 10px;
            max-width: 800px;
            width: 90%;
            overflow-y: auto;
            max-height: 80%;
            position: relative;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 30px;
            color: #fff;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 50%;
        }

        /* Seasons and Episodes */
        .season-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .season-button {
            padding: 12px 20px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .season-button:hover {
            background-color: #b20710;
        }

        .episode-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .episode-button {
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .episode-button:hover {
            background-color: #e50914;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .series-card {
                width: 100%;
                margin-bottom: 20px;
            }

            .season-button {
                font-size: 14px;
                padding: 10px 15px;
            }

            .episode-button {
                font-size: 12px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div id="series-list"></div>

    <!-- Popup prozor -->
    <div id="popup" class="popup">
        <div class="popup-content">
            <span id="close" class="close">&times;</span>
            <h2 id="series-title"></h2>
            <p id="series-overview"></p>

            <div id="seasons" class="season-list"></div>

            <div id="episodes" class="episode-list"></div>
        </div>
    </div>

    <script>
        const apiKey = '2701858e9bccab54d4d0e4931420a739';
        const apiUrl = 'https://api.themoviedb.org/3/discover/tv?api_key=' + apiKey + '&language=sr-SR&sort_by=popularity.desc&page=1';

        const seriesList = document.getElementById('series-list');
        const popup = document.getElementById('popup');
        const closeBtn = document.getElementById('close');
        const seriesTitle = document.getElementById('series-title');
        const seriesOverview = document.getElementById('series-overview');
        const seasonsContainer = document.getElementById('seasons');
        const episodesContainer = document.getElementById('episodes');
        let currentSeason = 1;
        let currentSeriesId = null;

        async function fetchSeries() {
            const response = await fetch(apiUrl);
            const data = await response.json();
            displaySeries(data.results);
        }

        function displaySeries(series) {
            seriesList.innerHTML = '';
            series.forEach(seriesItem => {
                const card = document.createElement('div');
                card.classList.add('series-card');
                card.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${seriesItem.poster_path}" alt="${seriesItem.name}">
                    <h3>${seriesItem.name}</h3>
                `;
                card.addEventListener('click', () => openPopup(seriesItem));
                seriesList.appendChild(card);
            });
        }

        async function openPopup(seriesItem) {
            seriesTitle.textContent = seriesItem.name;
            seriesOverview.textContent = seriesItem.overview;
            currentSeriesId = seriesItem.id;

            // Preuzmi informacije o sezonama serije
            const seasonsResponse = await fetch(`https://api.themoviedb.org/3/tv/${seriesItem.id}?api_key=${apiKey}&language=sr-SR`);
            const seasonData = await seasonsResponse.json();
            displaySeasons(seasonData.seasons);
            episodesContainer.innerHTML = '';  // Clear episodes initially
            popup.style.display = 'flex';
        }

        function displaySeasons(seasons) {
            seasonsContainer.innerHTML = '';  // Clear the previous season buttons
            seasons.forEach(season => {
                const seasonButton = document.createElement('button');
                seasonButton.classList.add('season-button');
                seasonButton.textContent = `Sezona ${season.season_number}`;
                seasonButton.addEventListener('click', () => loadEpisodes(season.season_number));
                seasonsContainer.appendChild(seasonButton);
            });
        }

        async function loadEpisodes(seasonNumber) {
            currentSeason = seasonNumber;
            const episodesResponse = await fetch(`https://api.themoviedb.org/3/tv/${currentSeriesId}/season/${currentSeason}?api_key=${apiKey}&language=sr-SR`);
            const episodesData = await episodesResponse.json();
            displayEpisodes(episodesData.episodes);
        }

        function displayEpisodes(episodes) {
            episodesContainer.innerHTML = '';  // Clear previous episode list
            episodes.forEach(episode => {
                const episodeButton = document.createElement('button');
                episodeButton.classList.add('episode-button');
                episodeButton.textContent = `Epizoda ${episode.episode_number}: ${episode.name}`;
                episodeButton.addEventListener('click', () => openEpisode(episode));
                episodesContainer.appendChild(episodeButton);
            });
        }

        function openEpisode(episode) {
    const tmdbId = currentSeriesId;
    window.location.href = `https://vidsrc.vip/embed/tv/${tmdbId}/${currentSeason}/${episode.episode_number}`;
}


        closeBtn.addEventListener('click', () => {
            popup.style.display = 'none';
        });

        fetchSeries();
    </script>
</body>
</html>
