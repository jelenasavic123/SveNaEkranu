<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serije Player</title>
<link href="https://vjs.zencdn.net/8.13.0/video-js.css" rel="stylesheet" />
<style>
body { margin:0; font-family:'Segoe UI',sans-serif; background:#141414; color:#fff; }

#seriesGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:15px; padding:15px; justify-items:center; }

.series-card { width:140px; cursor:pointer; text-align:center; border-radius:10px; overflow:hidden; transition:.3s; background:#1a1a1a; position:relative; }
.series-card:hover { transform:scale(1.05); box-shadow:0 0 20px rgba(255,255,255,.6); }
.series-card img { width:100%; height:200px; object-fit:cover; border-bottom:2px solid #333; }

.series-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-weight: bold;
  text-align: center;
  padding: 5px;
  font-size: 0.9em;
  display: none;
}

.series-title { padding:6px; font-size:.9em; font-weight:bold; text-transform:uppercase; }

#videoWrapper { display:none; flex-direction:column; width:90%; max-width:90%; margin:20px auto; background:#000; padding-bottom:20px; }
#playerContainer { position:relative; width:100%; max-width:100%; height:auto; background:black; margin:0 auto; }
.video-js { display:block; width:100%; height:auto; border-radius:8px; max-height:60vh; }
.back-btn { margin:10px auto; padding:8px 16px; background:#222; border:1px solid #555; border-radius:6px; cursor:pointer; font-size:14px; color:#fff; transition:.3s; display:block; }
.back-btn:hover { background:#ff3d00; border-color:#ff3d00; }
#seriesTitle { text-align:center; font-size:1.5em; font-weight:bold; margin:10px 0; }
#episodeList { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:10px; background:#141414; z-index:1; }
.episode-btn { background:#222; color:#fff; border:1px solid #555; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:14px; }
.episode-btn.active { background:#ff3d00; border-color:#ff3d00; }
#seriesMeta { text-align:center; padding:15px; }
#seriesMeta img { max-width:120px; border-radius:8px; margin-top:10px; }

@media(max-width:768px){
  #videoWrapper{width:95%; max-width:95%;} 
  .series-card img{height:180px;} 
  .episode-btn{padding:6px 12px; font-size:13px;} 
  #playerContainer{max-height:40vh;}
}
</style>
</head>
<body>
<div style="display:flex; gap:15px; justify-content:center; margin:20px 0; flex-wrap:wrap;">
    <button onclick="location.href='https://jelenasavic123.github.io/SveNaEkranu/Zadnje.html'" 
        style="background-color: #8A2BE2; color: white; padding: 10px 22px; border: none; border-radius: 6px; cursor: pointer; font-weight:bold;">
        Zadnje Epizode
    </button>

    <button onclick="location.href='https://jelenasavic123.github.io/SveNaEkranu/Serije.html'" 
        style="background-color: #FFA500; color: white; padding: 10px 22px; border: none; border-radius: 6px; cursor: pointer; font-weight:bold;">
        Sve Serije
    </button>
</div>


<div id="seriesGrid"></div>

<div id="videoWrapper">
    <div id="playerContainer">
        <video-js id="video" class="video-js vjs-default-skin" controls></video-js>
    </div>
    <button class="back-btn" onclick="closeVideo()">⬅ Nazad</button>
    <div id="seriesTitle"></div>
    <div id="episodeList"></div>
    <div id="seriesMeta">
        <p id="seriesOverview"></p>
        <p id="seriesInfo"></p>
        <img id="seriesPoster" src="" alt="">
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://vjs.zencdn.net/8.13.0/video.min.js"></script>

<script>
const FIREBASE_URL = "https://jsonserije-4d79b-default-rtdb.firebaseio.com/.json";
const TMDB_API_KEY = "2701858e9bccab54d4d0e4931420a739";
const LIST_REFRESH_INTERVAL = 60*60*1000; // 1h

let player;
let hls;

// RUČNO ODOBRENE SERIJE
const ALLOWED_SERIES = ["Arafta", "Zerhun", "Tasacak Bu Deniz", "Aska Mahkum", "Kizilcik Serbeti"];

// Fetch poster TMDB
async function fetchPoster(seriesName){
    const cacheKey = "poster_" + seriesName;
    const cached = localStorage.getItem(cacheKey);
    if(cached) return JSON.parse(cached);

    try{
        let query = encodeURIComponent(seriesName.replace(/-/g,' '));
        let res = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&language=sr&query=${query}`);
        let data = await res.json();
        let posterData = {poster:'',overview:'',name:seriesName,first_air_date:'',genres:'',popularity:0};
        if(data.results && data.results[0]){
            posterData = {
                poster: data.results[0].poster_path?`https://image.tmdb.org/t/p/w185${data.results[0].poster_path}`:'',
                overview: data.results[0].overview||'',
                name: data.results[0].name||seriesName,
                first_air_date: data.results[0].first_air_date||'',
                genres: (data.results[0].genre_ids||[]).join(','),
                popularity: data.results[0].popularity||0
            };
        }
        localStorage.setItem(cacheKey, JSON.stringify(posterData));
        return posterData;
    } catch(e){ return {poster:'',overview:'',name:seriesName,first_air_date:'',genres:'',popularity:0}; }
}

// Fetch Firebase
async function getSeriesList() {
    const now = Date.now();
    const cached = localStorage.getItem('seriesList');
    const lastFetch = localStorage.getItem('seriesListTime') || 0;
    if (cached && (now - lastFetch < LIST_REFRESH_INTERVAL)) return JSON.parse(cached);

    try {
        const res = await fetch(FIREBASE_URL);
        const data = await res.json();
        const cachedData = cached ? JSON.parse(cached) : null;
        if(JSON.stringify(data)!==JSON.stringify(cachedData)){
            localStorage.setItem('seriesList', JSON.stringify(data));
            localStorage.setItem('seriesListTime', now);
        }
        return data;
    } catch(e) { return cached ? JSON.parse(cached) : {}; }
}

// Load series
async function loadSeries(){
    const data = await getSeriesList();
    const grid = document.getElementById("seriesGrid");
    grid.innerHTML='';

    for(let key in data){
        if(!ALLOWED_SERIES.includes(key) && !ALLOWED_SERIES.includes(data[key].localName)) continue;
        let series = data[key];
        fetchPoster(key).then(posterData=>{
            let card = document.createElement("div");
            card.className = "series-card";
            card.dataset.series = key;
            card.dataset.episodes = JSON.stringify(series.episodes);
            card.dataset.localName = series.localName;
            card.dataset.poster = posterData.poster;
            card.dataset.overview = posterData.overview;
            card.dataset.airdate = posterData.first_air_date;
            card.dataset.genres = posterData.genres;

            // Overlay sa imenom serije i epizodom
            let overlay = document.createElement("div");
            overlay.className = "series-overlay";
            overlay.textContent = series.localName;
            card.appendChild(overlay);

            card.innerHTML += `<img src="${posterData.poster}" loading="lazy">`;
            card.onclick = ()=>openSeries(card);
            grid.appendChild(card);
        });
    }
}

// Open series
function openSeries(card){
    document.getElementById("seriesGrid").style.display='grid';
    const wrapper = document.getElementById("videoWrapper");
    wrapper.style.display='flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });

    const episodeList = document.getElementById("episodeList");
    episodeList.innerHTML='';

    const episodes = JSON.parse(card.dataset.episodes);
    for(let i = episodes.length - 1; i >= 0; i--){
        let url = episodes[i];
        if(!url) continue;
        let btn = document.createElement("button");
        btn.className = "episode-btn";
        let epNum = episodes.length - i;
        btn.textContent = "Epizoda " + epNum;
        btn.dataset.url = url;
        btn.dataset.overlayText = card.dataset.localName + " - Epizoda " + epNum;
        btn.onclick = () => playEpisode(btn, card);
        episodeList.appendChild(btn);
    }

    document.getElementById("seriesTitle").textContent = card.dataset.localName;
    document.getElementById("seriesOverview").textContent = card.dataset.overview;
    document.getElementById("seriesInfo").textContent = `Žanr: ${card.dataset.genres}`;
    document.getElementById("seriesPoster").src = card.dataset.poster;
}

// Play episode
function playEpisode(btn, card){
    document.querySelectorAll(".episode-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    // Prikaz overlay na posteru
    const overlay = card.querySelector(".series-overlay");
    if(overlay){
        overlay.style.display = 'block';
        overlay.textContent = btn.dataset.overlayText;
    }

    let url = btn.dataset.url;
    if(hls){ hls.destroy(); hls = null; }
    player.pause();
    player.src({ src: '', type: 'application/x-mpegURL' });
    player.currentTime(0);

    if(Hls.isSupported()){
        hls = new Hls();
        hls.attachMedia(player.tech().el());
        hls.loadSource(url);
        hls.on(Hls.Events.MANIFEST_PARSED, () => player.play());
    } else {
        player.src({ src: url, type: 'application/x-mpegURL' });
        player.play();
    }

    document.getElementById("videoWrapper").scrollIntoView({behavior:'smooth', block:'start'});
}

// Close video
function closeVideo(){
    document.getElementById("videoWrapper").style.display='none';
    document.getElementById("seriesGrid").style.display='grid';
    document.querySelectorAll(".series-overlay").forEach(ov=>ov.style.display='none');
    if(hls){ hls.destroy(); hls=null; }
    if(player){ player.pause(); player.currentTime(0); }
}

// INIT
loadSeries();
if(!player) player = videojs('video',{autoplay:false,controls:true,fluid:true});
</script>
</body>
</html>
