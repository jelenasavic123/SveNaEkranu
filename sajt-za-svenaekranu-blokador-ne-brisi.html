<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mssovie Recommendations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #fff;
        }
        header {
            background-color: #E50914;
            color: #fff;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        nav {
            background-color: #1e1e1e;
            padding: 10px 0;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 18px;
            margin: 0 15px;
            display: inline-block;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        nav a:hover {
            background-color: #E50914;
        }
        .movie-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .movie-card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.7);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .movie-card:hover {
            transform: scale(1.05);
        }
        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .movie-card h3 {
            font-size: 18px;
            margin: 10px;
        }
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.3s, opacity 0.3s;
        }
        .popup.active {
            visibility: visible;
            opacity: 1;
        }
        .popup-content {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            color: #fff;
            position: relative;
        }
        .popup-content img {
            max-width: 150px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .popup-content h2 {
            margin: 10px 0;
        }
        .popup-content p {
            margin-bottom: 20px;
            color: #ccc;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #E50914;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 50%;
            font-size: 16px;
        }
        .more-info-btn {
            background: #E50914;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            text-decoration: none;
            margin-top: 20px;
            display: inline-block;
        }
        .more-info-btn:hover {
            background: #b20710;
        }
        
        #external-content {
            display: none;
            padding: 20px;
        }
        
        
                nav {
            background-color: #1e1e1e;
            padding: 10px 0;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 18px;
            margin: 0 15px;
            display: inline-block;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        nav a:hover {
            background-color: #E50914;
        }
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            background-color: #E50914;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
<script>
let currentMovies = [];

// Fetch filmove iz TMDB API-ja
async function fetchMoviesByYear(startYear, endYear) {
    const apiKey = '2701858e9bccab54d4d0e4931420a739';
    const response = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${apiKey}&primary_release_date.gte=${startYear}-01-01&primary_release_date.lte=${endYear}-12-31`);
    const data = await response.json();
    currentMovies = data.results;
    displayMovies(currentMovies);
}

// Prikaz filmova sa DPAD podrškom
function displayMovies(movies) {
    const container = document.querySelector('.movie-container');
    container.innerHTML = '';

    movies.forEach(movie => {
        const movieCard = document.createElement('div');
        movieCard.classList.add('movie-card');
        movieCard.setAttribute('tabindex', '0'); // <-- Dodato za DPAD fokus

        const posterPath = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : 'placeholder.jpg';
        movieCard.innerHTML = `
            <img src="${posterPath}" alt="${movie.title}">
            <h3>${movie.title}</h3>
        `;

        movieCard.addEventListener('click', () => showPopup(movie));
        container.appendChild(movieCard);
    });

    // Dodaj tabindex na navigacione linkove
    const navLinks = document.querySelectorAll('nav a');
    navLinks.forEach(link => link.setAttribute('tabindex', '0'));
}

// Popup prikaz filma
function showPopup(movie) {
    const popup = document.querySelector('.popup');
    const popupContent = document.querySelector('.popup-content');

    const posterPath = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : 'placeholder.jpg';
    popupContent.innerHTML = `
        <button class="close-btn" onclick="closePopup()" tabindex="0">X</button>
        <img src="${posterPath}" alt="${movie.title}">
        <h2>${movie.title}</h2>
        <p>${movie.overview || 'No description available.'}</p>
        <p><strong>Release Date:</strong> ${movie.release_date}</p>
        <p><strong>Rating:</strong> ${movie.vote_average}</p>
        <a href="https://www.themoviedb.org/movie/${movie.id}" target="_blank" class="more-info-btn" tabindex="0">More Info & Recommendations</a>
    `;

    popup.classList.add('active');
    popupContent.querySelector('[tabindex="0"]').focus(); // Fokus na prvi element u popup-u
}

// Zatvori popup
function closePopup() {
    const popup = document.querySelector('.popup');
    popup.classList.remove('active');
}

// Promena liste filmova (meni)
function changeMovieList(option) {
    alert(`You selected: ${option}`);
    // Ovde možeš dodati funkcionalnost za promenu liste filmova
}

// Učitavanje eksternog sadržaja u iframe
function loadExternalPage(url) {
    document.body.innerHTML = `
        <button class="back-btn" onclick="window.location.reload()" tabindex="0">Back</button>
        <iframe src="${url}" allowfullscreen></iframe>
    `;
}

// DPAD navigacija: strelice + enter
document.addEventListener('keydown', function(e) {
    const focusable = [...document.querySelectorAll('[tabindex="0"]')];
    if(focusable.length === 0) return;
    let index = focusable.indexOf(document.activeElement);

    switch(e.key) {
        case "ArrowUp":
            index = (index > 0) ? index - 1 : focusable.length - 1;
            focusable[index].focus();
            e.preventDefault();
            break;
        case "ArrowDown":
            index = (index < focusable.length - 1) ? index + 1 : 0;
            focusable[index].focus();
            e.preventDefault();
            break;
        case "ArrowLeft":
            // Po potrebi dodaj left/right logiku za mrežu filmova
            e.preventDefault();
            break;
        case "ArrowRight":
            e.preventDefault();
            break;
        case "Enter":
            document.activeElement.click();
            e.preventDefault();
            break;
    }
});

// Pokreni aplikaciju
document.addEventListener('DOMContentLoaded', () => {
    fetchMoviesByYear(1930, 1970);
});
</script>

</head>
<body>
    <header>
        Movie
    </header>
    
    <!-- Navigation Bar -->
 <nav>
        <a href="javascript:void(0);" onclick="changeMovieList('oldMovies')">Old Movies</a>
        <a href="javascript:void(0);" onclick="loadExternalPage('https://jelenasavic123.github.io/atv/horoskop.html')">Horoscope</a>
        <a href="javascript:void(0);" onclick="loadExternalPage('https://jelenasavic123.github.io/atv/tvprogram.html')">Tv Program</a>
    </nav>


    <nav>

    </nav>

    <div class="movie-container">
        <p>Loading movies...</p>
    </div>

    <div class="popup">
        <div class="popup-content"></div>
    </div>
</body>
</html>
