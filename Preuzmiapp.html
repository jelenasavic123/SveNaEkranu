<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globalni Pretraživač Filmova</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>Pretraživač Filmova</h1>
        
        <input type="text" id="search-query" placeholder="Unesite naziv filma...">
        <button id="search-btn">Pretraži</button>

        <div id="results-container"></div>
        <div id="video-player-container"></div>
    </div>

    <div id="popup-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <iframe id="iframe-player" width="100%" height="600" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const apiKey = '2701858e9bccab54d4d0e4931420a739'; // Vaš TMDb API key
        const searchURL = 'https://api.themoviedb.org/3/search/movie?api_key=' + apiKey + '&query=';

        document.getElementById('search-btn').addEventListener('click', async () => {
            const query = document.getElementById('search-query').value.trim();
            if (!query) return;

            try {
                const response = await fetch(searchURL + encodeURIComponent(query));
                const data = await response.json();

                if (data.results.length === 0) {
                    document.getElementById('results-container').innerHTML = '<p>Nema rezultata.</p>';
                    return;
                }

                displayResults(data.results);
            } catch (error) {
                console.error('Greška prilikom pretrage:', error);
            }
        });

        function displayResults(results) {
            const resultsContainer = document.getElementById('results-container');
            resultsContainer.innerHTML = '';

            results.forEach(movie => {
                const movieCard = document.createElement('div');
                movieCard.className = 'movie-card';

                const movieImg = document.createElement('img');
                movieImg.src = `https://image.tmdb.org/t/p/w200${movie.poster_path}`; // Dodajemo URL za poster
                movieImg.alt = movie.title;
                movieCard.appendChild(movieImg);

                const title = document.createElement('h2');
                title.textContent = movie.title;
                movieCard.appendChild(title);

                const description = document.createElement('p');
                description.textContent = movie.overview;
                movieCard.appendChild(description);

                const releaseDate = document.createElement('p');
                releaseDate.innerHTML = `<strong>Godina:</strong> ${new Date(movie.release_date).getFullYear()}`;
                movieCard.appendChild(releaseDate);

                const rating = document.createElement('p');
                rating.innerHTML = `<strong>IMDB Ocena:</strong> ${movie.vote_average}`;
                movieCard.appendChild(rating);

                const videoButton = document.createElement('button');
                videoButton.textContent = 'Gledaj film';
                videoButton.addEventListener('click', () => openVideo(movie.id));
                movieCard.appendChild(videoButton);

                resultsContainer.appendChild(movieCard);
            });
        }

        async function openVideo(movieId) {
            const videoUrl = `https://vidlink.pro/movie/${movieId}`;
            const modal = document.getElementById('popup-modal');
            const iframe = document.getElementById('iframe-player');

            iframe.src = videoUrl;
            modal.style.display = 'block';

            // Zatvori modal
            document.querySelector('.close').addEventListener('click', () => {
                modal.style.display = 'none';
                iframe.src = ''; // Resetujemo iframe src kada se zatvori
            });
        }
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .results-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .movie-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: calc(33% - 20px);
        }

        .movie-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .movie-card h2 {
            margin-top: 0;
        }

        .movie-card p {
            margin-bottom: 10px;
        }

        #popup-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            width: 80%;
            max-width: 800px;
            margin: 10% auto;
            padding: 20px;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            cursor: pointer;
            color: #000;
        }

        #iframe-player {
            width: 100%;
            height: 600px;
            border: none;
        }
    </style>

</body>
</html>
