<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Dobrodošli! Molimo vas da se prijavite</h1>
    <form id="loginForm">
        <label for="username">Ime:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="accessDuration">Broj dana pristupa:</label>
        <input type="number" id="accessDuration" name="accessDuration" value="30" required><br><br>

        <button type="submit">Prijavi se</button>
    </form>

    <h2>Registrirani korisnici:</h2>
    <ul id="userList"></ul>

    <script>
        // Funkcija za ažuriranje liste korisnika
        function updateUserList() {
            const userList = document.getElementById('userList');
            userList.innerHTML = ''; // Očisti prethodnu listu

            const users = JSON.parse(localStorage.getItem('users')) || [];
            users.forEach((user, index) => {
                const li = document.createElement('li');
                li.textContent = `${user.username} - Pristup traje do: ${new Date(user.accessExpire).toLocaleString()}`;
                
                // Dodaj dugme za uklanjanje korisnika
                const removeButton = document.createElement('button');
                removeButton.textContent = 'Ukloni';
                removeButton.onclick = () => removeUser(index);
                li.appendChild(removeButton);

                userList.appendChild(li);
            });
        }

        // Funkcija za uklanjanje korisnika
        function removeUser(index) {
            const users = JSON.parse(localStorage.getItem('users')) || [];
            users.splice(index, 1); // Ukloni korisnika sa indeksom 'index'
            localStorage.setItem('users', JSON.stringify(users)); // Spremi ažuriranu listu
            updateUserList(); // Ažuriraj listu prikaza
        }

        // Obrada forme za prijavu
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            // Uzimanje podataka sa forme
            const username = document.getElementById('username').value;
            const accessDuration = parseInt(document.getElementById('accessDuration').value);

            // Računanje datuma kada pristup ističe
            const currentDate = new Date();
            currentDate.setDate(currentDate.getDate() + accessDuration); // Dodaj broj dana pristupa

            // Učitavanje postojećih korisnika iz localStorage
            const users = JSON.parse(localStorage.getItem('users')) || [];

            // Dodaj novog korisnika
            users.push({
                username: username,
                accessExpire: currentDate.toISOString()
            });

            // Spremi novu listu korisnika
            localStorage.setItem('users', JSON.stringify(users));

            // Preusmeri na drugu stranicu
            window.location.href = 'druga_stranica.html';
        });

        // Ažuriraj listu korisnika prilikom učitavanja stranice
        window.onload = updateUserList;
    </script>
</body>
</html>
