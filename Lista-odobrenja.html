<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svenaekranu - Logovanje</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    #loginContainer, #mainContent {
      display: none;
    }
    #loginContainer.active, #mainContent.active {
      display: block;
    }
    #errorMsg {
      color: red;
      display: none;
    }
    #statusMessage {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Login Container -->
  <div id="loginContainer" class="active">
    <h2>Prijava</h2>
    <form id="loginForm">
      <label for="email">Email:</label>
      <input type="email" id="email" required>
      <label for="password">Lozinka:</label>
      <input type="password" id="password" required>
      <button type="submit">Prijavi se</button>
    </form>
    <div id="errorMsg">Pogrešna lozinka ili email.</div>
    <div id="statusMessage"></div>
  </div>

  <!-- Main Content -->
  <div id="mainContent">
    <h2>Dobrodošli na test stranicu</h2>
    <button id="logoutButton">Odjavi se</button>
  </div>

  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-analytics.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDMsdqasmtSLNfbf9ICXVMRpKgmiNes85o",
      authDomain: "svenaekranu-64477.firebaseapp.com",
      projectId: "svenaekranu-64477",
      storageBucket: "svenaekranu-64477.appspot.com",
      messagingSenderId: "15230160013",
      appId: "1:15230160013:web:89144bb5079637e787e6c4",
      measurementId: "G-PED21PPQQJ"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    const loginForm = document.getElementById('loginForm');
    const loginContainer = document.getElementById('loginContainer');
    const mainContent = document.getElementById('mainContent');
    const errorMsg = document.getElementById('errorMsg');
    const statusMessage = document.getElementById('statusMessage');
    const logoutButton = document.getElementById('logoutButton');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        showMainContent();
      } else {
        showLoginContainer();
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        localStorage.setItem('user', JSON.stringify(userCredential.user));
        statusMessage.textContent = "Uspešno ste se ulogovali!";
        statusMessage.style.color = "green";
        showMainContent();
      } catch (error) {
        errorMsg.textContent = "Pogrešna lozinka ili email.";
        errorMsg.style.display = 'block';
        statusMessage.textContent = "Pokušajte ponovo.";
        statusMessage.style.color = "red";
      }
    });

    logoutButton.addEventListener('click', async () => {
      await signOut(auth);
      localStorage.removeItem('user');
      showLoginContainer();
      statusMessage.textContent = "Odjavili ste se.";
      statusMessage.style.color = "blue";
    });

    function showMainContent() {
      loginContainer.style.display = 'none';
      mainContent.style.display = 'block';
    }

    function showLoginContainer() {
      mainContent.style.display = 'none';
      loginContainer.style.display = 'block';
    }
  </script>

</body>
</html>
