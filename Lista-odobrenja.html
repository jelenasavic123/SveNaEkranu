<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava kao anonimni korisnik</title>
</head>
<body>
    <h2>Dobrodošli na naš sajt!</h2>
    <button id="loginButton">Prijavi se kao anonimni korisnik</button>

    <div id="nameForm" style="display: none;">
        <h3>Unesite svoje ime</h3>
        <input type="text" id="username" placeholder="Unesite ime" required>
        <button onclick="setUsername()">Spremi ime</button>
    </div>

    <div id="welcomeMessage" style="display: none;">
        <h3>Dobrodošli, <span id="userName"></span>!</h3>
        <p>Pristupate specijalnim sadržajima.</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDMsdqasmtSLNfbf9ICXVMRpKgmiNes85o",
            authDomain: "svenaekranu-64477.firebaseapp.com",
            projectId: "svenaekranu-64477",
            storageBucket: "svenaekranu-64477.firebasestorage.app",
            messagingSenderId: "15230160013",
            appId: "1:15230160013:web:89144bb5079637e787e6c4",
            measurementId: "G-PED21PPQQJ"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Funkcija za anonimnu prijavu
        document.getElementById("loginButton").onclick = function() {
            auth.signInAnonymously()
                .then(() => {
                    alert("Uspešno ste se prijavili kao anonimni korisnik.");
                    document.getElementById("loginButton").style.display = "none";
                    document.getElementById("nameForm").style.display = "block";
                })
                .catch((error) => {
                    console.error("Greška prilikom anonimne prijave: ", error);
                    alert("Došlo je do greške pri prijavi.");
                });
        };

        // Funkcija za dodelu imena korisniku
        function setUsername() {
            const user = auth.currentUser;
            const username = document.getElementById("username").value;

            if (username) {
                // Spremamo ime u Firestore
                db.collection("users").doc(user.uid).set({
                    name: username
                }).then(() => {
                    document.getElementById("userName").textContent = username;
                    document.getElementById("nameForm").style.display = "none";
                    document.getElementById("welcomeMessage").style.display = "block";
                }).catch((error) => {
                    console.error("Greška pri dodeli imena: ", error);
                    alert("Došlo je do greške pri dodeli imena.");
                });
            } else {
                alert("Molimo vas da unesete ime.");
            }
        }

        // Proveravamo da li je korisnik već prijavljen
        auth.onAuthStateChanged((user) => {
            if (user) {
                // Ako je korisnik prijavljen, prikazujemo dobrodošlicu
                db.collection("users").doc(user.uid).get()
                    .then((doc) => {
                        if (doc.exists) {
                            const userName = doc.data().name;
                            document.getElementById("userName").textContent = userName;
                            document.getElementById("welcomeMessage").style.display = "block";
                        }
                    })
                    .catch((error) => {
                        console.error("Greška pri učitavanju podataka korisnika: ", error);
                    });
            }
        });
    </script>
</body>
</html>
