<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Dobrodošli! Molimo vas da se prijavite</h1>
    <form id="loginForm">
        <label for="username">Ime:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="accessDuration">Broj dana pristupa:</label>
        <input type="number" id="accessDuration" name="accessDuration" value="30" required><br><br>

        <button type="submit">Prijavi se</button>
    </form>

    <h2>Registrirani korisnici:</h2>
    <ul id="userList"></ul>

    <script>
        function updateUserList() {
            const userList = document.getElementById('userList');
            userList.innerHTML = ''; // Clear previous list

            const users = JSON.parse(localStorage.getItem('users')) || [];
            users.forEach((user, index) => {
                const li = document.createElement('li');
                li.textContent = `${user.username} - Pristup traje do: ${new Date(user.accessExpire).toLocaleString()}`;
                
                const removeButton = document.createElement('button');
                removeButton.textContent = 'Ukloni';
                removeButton.onclick = () => removeUser(index);
                li.appendChild(removeButton);

                userList.appendChild(li);
            });
        }

        function removeUser(index) {
            const users = JSON.parse(localStorage.getItem('users')) || [];
            users.splice(index, 1); 
            localStorage.setItem('users', JSON.stringify(users)); 
            updateUserList(); 
        }

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const accessDuration = parseInt(document.getElementById('accessDuration').value);

            const currentDate = new Date();
            currentDate.setDate(currentDate.getDate() + accessDuration); 

            const users = JSON.parse(localStorage.getItem('users')) || [];

            users.push({
                username: username,
                accessExpire: currentDate.toISOString()
            });

            localStorage.setItem('users', JSON.stringify(users));

            window.location.href = 'druga_stranica.html';
        });

        window.onload = updateUserList;
    </script>
</body>
</html>
