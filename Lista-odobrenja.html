<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista odobrenja</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .approval-list {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 11px rgba(0, 0, 0, 0.7);
            width: 300px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: none;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            padding: 5px 0;
        }
    </style>
</head>
<body>

    <div class="approval-list">
        <h2>Lista odobrenih korisnika</h2>
        <ul id="user-list">
            <!-- Lista će se popunjavati dinamički -->
        </ul>
        <h3>Dodajte korisničko ime:</h3>
        <input type="text" id="new-username" placeholder="Unesite ime">
        <button onclick="addUsername()">Dodaj</button>
    </div>

    <script>
        const allowedUsersKey = 'allowedUsers'; // Ključ za localStorage

        function getAllowedUsers() {
            const storedUsers = localStorage.getItem(allowedUsersKey);
            return storedUsers ? JSON.parse(storedUsers) : [];
        }

        function saveAllowedUsers(users) {
            localStorage.setItem(allowedUsersKey, JSON.stringify(users));
        }

        function populateUserList() {
            const userList = document.getElementById('user-list');
            userList.innerHTML = ''; // Očisti listu pre dodavanja
            const allowedUsers = getAllowedUsers();
            allowedUsers.forEach(user => {
                const listItem = document.createElement('li');
                listItem.textContent = user;
                userList.appendChild(listItem);
            });
        }

        function addUsername() {
            const newUsername = document.getElementById('new-username').value.trim();
            if (newUsername && !getAllowedUsers().includes(newUsername)) {
                const allowedUsers = getAllowedUsers();
                allowedUsers.push(newUsername);
                saveAllowedUsers(allowedUsers); // Sačuvaj u localStorage
                populateUserList(); // Osveži listu
                document.getElementById('new-username').value = ''; // Očisti polje za unos
            }
        }

        populateUserList(); // Popuni listu prilikom učitavanja stranice
    </script>

</body>
</html>
