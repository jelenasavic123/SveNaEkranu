<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SveNaEkranu - Prijava</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js"></script>
  
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #141414;
      color: white;
      font-family: 'Helvetica', sans-serif;
      margin: 0;
    }

    form {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      width: 300px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 4px;
    }

    button {
      background-color: #e50914;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
    }

    button:hover {
      background-color: #f40612;
    }

    #errorMsg {
      color: red;
      display: none;
    }

    #mainContent {
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="loginContainer">
    <h2>Prijava</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Lozinka" required>
      <button type="submit" id="loginButton">Prijava</button>
    </form>
    <p id="errorMsg">Pogrešan email ili lozinka.</p>
  </div>

  <div id="mainContent">
    <h1>Dobrodošli na SveNaEkranu</h1>
    <p>Test stranica</p>
    <button id="logoutButton">Odjavi se</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDMsdqasmtSLNfbf9ICXVMRpKgmiNes85o",
      authDomain: "svenaekranu-64477.firebaseapp.com",
      projectId: "svenaekranu-64477",
      storageBucket: "svenaekranu-64477.appspot.com",
      messagingSenderId: "15230160013",
      appId: "1:15230160013:web:89144bb5079637e787e6c4",
      measurementId: "G-PED21PPQQJ"
    };

    import { initializeApp } from "firebase/app";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth();

    const loginForm = document.getElementById('loginForm');
    const loginContainer = document.getElementById('loginContainer');
    const mainContent = document.getElementById('mainContent');
    const errorMsg = document.getElementById('errorMsg');
    const logoutButton = document.getElementById('logoutButton');

    // Check authentication state
    onAuthStateChanged(auth, (user) => {
      if (user) {
        showMainContent();
      } else {
        showLoginContainer();
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        localStorage.setItem('user', JSON.stringify(userCredential.user));
        showMainContent();
      } catch (error) {
        errorMsg.textContent = error.message;
        errorMsg.style.display = 'block';
      }
    });

    logoutButton.addEventListener('click', async () => {
      await signOut(auth);
      localStorage.removeItem('user');
      showLoginContainer();
    });

    function showMainContent() {
      loginContainer.style.display = 'none';
      mainContent.style.display = 'block';
    }

    function showLoginContainer() {
      mainContent.style.display = 'none';
      loginContainer.style.display = 'block';
    }
  </script>

</body>
</html>
