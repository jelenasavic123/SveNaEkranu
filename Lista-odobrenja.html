<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 2 - Kontrola korisnika</title>
    <script>
        function loadApprovedUsers() {
            let approvedUsers = JSON.parse(localStorage.getItem('approvedUsers')) || [];
            return approvedUsers;
        }

        function displayApprovedUsers() {
            const approvedUsers = loadApprovedUsers();
            const listElement = document.getElementById('approvedUsersList');
            listElement.innerHTML = ''; // Clear existing list

            if (approvedUsers.length === 0) {
                listElement.innerHTML = '<li>Nema odobrenih korisnika.</li>';
            } else {
                approvedUsers.forEach(user => {
                    const listItem = document.createElement('li');
                    listItem.textContent = user;
                    listElement.appendChild(listItem);
                });
            }
        }

        function removeUser(user) {
            let approvedUsers = loadApprovedUsers();
            approvedUsers = approvedUsers.filter(u => u !== user);
            localStorage.setItem('approvedUsers', JSON.stringify(approvedUsers));
            displayApprovedUsers();
        }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        input {
            margin-bottom: 10px;
            padding: 8px;
            width: 200px;
            border: none;
            border-radius: 5px;
        }

        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }
    </style>
</head>
<body>

    <h1>Lista odobrenih korisnika</h1>
    <ul id="approvedUsersList"></ul>

    <h2>Uklonite korisnike</h2>
    <input type="text" id="removeUserInput" placeholder="Unesite korisničko ime za uklanjanje" required>
    <button onclick="removeUser(document.getElementById('removeUserInput').value.trim().toLowerCase())">Ukloni korisnika</button>

    <script>
        displayApprovedUsers();
    </script>

</body>
</html>
