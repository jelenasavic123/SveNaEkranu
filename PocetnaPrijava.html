<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #fff;
        }
        header {
            background-color: #E50914;
            color: #fff;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        nav {
            background-color: #1e1e1e;
            padding: 10px 0;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 18px;
            margin: 0 15px;
            display: inline-block;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        nav a:hover {
            background-color: #E50914;
        }
        .movie-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .movie-card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.7);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .movie-card:hover {
            transform: scale(1.05);
        }
        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .movie-card h3 {
            font-size: 18px;
            margin: 10px;
        }
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.3s, opacity 0.3s;
        }
        .popup.active {
            visibility: visible;
            opacity: 1;
        }
       .popup-content {
    background: #222;
    padding: 20px;
    border-radius: 10px;
    max-width: 90vw;  /* Width of the popup in percentage of viewport width */
    max-height: 90vh; /* Height of the popup in percentage of viewport height */
    width: 90%;       /* Ensure width is within 90% of the screen */
    height: 90%;      /* Ensure height is within 90% of the screen */
    text-align: center;
    color: #fff;
    position: relative;
    overflow-y: auto;  /* In case content exceeds the height, it will be scrollable */
}

        .popup-content img {
            max-width: 80px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .popup-content h2 {
            margin: 10px 0;
        }
        .popup-content p {
            margin-bottom: 20px;
            color: #ccc;
        }
        .close-btn {
            background: #E50914;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        .close-btn:focus {
            outline: 2px solid #fff;
        }
        .more-info-btn {
            background: #E50914;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            text-decoration: none;
            margin-top: 20px;
            display: inline-block;
        }
        .more-info-btn:hover {
            background: #b20710;
        }
        nav button {
            background-color: #E50914;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        nav button:hover {
            background-color: #b20710;
        }

        .actors-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .actor {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 10px;
        }

        .actor-avatar {
            width: 80px;
            height: 80px;
            margin-bottom: 5px;
            border-radius: 50%;
            object-fit: cover;
        }

        .actor-name {
            font-size: 14px;
            color: #ccc;
        }
    </style>
 <script>
    let currentMovies = [];
    const apiKey = '2701858e9bccab54d4d0e4931420a739';

    // Fetch movies by year (excluding adult content)
    async function fetchMoviesByYear(startYear, endYear) {
        endYear = Math.min(endYear, 2000); // Limit year to 2000
        const response = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${apiKey}&primary_release_date.gte=${startYear}-01-01&primary_release_date.lte=${endYear}-12-31&adult=false`);
        const data = await response.json();
        currentMovies = data.results;
        displayMovies(currentMovies);
    }

    // Fetch movies by genre (excluding adult content)
    async function fetchMoviesByGenre(genreId) {
        const response = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${apiKey}&with_genres=${genreId}&primary_release_date.lte=2000-12-31&adult=false`);
        const data = await response.json();
        currentMovies = data.results;
        displayMovies(currentMovies);
    }

    // Display movies
    function displayMovies(movies) {
        const container = document.querySelector('.movie-container');
        container.innerHTML = '';

        if (movies.length === 0) {
            container.innerHTML = '<p>No movies found.</p>';
            return;
        }

        movies.forEach(movie => {
            const movieCard = document.createElement('div');
            movieCard.classList.add('movie-card');

            const posterPath = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : 'placeholder.jpg';
            movieCard.innerHTML = `
                <img src="${posterPath}" alt="${movie.title}">
                <h3>${movie.title}</h3>
            `;

            movieCard.addEventListener('click', () => showPopup(movie));
            container.appendChild(movieCard);
        });
    }

    // Show popup with movie details and actors' avatars
    async function showPopup(movie) {
        const popup = document.querySelector('.popup');
        const popupContent = document.querySelector('.popup-content');

        const posterPath = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : 'placeholder.jpg';

        // Fetching the movie's cast (actors)
        const castResponse = await fetch(`https://api.themoviedb.org/3/movie/${movie.id}/credits?api_key=${apiKey}`);
        const castData = await castResponse.json();
        const actors = castData.cast.slice(0, 4); // Get the top 4 actors

        // Create a list of actor avatars and names
        const actorsHtml = actors.map(actor => `
            <div class="actor">
                <img src="https://image.tmdb.org/t/p/w200${actor.profile_path}" alt="${actor.name}" class="actor-avatar">
                <p class="actor-name">${actor.name}</p>
            </div>
        `).join('');

        popupContent.innerHTML = `
            <img src="${posterPath}" alt="${movie.title}">
            <h2>${movie.title}</h2>
            <p>${movie.overview || 'No description available.'}</p>
            <p><strong>Release Date:</strong> ${movie.release_date}</p>
            <p><strong>Rating:</strong> ${movie.vote_average}</p>
            <div class="actors-container">
                ${actorsHtml}
            </div>
            <button class="close-btn" onclick="closePopup()">Exit</button>
        `;

        popup.classList.add('active');

        // Focus on close button
        const closeButton = popupContent.querySelector('.close-btn');
        closeButton.focus();

        // Event listener for Escape key
        document.addEventListener('keydown', handleEscape);
    }

    // Close popup
    function closePopup() {
        const popup = document.querySelector('.popup');
        popup.classList.remove('active');
        document.removeEventListener('keydown', handleEscape);
    }

    // Handle Escape key
    function handleEscape(event) {
        if (event.key === 'Escape') {
            closePopup();
        }
    }

    // Add event listeners
    document.addEventListener('DOMContentLoaded', () => {
        // Fetch action movies first on page load
        fetchMoviesByGenre(28); // Action genre

        // Genre buttons for filtering movies
        document.getElementById('genre-action').addEventListener('click', () => fetchMoviesByGenre(28)); // Action
        document.getElementById('genre-comedy').addEventListener('click', () => fetchMoviesByGenre(35)); // Comedy
        document.getElementById('genre-drama').addEventListener('click', () => fetchMoviesByGenre(18)); // Drama
        document.getElementById('genre-scifi').addEventListener('click', () => fetchMoviesByGenre(878)); // Sci-Fi
        document.getElementById('genre-horror').addEventListener('click', () => fetchMoviesByGenre(27)); // Horror
        document.getElementById('genre-adventure').addEventListener('click', () => fetchMoviesByGenre(12)); // Adventure
    });
</script>


</head>
<body>

    <header>
        Movie Recommendations
    </header>
    <nav>
        <button id="genre-action">Action</button>
        <button id="genre-comedy">Comedy</button>
        <button id="genre-drama">Drama</button>
        <button id="genre-scifi">Sci-Fi</button>
        <button id="genre-horror">Horror</button>
        <button id="genre-adventure">Adventure</button>
    </nav>
    <div class="movie-container">
        <p>Loading movies...</p>
    </div>
    <div class="popup">
        <div class="popup-content"></div>
    </div>
    
</body>
</html>
