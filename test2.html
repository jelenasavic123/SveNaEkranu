<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Movies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .movie-item {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            width: 90px; /* Fiksna širina za svako polje */
            height: 135px; /* Fiksna visina za svako polje (širina * 1.5 ratio) */
            display: inline-block;
            transition: transform 0.3s ease-in-out;
            scroll-snap-align: center;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .movie-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Da se slika prikazuje proporcionalno i bez deformacija */
        }

        #netflix-top-movies-container,
        #marvel-top-movies-container,
        #hulu-top-movies-container,
        #disney-top-movies-container,
        #appletvplus-top-movies-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 20px;
            scroll-snap-type: x mandatory;
        }

        @media (max-width: 600px) {
            .movie-item {
                width: 80px; /* Manji ekran - smanjuje širinu */
                height: 120px; /* Manji ekran - proporcionalno smanjuje visinu */
            }
        }

        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 28px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
        }

        iframe {
            width: 100%;
            height: 500px;
        }
    </style>
</head>
<body>

    <div id="netflix-top-movies-container"></div>
    <div id="marvel-top-movies-container"></div>
    <div id="hulu-top-movies-container"></div>
    <div id="disney-top-movies-container"></div>
    <div id="appletvplus-top-movies-container"></div>

    <!-- Modal za video sadržaj -->
    <div id="popup-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <iframe id="iframe-player" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const apiKey = '2701858e9bccab54d4d0e4931420a739';

        async function fetchTopMovies(platformId) {
            const apiUrl = `https://api.themoviedb.org/3/discover/movie?api_key=${apiKey}&with_networks=${platformId}`;
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                return data.results;
            } catch (error) {
                console.error(`Greška prilikom učitavanja top filmova sa platforme ID ${platformId}:`, error);
                return [];
            }
        }

        async function displayTopMovies(movies, containerId, platformName) {
            const container = document.getElementById(containerId);

            if (!container) return;

            movies.forEach(movie => {
                const movieElement = document.createElement('div');
                movieElement.classList.add('movie-item');
                movieElement.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}" />
                    <p>${movie.title}</p>
                `;

                // Dodajemo event listener za otvaranje videa
                movieElement.addEventListener('click', () => openVideo(movie.id));

                container.appendChild(movieElement);
            });
        }

        async function loadMoreMovies(platformName, containerId) {
            const platforms = {
                'Netflix': 8,
                'Marvel': 30,
                'Hulu': 1024,
                'Disney': 337,
                'Apple TV+': 140
            };

            const platformId = platforms[platformName];
            const movies = await fetchTopMovies(platformId);
            displayTopMovies(movies, containerId, platformName);
        }

        async function openVideo(movieId) {
            const videoUrl = `https://vidlink.pro/movie/${movieId}`;
            const modal = document.getElementById('popup-modal');
            const iframe = document.getElementById('iframe-player');

            iframe.src = videoUrl;
            modal.style.display = 'block';

            // Zatvori modal
            document.querySelector('.close').addEventListener('click', () => {
                modal.style.display = 'none';
                iframe.src = ''; // Resetujemo iframe src kada se zatvori
            });
        }

        // Dodajemo event listener za scroll event
        document.addEventListener('scroll', async () => {
            const containers = [
                { id: 'netflix-top-movies-container', name: 'Netflix' },
                { id: 'marvel-top-movies-container', name: 'Marvel' },
                { id: 'hulu-top-movies-container', name: 'Hulu' },
                { id: 'disney-top-movies-container', name: 'Disney' },
                { id: 'appletvplus-top-movies-container', name: 'Apple TV+' }
            ];

            for (let container of containers) {
                const element = document.getElementById(container.id);
                if (element.scrollLeft + element.clientWidth >= element.scrollWidth) {
                    await loadMoreMovies(container.name, container.id);
                }
            }
        });

        // Pozivanje funkcije za učitavanje i prikazivanje filmova
        (async function initializePlatformTopMovies() {
            const platforms = [
                { id: 8, name: 'Netflix' },   // Netflix ID
                { id: 30, name: 'Marvel' },    // Marvel ID
                { id: 1024, name: 'Hulu' },    // Hulu ID
                { id: 337, name: 'Disney' },   // Disney ID
                { id: 140, name: 'Apple TV+' } // Apple TV+ ID
            ];

            for (let platform of platforms) {
                const movies = await fetchTopMovies(platform.id);
                if (movies.length > 0) {
                    displayTopMovies(movies, `${platform.name.toLowerCase()}-top-movies-container`, platform.name);
                }
            }
        })();
    </script>

</body>
</html>
