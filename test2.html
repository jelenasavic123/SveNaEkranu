<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pošaljite zahtev za pristup</title>
    <!-- Firebase v10 Kompatibilni Skripti -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <style>


        /* Style for the popup */
        #popup {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.8);
            max-width: 400px;
            width: 100%;
            margin: 20px;
            display: none;
        }

        #popup h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        input[type="email"] {
            padding: 10px;
            width: 100%;
            margin-bottom: 10px;
            border: none;
            border-radius: 8px;
            background-color: #333;
            color: white;
        }

        button {
            background-color: #f39c12;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #e67e22;
        }

        /* Content Section after login */
        #content {
            display: none;
        }

        .buttons-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin-top: 50px;
        }

        .button-item {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            width: 200px;
            margin: 10px;
            box-sizing: border-box;
        }

        .button-item img {
            width: 100%;
            height: auto;
            filter: brightness(0.8);
            transition: filter 0.3s ease;
        }

        .button-item:hover img {
            filter: brightness(1);
        }

        .button-item h3 {
            padding: 10px;
            margin: 0;
            font-size: 14px;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
        }


    </style>
</head>
<body>

    <!-- Popup prozor za unos emaila -->
    <div id="popup">
        <h2>Molimo Vas da unesete Vaš email</h2>
        <form id="accessRequestForm">
            <label for="email">Vaš email:</label>
            <input type="email" id="email" required placeholder="Unesite vaš email">
            <button type="submit">Pošaljite zahtev</button>
        </form>
        <div id="notification"></div>
    </div>

    <!-- Sadržaj koji se prikazuje korisnicima koji imaju pristup -->
    <div id="content">
        <header>
            <h1>Izaberite sadržaj</h1>
            <p>i započnite svoju filmsku avanturu.</p>
        </header>

        <main>
            <div class="buttons-section">
                <div class="button-item" onclick="location.href='https://jelenasavic123.github.io/SveNaEkranu/stranifilmovi-pocetna.html'">
                    <img src="https://jelenasavic123.github.io/SveNaEkranu/strano.jpg" alt="Netflix Movies">
                    <h3>Strani Sadrzaj</h3>
                </div>
                <div class="button-item" onclick="location.href='https://rivestream.live/iptv'">
                    <img src="https://jelenasavic123.github.io/SveNaEkranu/turskeserije.jpg" alt="Netflix Series">
                    <h3>Turski Sadrzaj</h3>
                </div>
                <div class="button-item" onclick="location.href='#domace-serije'">
                    <img src="https://jelenasavic123.github.io/SveNaEkranu/domaci.JPG" alt="Domaće Serije">
                    <h3>Domaci Sadrzaj</h3>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Firebase konfiguracija
        const firebaseConfig = {
            apiKey: "AIzaSyDMsdqasmtSLNfbf9ICXVMRpKgmiNes85o",
            authDomain: "svenaekranu-64477.firebaseapp.com",
            projectId: "svenaekranu-64477",
            storageBucket: "svenaekranu-64477.firebasestorage.app",
            messagingSenderId: "15230160013",
            appId: "1:15230160013:web:89144bb5079637e787e6c4",
            measurementId: "G-PED21PPQQJ"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Funkcija za zatvaranje popup prozora
        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }

        // Funkcija za proveru da li korisnik ima pristup
        function checkAccess(email) {
            db.collection("accessRequests").where("email", "==", email).get().then(snapshot => {
                if (snapshot.empty) {
                    // Ako nema u bazi, omogućiti mu da pošalje zahtev
                    document.getElementById('popup').style.display = "block";
                    document.getElementById('content').style.display = "none";
                    localStorage.removeItem('userEmail'); // Uklanjamo email iz localStorage
                } else {
                    snapshot.forEach(doc => {
                        const status = doc.data().status;
                        if (status === "approved") {
                            // Ako je pristup odobren, omogućiti sadržaj
                            document.getElementById('content').style.display = "block"; // Omogućavanje pristupa sadržaju
                            document.getElementById('popup').style.display = "none"; // Sakrijemo popup
                            localStorage.setItem('userEmail', email); // Spremamo email u localStorage
                        } else if (status === "pending") {
                            // Ako je zahtev još uvek na čekanju
                            document.getElementById('notification').innerHTML = "<p style='color: orange;'>Vaš zahtev je još uvek u fazi čekanja. Molimo sačekajte.</p>";
                            document.getElementById('content').style.display = "none"; // Ne prikazujemo sadržaj dok zahtev nije odobren
                        }
                    });
                }
            });
        }

        // Provera da li je korisnik već odobren prilikom učitavanja stranice
        const currentEmail = localStorage.getItem('userEmail');
        if (currentEmail) {
            // Ako email postoji u localStorage, proveravamo status
            checkAccess(currentEmail);
        } else {
            // Ako nije u localStorage, prikazuje popup za unos email-a
            document.getElementById('popup').style.display = "block";
        }

        // Funkcija za slanje zahteva za pristup
        document.getElementById('accessRequestForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const notificationDiv = document.getElementById('notification');

            if (email) {
                db.collection("accessRequests").add({
                    email: email,
                    status: "pending"
                })
                .then(() => {
                    notificationDiv.innerHTML = "<p style='color: green;'>Zahtev je uspešno poslat! Čekajte na odobrenje.</p>";
                    document.getElementById('email').value = "";
                    closePopup();
                    
                    // Proveriti da li je email odobren
                    checkAccess(email);
                })
                .catch((error) => {
                    console.error("Greška prilikom slanja zahteva: ", error);
                    notificationDiv.innerHTML = "<p style='color: red;'>Došlo je do greške, pokušajte ponovo.</p>";
                });
            } else {
                notificationDiv.innerHTML = "<p style='color: red;'>Molimo vas unesite email.</p>";
            }
        });

        // Funkcija za brisanje korisničkog pristupa
        function deleteUserAccess(email) {
            db.collection("accessRequests").where("email", "==", email).get().then(snapshot => {
                snapshot.forEach(doc => {
                    doc.ref.delete(); // Brišemo email iz baze
                    localStorage.removeItem('userEmail'); // Brišemo iz localStorage
                    location.reload(); // Reload stranice
                });
            });
        }
    </script>
</body>
</html>
