<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava za pristup</title>
    <script>
        function checkUserAccess() {
            const approvedUsers = ['korisnik1', 'korisnik2', 'korisnik3']; // Lista ovlašćenih korisnika
            const userInput = document.getElementById('nameInput').value.trim().toLowerCase();

            if (approvedUsers.includes(userInput)) {
                window.location.href = 'https://jelenasavic123.github.io/SveNaEkranu/test2.html'; // Redirect to page2 if user is approved
            } else {
                alert('Korisničko ime nije odobreno. Molimo pokušajte ponovo.');
            }
        }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        input {
            margin-bottom: 10px;
            padding: 8px;
            width: 200px;
            border: none;
            border-radius: 5px;
        }

        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Prijava za pristup</h1>
    <input type="text" id="nameInput" placeholder="Unesite korisničko ime" required>
    <button onclick="checkUserAccess()">Prijavi se</button>

</body>
</html>
