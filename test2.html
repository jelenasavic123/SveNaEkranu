<!DOCTYPE html>

<head>

    <title>Firebase User Notification</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
        }

        #hiddenContent {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Site!</h1>

    <!-- Popup -->
    <div id="popup">
        <h2>Access Pending</h2>
        <p>Please wait for admin approval before proceeding.</p>
        <button onclick="closePopup()">Close</button>
    </div>

    <!-- Hidden content -->
    <div id="hiddenContent">
        <p>Welcome! You now have access to the content.</p>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDMsdqasmtSLNfbf9ICXVMRpKgmiNes85o",
            authDomain: "svenaekranu-64477.firebaseapp.com",
            projectId: "svenaekranu-64477",
            storageBucket: "svenaekranu-64477.firebasestorage.app",
            messagingSenderId: "15230160013",
            appId: "1:15230160013:web:89144bb5079637e787e6c4",
            measurementId: "G-PED21PPQQJ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function checkUserExistence() {
            try {
                const userId = localStorage.getItem('userId') || 'guest_' + Date.now();
                localStorage.setItem('userId', userId);

                db.collection('userVisits')
                    .where('userId', '==', userId)
                    .get()
                    .then(querySnapshot => {
                        if (!querySnapshot.empty) {
                            const data = querySnapshot.docs[0].data();
                            if (data.status === 'approved') {
                                grantAccess();
                            } else {
                                showPopup();
                            }
                        } else {
                            db.collection('userVisits').add({ userId, status: 'pending' });
                            showPopup();
                        }
                    });
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function grantAccess() {
            document.getElementById('popup').style.display = 'none';
            document.getElementById('hiddenContent').style.display = 'block';
        }

        function showPopup() {
            document.getElementById('popup').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }

        window.onload = checkUserExistence;
    </script>
</body>
</html>
