<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prijava na stranici</title>
  <style>
    /* CSS za popup */
    #popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.7); /* Tamna pozadina za overlay */
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 1000; /* Overlay za popup */
    }

    #popup-content {
      background: #121212;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
    }

    #nickname {
      width: 80%; 
      padding: 10px; 
      margin-top: 10px;
      border: none;
      border-radius: 5px;
    }

    button {
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px 20px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #0056b3;
    }

    #content {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Popup for nickname -->
  <div id="popup">
    <div id="popup-content">
      <h2>Unesite nadimak</h2>
      <input type="text" id="nickname" placeholder="Unesite svoj nadimak">
      <button onclick="signIn()">Prijavi se</button>
      <p id="status"></p>
    </div>
  </div>

  <!-- Content section (hidden until login is successful) -->
  <div id="content">
    <header>
      <h1>Izaberite sadržaj</h1>
      <p>i započnite svoju filmsku avanturu.</p>
    </header>

    <main>
      <div class="buttons-section">
        <div class="button-item" onclick="location.href='https://jelenasavic123.github.io/SveNaEkranu/stranifilmovi-pocetna.html'">
          <img src="https://jelenasavic123.github.io/SveNaEkranu/strano.jpg" alt="Netflix Movies">
          <h3>Strani Sadrzaj</h3>
        </div>
        <div class="button-item" onclick="location.href='https://rivestream.live/iptv'">
          <img src="https://jelenasavic123.github.io/SveNaEkranu/turskeserije.jpg" alt="Netflix Series">
          <h3>Turski Sadrzaj</h3>
        </div>
        <div class="button-item" onclick="location.href='#domace-serije'">
          <img src="https://jelenasavic123.github.io/SveNaEkranu/domaci.JPG" alt="Domaće Serije">
          <h3>Domaci Sadrzaj</h3>
        </div>
      </div>
    </main>
  </div>

  <script>
    // JavaScript za proveru korisničkog nadimka
    window.onload = function() {
      const nicknameInput = document.getElementById('nickname');
      const popup = document.getElementById('popup');
      const content = document.getElementById('content');
      const status = document.getElementById('status');

      function signIn() {
        const nickname = nicknameInput.value.trim();

        if (nickname) {
          localStorage.setItem('nickname', nickname);

          // Provera korisničkog nadimka u bazi ili nekoj funkciji
          db.collection('nicknames').doc(nickname).get()
            .then((doc) => {
              if (doc.exists && doc.data().available) {
                content.style.display = 'block';  // Prikaži sadržaj
                popup.style.display = 'none';     // Sakrij popup
              } else {
                localStorage.removeItem('nickname');  // Ako nadimak nije validan
                status.textContent = 'Nadimak nije validan ili je već zauzet.';
              }
            })
            .catch((error) => {
              console.error('Greška prilikom provere nadimka: ', error);
              status.textContent = 'Došlo je do greške. Pokušajte ponovo.';
            });
        } else {
          status.textContent = 'Molimo unesite nadimak.';
        }
      }

      const savedNickname = localStorage.getItem('nickname');
      if (savedNickname) {
        db.collection('nicknames').doc(savedNickname).get()
          .then((doc) => {
            if (doc.exists && doc.data().available) {
              content.style.display = 'block';  // Prikaži sadržaj
              popup.style.display = 'none';     // Sakrij popup
            } else {
              popup.style.display = 'flex';     // Ako nije validan nadimak, ponovo prikazi popup
            }
          })
          .catch((error) => {
            console.error('Greška prilikom provere nadimka: ', error);
            popup.style.display = 'flex';     // Ako dođe do greške, ponovo prikazi popup
          });
      } else {
        popup.style.display = 'flex';  // Ako nema nadimka u lokalnom storageu, prikazujemo popup
      }
    };
  </script>

</body>
</html>
