<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izaberite sadržaj i započnite svoju filmsku avanturu danas.</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: url('https://jelenasavic123.github.io/SveNaEkranu/Pozadina.JPG') center center/cover no-repeat;
            overflow: hidden;
        }

        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .preloader img {
            width: 200px; /* Adjust size as needed */
            animation: fadeInOut 2s infinite ease-in-out;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 4px 8px rgba(255, 255, 255, 0.5);
        }

        header p {
            font-size: 18px;
            margin: 0;
            color: #bbb;
        }
        
        .container {
    display: grid;
    place-items: center; /* Horizontalno i vertikalno centriranje */
    height: 100vh;
}


        .buttons-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 60%;
        }
        

        .button-item {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 20%;
        }

        .button-item img {
            width: 100%;
            height: auto;
            filter: brightness(0.8);
        }

        .button-item h3 {
            padding: 20px;
            margin: 0;
            font-size: 10px;
            color: #fff;
        }

        .button-item:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.7);
        }

        footer {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            text-align: center;
            padding: 20px;
            position: absolute;
            bottom: 0;
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .netflix-logo {
            width: 100px;
        }
    </style>
</head>
<body>

    <div class="preloader">
        <img class="https://jelenasavic123.github.io/SveNaEkranu/Logo.png" src="https://jelenasavic123.github.io/SveNaEkranu/Logo.png" alt="Your Netflix Clone Logo">
    </div>

    <header>
        <h1>Izaberite sadržaj </h1>
        <p>i započnite svoju filmsku avanturu.</p>
    </header>

    <main>
        <div class="buttons-section">
            <div class="button-item" onclick="location.href='#netflix-movies'">
                <img src="https://jelenasavic123.github.io/SveNaEkranu/strano.jpg" alt="Netflix Movies">
                <h3>Strani Sadrzaj</h3>
            </div>
            <div class="button-item" onclick="location.href='#netflix-series'">
                <img src="https://jelenasavic123.github.io/SveNaEkranu/turskeserije.jpg" alt="Netflix Series">
                <h3>Turski Sadrzaj</h3>
            </div>
            <div class="button-item" onclick="location.href='#domace-serije'">
                <img src="https://jelenasavic123.github.io/SveNaEkranu/domaci.JPG" alt="Domaće Serije">
                <h3>Domaci Sadrzaj</h3>
            </div>
  
        </div>
    </main>

    <footer>
        &copy; 2025 Your Netflix Clone. All rights reserved.
    </footer>

    <script>
        window.onload = function() {
            const preloader = document.querySelector('.preloader');
            setTimeout(() => {
                preloader.style.opacity = '0';
                preloader.style.visibility = 'hidden';
                setTimeout(() => {
                    preloader.remove();
                }, 600);
            }, 2000); // 2000ms = 2 seconds
        };
    </script>

</body>
</html>
