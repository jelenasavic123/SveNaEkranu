<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unesite svoje ime</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        form {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        input {
            width: 200px;
            padding: 10px;
            margin: 10px;
            border: none;
            border-radius: 8px;
        }

        button {
            padding: 10px 20px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>

    <h1>Unesite svoje ime</h1>
    <form id="nameForm">
        <input type="text" id="nameInput" placeholder="Vaše ime" required>
        <button type="submit">Pošalji</button>
    </form>

    <script>
        document.getElementById('nameForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent form from submitting normally
            checkNameApproval();
        });

        function checkNameApproval() {
            const approvedNames = ['YourName1', 'YourName2', 'YourName3']; // Replace with real approved names
            const userInput = document.getElementById('nameInput').value;
            
            if (approvedNames.includes(userInput)) {
                window.location.href = 'page2.html'; // Redirect to page2
            } else {
                alert('Ime nije odobreno. Molimo pokušajte ponovo.');
            }
        }
    </script>

</body>
</html>
