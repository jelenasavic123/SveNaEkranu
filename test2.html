<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Druga stranica</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: url('https://jelenasavic123.github.io/SveNaEkranu/pocetnahd1.JPG') center center/cover no-repeat;
            overflow: hidden;
            transition: background 0.3s ease-in-out;
        }

        /* Preostalo vreme */
        #remainingTime {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #ffcc00;
            padding: 12px 18px;
            border-radius: 25px;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            transform: translateY(-20px);
            opacity: 0;
            animation: fadeIn 0.5s forwards, slideIn 1s forwards;
        }

        /* Keyframe Animation */
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            0% {
                transform: translateY(-20px);
            }
            100% {
                transform: translateY(0);
            }
        }

        /* Login Section */
        #loginSection {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
            text-align: center;
            max-width: 400px;
            width: 100%;
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        #loginSection h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        #loginSection input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #333;
            color: white;
            font-size: 16px;
        }

        #loginSection button {
            padding: 12px 20px;
            background-color: #00bcd4;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #loginSection button:hover {
            background-color: #0097a7;
        }

        /* Content Section */
        #content {
            display: none;
            text-align: center;
            width: 100%;
        }

        #content header {
            margin-bottom: 10px;
        }

        #content h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        #content p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        footer {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            text-align: center;
            padding: 20px;
            position: absolute;
            bottom: 0;
        }
    </style>
</head>
<body>
    <div id="remainingTime"></div>

    <div id="content">
        <header>
            <h1>Izaberite sadržaj</h1>
            <p>i započnite svoju filmsku avanturu.</p>
        </header>

        <footer>
            <!-- Footer content -->
        </footer>
    </div>

    <div id="loginSection">
        <h2>Prijavite se</h2>
        <label for="usernameInput">Unesite svoje ime:</label>
        <input type="text" id="usernameInput" name="usernameInput" required>
        <button id="loginButton">Prijavite se</button>
    </div>

    <script>
        function checkLoginStatus() {
            const username = localStorage.getItem('currentUser');
            if (username) {
                const users = JSON.parse(localStorage.getItem('users')) || [];
                const user = users.find(u => u.username === username);

                if (user) {
                    const currentDate = new Date();
                    const expireDate = new Date(user.accessExpire);

                    if (currentDate > expireDate) {
                        alert("Vaš pristup je istekao.");
                        localStorage.removeItem('currentUser');
                        return;
                    }

                    document.getElementById('content').style.display = 'block';
                    document.getElementById('loginSection').style.display = 'none';

                    const remainingDays = Math.ceil((expireDate - currentDate) / (1000 * 3600 * 24));
                    const remainingTimeElement = document.getElementById('remainingTime');
                    if (remainingDays > 0) {
                        remainingTimeElement.textContent = `Preostalo vreme preplate: ${remainingDays} dana`;
                    } else {
                        remainingTimeElement.textContent = "Pristup je istekao!";
                    }
                }
            }
        }

        document.getElementById('loginButton').addEventListener('click', function() {
            const usernameInput = document.getElementById('usernameInput').value;
            if (usernameInput.trim() === "") {
                alert("Molimo unesite ime!");
                return;
            }

            const users = JSON.parse(localStorage.getItem('users')) || [];
            const user = users.find(u => u.username === usernameInput);

            if (user) {
                const currentDate = new Date();
                const expireDate = new Date(user.accessExpire);

                if (currentDate > expireDate) {
                    alert("Vaš pristup je istekao.");
                    return;
                }

                localStorage.setItem('currentUser', user.username);
                document.getElementById('content').style.display = 'block';
                document.getElementById('loginSection').style.display = 'none';

                const remainingDays = Math.ceil((expireDate - currentDate) / (1000 * 3600 * 24));
                const remainingTimeElement = document.getElementById('remainingTime');
                if (remainingDays > 0) {
                    remainingTimeElement.textContent = `Preostalo vreme preplate: ${remainingDays} dana`;
                } else {
                    remainingTimeElement.textContent = "Pristup je istekao!";
                }
            } else {
                alert("Korisnik nije pronađen.");
            }
        });

        checkLoginStatus();
    </script>
</body>
</html>
