    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDMsdqasmtSLNfbf9ICXVMRpKgmiNes85o",
            authDomain: "svenaekranu-64477.firebaseapp.com",
            projectId: "svenaekranu-64477",
            storageBucket: "svenaekranu-64477.appspot.com",
            messagingSenderId: "15230160013",
            appId: "1:15230160013:web:89144bb5079637e787e6c4",
            measurementId: "G-PED21PPQQJ"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);

        const userId = 'guest_' + Date.now();

        function checkUserExistence() {
            db.collection('userVisits')
              .where('userId', '==', userId)
              .get()
              .then(querySnapshot => {
                  if (!querySnapshot.empty) {
                      const userData = querySnapshot.docs[0].data();
                      if (userData.status === 'approved') {
                          grantAccess();
                      } else {
                          showPopup();
                          monitorApproval();
                      }
                  } else {
                      logNewVisit();
                  }
              })
              .catch(error => {
                  console.error('Error checking user existence:', error);
              });
        }

        function logNewVisit() {
            db.collection('userVisits').add({
                userId: userId,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                status: 'pending'
            }).then(() => {
                console.log('User visit logged. Awaiting admin approval...');
                showPopup();
                monitorApproval();
            }).catch(error => {
                console.error('Error logging visit: ', error);
            });
        }

        function monitorApproval() {
            db.collection('userVisits')
              .where('userId', '==', userId)
              .onSnapshot(snapshot => {
                  snapshot.forEach(doc => {
                      const data = doc.data();
                      if (data.status === 'approved') {
                          grantAccess();
                      }
                  });
              });
        }

        function grantAccess() {
            document.getElementById('popup').style.display = 'none';
            document.getElementById('hiddenContent').style.display = 'block';
            console.log('Access granted!');
        }

        function showPopup() {
            document.getElementById('popup').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }

        window.onload = function() {
            checkUserExistence();
        };
    </script>
</body>
</html>
