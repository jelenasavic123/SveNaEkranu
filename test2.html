<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izaberite sadržaj i započnite svoju filmsku avanturu danas.</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: url('https://jelenasavic123.github.io/SveNaEkranu/pocetnahd1.JPG') center center/cover no-repeat;
            overflow: hidden;
        }

        .buttons-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 60%;
            padding: 20px;
            border: 3px solid rgba(255, 255, 255, 0.5); 
            border-radius: 15px; 
            box-shadow: 0 8px 11px rgba(0, 0, 0, 0.7); 
            background-color: rgba(0, 0, 0, 0.3); 
            transition: box-shadow 0.3s, border-color 0.3s;
        }

        .button-item {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.8); 
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            width: 20%;
        }

        .button-item img {
            width: 100%;
            height: auto;
            filter: brightness(0.8);
        }

        .button-item h3 {
            padding: 10px;
            margin: 0;
            font-size: 18px; 
            color: #fff;
        }

        footer {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            text-align: center;
            padding: 20px;
            position: absolute;
            bottom: 0;
        }
    </style>
</head>
<body>

    <audio id="background-audio" src="https://www.soundjay.com/button/beep-07.wav" autoplay loop></audio>
    
    <script>
        // Automatski zaustavi zvuk nakon 3 sekunde
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                document.getElementById('background-audio').pause();
            }, 3000); // 3000 milliseconds = 3 seconds
        });
    </script>

    <header>
        <h1>Izaberite sadržaj</h1>
        <p>i započnite svoju filmsku avanturu.</p>
    </header>

    <main>
        <div class="buttons-section">
            <div class="button-item" onclick="location.href='https://jelenasavic123.github.io/SveNaEkranu/stranifilmovi-pocetna.html'">
                <img src="https://jelenasavic123.github.io/SveNaEkranu/strano.jpg" alt="Netflix Movies">
                <h3>Strani Sadrzaj</h3>
            </div>
            <div class="button-item" onclick="location.href='#netflix-series'">
                <img src="https://jelenasavic123.github.io/SveNaEkranu/turskeserije.jpg" alt="Netflix Series">
                <h3>Turski Sadrzaj</h3>
            </div>
            <div class="button-item" onclick="location.href='#domace-serije'">
                <img src="https://jelenasavic123.github.io/SveNaEkranu/domaci.JPG" alt="Domaće Serije">
                <h3>Domaci Sadrzaj</h3>
            </div>
        </div>
    </main>

    <footer>
        <!-- Footer content -->
    </footer>

</body>
</html>
