<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Login</title>
  <!-- Include Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js"></script>
</head>
<body>
  <h2>Login Page</h2>
  
  <!-- Login Form -->
  <form id="loginForm">
    <label for="email">Email: </label>
    <input type="email" id="email" required><br><br>
    <label for="password">Password: </label>
    <input type="password" id="password" required><br><br>
    <button type="submit">Login</button>
  </form>

  <!-- Container for test page content (will be shown after successful login) -->
  <div id="testPage" style="display: none;">
    <h2>Test Page</h2>
    <p>Welcome to the test page! You are successfully logged in.</p>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDMsdqasmtSLNfbf9ICXVMRpKgmiNes85o",
      authDomain: "svenaekranu-64477.firebaseapp.com",
      projectId: "svenaekranu-64477",
      storageBucket: "svenaekranu-64477.firebasestorage.app",
      messagingSenderId: "15230160013",
      appId: "1:15230160013:web:89144bb5079637e787e6c4",
      measurementId: "G-PED21PPQQJ"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    // Get form and input elements
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    // Get the test page container
    const testPage = document.getElementById("testPage");

    // Login functionality
    loginForm.addEventListener("submit", (event) => {
      event.preventDefault(); // Prevent form from submitting normally

      const email = emailInput.value;
      const password = passwordInput.value;

      firebase.auth().signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          // Successful login
          const user = userCredential.user;
          console.log("User logged in:", user);

          // Hide the login form
          loginForm.style.display = 'none';

          // Show the test page content
          testPage.style.display = 'block';
        })
        .catch((error) => {
          // Handle login errors
          const errorCode = error.code;
          const errorMessage = error.message;
          alert("Error: " + errorMessage);
          console.error("Login error:", errorCode, errorMessage);
        });
    });
  </script>
</body>
</html>
