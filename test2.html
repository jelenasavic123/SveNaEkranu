  <title>Login sa imenom</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <h1>Dobrodošli! Unesite vaše ime za prijavu</h1>
  <input type="text" id="userName" placeholder="Unesite ime">
  <button onclick="submitForm()">Prijavi se</button>

  <script>
    // Firebase konfiguracija
    const firebaseConfig = {
      apiKey: "AIzaSyDMsdqasmtSLNfbf9ICXVMRpKgmiNes85o",
      authDomain: "svenaekranu-64477.firebaseapp.com",
      projectId: "svenaekranu-64477",
      storageBucket: "svenaekranu-64477.firebasestorage.app",
      messagingSenderId: "15230160013",
      appId: "1:15230160013:web:89144bb5079637e787e6c4",
      measurementId: "G-PED21PPQQJ"
    };

    // Inicijalizacija Firebase-a
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Funkcija za prijavu sa imenom
    function loginWithName(userName) {
      // Anonimna prijava
      auth.signInAnonymously().then((userCredential) => {
        const user = userCredential.user;

        // Dodavanje imena korisnika u Firestore
        db.collection("users").doc(user.uid).set({
          name: userName
        }).then(() => {
          console.log("Korisnik je uspešno registrovan sa imenom!");
          alert(`Dobrodošli, ${userName}`);
          
          // Preusmeravanje korisnika nakon uspešnog logovanja
          window.location.href = "tvoj-link.html";  // Promeni link na željeni
        }).catch((error) => {
          console.error("Greška prilikom čuvanja imena:", error);
        });
      }).catch((error) => {
        console.error("Greška prilikom anonimnog prijavljivanja:", error);
      });
    }

    // Funkcija za slanje forme
    function submitForm() {
      const userName = document.getElementById('userName').value;
      if (userName) {
        loginWithName(userName);
      } else {
        alert("Molimo unesite ime!");
      }
    }

    // Provera da li je korisnik već prijavljen
    auth.onAuthStateChanged((user) => {
      if (user) {
        // Korisnik je prijavljen
        db.collection("users").doc(user.uid).get().then((doc) => {
          if (doc.exists) {
            const userName = doc.data().name;
            alert(`Dobrodošli, ${userName}`);
            
            // Preusmeravanje korisnika ako je već prijavljen
            window.location.href = "https://www.svenadlanu.xyz";  // Promeni link na željeni
          } else {
            console.log("Ime nije pronađeno u bazi podataka.");
          }
        });
      } else {
        // Korisnik nije prijavljen
        console.log("Korisnik nije prijavljen.");
      }
    });
  </script>
</body>
</html>
