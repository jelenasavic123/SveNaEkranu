        const db = firebase.firestore();

</head>
<body>

    <h2>Login with Nickname</h2>

    <!-- Forma za unos nadimka -->
    <form id="loginForm">
        <label for="nickname">Nickname:</label>
        <input type="text" id="nickname" placeholder="Enter your nickname" required><br><br>
        
        <button type="submit">Login</button>
    </form>

    <!-- Poruka o grešci -->
    <p id="errorMessage" style="color:red;"></p>

    <!-- Sadržaj stranice koji se prikazuje nakon uspešnog logovanja -->
    <div id="content" style="display:none;">
        <h3>Welcome to the page</h3>
        <p id="pageText">teststranica</p>
    </div>

    <script>
        // Handler za login sa nadimkom
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const nickname = document.getElementById("nickname").value;
            console.log("Checking nickname:", nickname);

            // Provera da li nadimak postoji u Firestore
            db.collection("nicknames").doc(nickname).get()
                .then((docSnapshot) => {
                    if (docSnapshot.exists) {
                        console.log("Nickname exists:", nickname);

                        // Ako nadimak postoji, loguj korisnika
                        firebase.auth().signInAnonymously()
                            .then(() => {
                                firebase.auth().currentUser.updateProfile({
                                    displayName: nickname
                                }).then(() => {
                                    console.log("Logged in successfully as " + nickname);
                                    
                                    // Sakrij formu i prikaži sadržaj
                                    document.getElementById("loginForm").style.display = "none";
                                    document.getElementById("content").style.display = "block";

                                    // Prikazivanje poruke o uspešnoj prijavi
                                    document.getElementById("errorMessage").style.color = "green";
                                    document.getElementById("errorMessage").textContent = "Successfully logged in as " + nickname;
                                });
                            })
                            .catch((error) => {
                                console.error("Error logging in:", error.message);
                                document.getElementById("errorMessage").style.color = "red";
                                document.getElementById("errorMessage").textContent = "Error logging in: " + error.message;
                            });
                    } else {
                        console.log("Nickname not found:", nickname);
                        document.getElementById("errorMessage").style.color = "red";
                        document.getElementById("errorMessage").textContent = "Nickname not found!";
                    }
                })
                .catch((error) => {
                    console.error("Error checking nickname:", error);
                    document.getElementById("errorMessage").style.color = "red";
                    document.getElementById("errorMessage").textContent = "Error checking nickname: " + error.message;
                });
        });
    </script>
</body>
</html>
