    <script>
       const firebaseConfig = {
    apiKey: "AIzaSyDMsdqasmtSLNfbf9ICXVMRpKgmiNes85o",
    authDomain: "svenaekranu-64477.firebaseapp.com",
    projectId: "svenaekranu-64477",
    storageBucket: "svenaekranu-64477.firebasestorage.app",
    messagingSenderId: "15230160013",
    appId: "1:15230160013:web:89144bb5079637e787e6c4",
    measurementId: "G-PED21PPQQJ"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore(app);

// Funkcija za generisanje ili učitavanje userId-a iz localStorage
function getUserId() {
    let storedUserId = localStorage.getItem('userId');
    if (!storedUserId) {
        storedUserId = 'guest_' + Date.now(); // Generiše novi ID
        localStorage.setItem('userId', storedUserId); // Čuva ga u localStorage
    }
    return storedUserId;
}

const userId = getUserId();

// Proverava da li korisnik već postoji
function checkUserExistence() {
    db.collection('userVisits')
        .where('userId', '==', userId)
        .get()
        .then(querySnapshot => {
            if (!querySnapshot.empty) {
                const userData = querySnapshot.docs[0].data();
                if (userData.status === 'approved') {
                    grantAccess(); // Odobrava pristup
                } else {
                    showPopup(); // Prikazuje poruku čekanja
                    monitorApproval(); // Aktivno prati promenu statusa
                }
            } else {
                logNewVisit(); // Dodaje novog korisnika
            }
        })
        .catch(error => {
            console.error('Error checking user existence:', error);
        });
}

// Beleži novu posetu samo ako korisnik ne postoji
function logNewVisit() {
    db.collection('userVisits').add({
        userId: userId,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        status: 'pending'
    }).then(() => {
        console.log('User visit logged. Awaiting admin approval...');
        showPopup();
        monitorApproval();
    }).catch(error => {
        console.error('Error logging visit: ', error);
    });
}

// Praćenje promene statusa korisnika
function monitorApproval() {
    db.collection('userVisits')
        .where('userId', '==', userId)
        .onSnapshot(snapshot => {
            snapshot.forEach(doc => {
                const data = doc.data();
                if (data.status === 'approved') {
                    grantAccess();
                }
            });
        });
}

// Odobrenje pristupa
function grantAccess() {
    document.getElementById('popup').style.display = 'none';
    document.getElementById('hiddenContent').style.display = 'block';
    console.log('Access granted!');
}

// Prikazivanje popup obaveštenja
function showPopup() {
    document.getElementById('popup').style.display = 'block';
}

// Zatvaranje popup-a
function closePopup() {
    document.getElementById('popup').style.display = 'none';
}

// Proverava korisnički status kada se stranica učita
window.onload = function () {
    checkUserExistence();
};

    </script>
