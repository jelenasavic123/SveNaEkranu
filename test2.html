  <h2>Login with Nickname</h2>
  
  <!-- Polje za unos nadimka -->
  <input type="text" id="nickname" placeholder="Enter your nickname" />
  <button onclick="loginWithNickname(document.getElementById('nickname').value)">
    Login
  </button>

  <!-- Uključivanje Firebase SDK-a -->
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>

  <script>
    // Firebase konfiguracija
    const firebaseConfig = {
      apiKey: "AIzaSyDMsdqasmtSLNfbf9ICXVMRpKgmiNes85o",
      authDomain: "svenaekranu-64477.firebaseapp.com",
      projectId: "svenaekranu-64477",
      storageBucket: "svenaekranu-64477.firebasestorage.app",
      messagingSenderId: "15230160013",
      appId: "1:15230160013:web:89144bb5079637e787e6c4",
      measurementId: "G-PED21PPQQJ"
    };

    // Inicijalizacija Firebase-a
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Funkcija za prijavu korisnika putem nadimka
    function loginWithNickname(nickname) {
      if (nickname) {
        // Kreiraj anonimnog korisnika
        auth.signInAnonymously().then(() => {
          // Dodeli nadimak
          const user = auth.currentUser;
          user.updateProfile({
            displayName: nickname
          }).then(() => {
            console.log('User logged in with nickname: ', nickname);
            alert(`Hello, ${nickname}!`);

            // Preusmeravanje na drugu stranicu (npr. dashboard.html)
            window.location.href = "https://jelenasavic123.github.io/SveNaEkranu/test2.html";  // Zameniti sa URL-om stranice na koju želiš preusmeriti
          }).catch((error) => {
            console.error('Error setting nickname:', error);
          });
        }).catch((error) => {
          console.error('Error signing in anonymously:', error);
        });
      } else {
        alert('Please enter a nickname!');
      }
    }
  </script>

</body>
