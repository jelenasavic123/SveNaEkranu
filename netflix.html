<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix Stil Stranica</title>
    <style>
      /* Globalni stilovi */
      body {
        font-family: 'Arial', sans-serif;
        background-color: #141414;
        color: white;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      header {
        background-color: #141414;
        padding: 20px 50px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      header h1 {
        color: #e50914;
        font-size: 24px;
        margin: 0;
      }

      header nav a {
        text-decoration: none;
        color: white;
        margin: 0 15px;
        font-size: 14px;
        transition: color 0.3s ease;
      }

      header nav a:hover {
        color: #e50914;
      }

      .filters {
        display: flex;
        gap: 15px;
        justify-content: center;
        padding: 20px;
      }

      select {
        background-color: #333;
        color: white;
        border: 1px solid #444;
        padding: 10px 15px;
        border-radius: 20px;
        font-size: 14px;
        cursor: pointer;
      }

      .movie-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 20px;
        padding: 30px;
        width: 90%;
        margin: 0 auto;
      }

      .movie-item {
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.3s ease;
      }

      .movie-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
      }

      .movie-item:hover img {
        transform: scale(1.1);
      }

      .movie-item:hover {
        transform: scale(1.05);
      }

      .movie-item h3 {
        position: absolute;
        bottom: 10px;
        left: 10px;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 5px 10px;
        font-size: 12px;
        border-radius: 5px;
      }

      #moviePopup {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #222;
        padding: 20px;
        border-radius: 10px;
        color: white;
        z-index: 1000;
        max-width: 500px;
        width: 90%;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
      }

      #moviePopup .popup-content img {
        width: 10%;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      #moviePopup .popup-content h2 {
        margin: 0 0 10px;
      }

      #moviePopup .popup-content p {
        margin: 10px 0;
      }

      #moviePopup button {
        display: block;
        background: #e50914;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
      }

      #moviePopup button:hover {
        background: #b00710;
      }

      footer {
        text-align: center;
        padding: 20px;
        background-color: #141414;
        color: #777;
        font-size: 14px;
      }

      footer a {
        color: #e50914;
        text-decoration: none;
        margin: 0 5px;
      }

      #loading {
        text-align: center;
        color: #e50914;
        padding: 20px;
        display: none;
      }
      
      /* Stil za popup */
#moviePopup {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  max-width: 600px;
  background-color: #222;
  color: white;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  z-index: 1000;
  overflow: hidden;
  animation: fadeIn 0.3s ease-out;
}

#moviePopup .popup-content {
  padding: 20px;
  text-align: center;
}

#moviePopup img {
  width: 100%;
  border-radius: 10px 10px 0 0;
}

#moviePopup h2 {
  font-size: 20px;
  margin: 20px 0 10px;
  color: #e50914;
}

#moviePopup p {
  font-size: 14px;
  color: #ccc;
  margin: 0 0 20px;
  line-height: 1.6;
}

#moviePopup .watch-link {
  display: inline-block;
  padding: 10px 20px;
  background-color: #e50914;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-size: 16px;
  margin-bottom: 20px;
  transition: background-color 0.3s ease;
}

#moviePopup .watch-link:hover {
  background-color: #f40612;
}

#moviePopup button {
  background-color: #444;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 5px;
  font-size: 14px;
  cursor: pointer;
  margin-top: 10px;
  transition: background-color 0.3s ease;
}

#moviePopup button:hover {
  background-color: #555;
}

/* Animacija za otvaranje popup-a */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translate(-50%, -60%);
  }
  to {
    opacity: 1;
    transform: translate(-50%, -50%);
  }
}

/* Zatamnjenje pozadine */
body::before {
  content: "";
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.7);
  z-index: 999;
}

body.popup-open::before {
  display: block;
}

    a {
      text-decoration: none;
      color: white;
    }

    .container {
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 500px;
    }

    .logo {
      position: relative;
      width: 360px;
      height: 520px;
      animation: fadein 1s forwards;
    }

    .logo .uno, .logo .dos, .logo .tres {
      position: absolute;
      width: 120px;
      height: 100%;
      background: #b00612;
    }

    .logo .uno {
      left: 0;
    }

    .logo .dos {
      background: #e50815;
      left: 0;
      z-index: 1;
      transform-origin: top left;
      transform: skewX(25.4deg);
      box-shadow: 0 0 20px black;
    }

    .logo .tres {
      right: 0;
    }

    .logo::before {
      display: block;
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      z-index: 10;
      width: 120%;
      height: 30px;
      background: black;
      border-top-left-radius: 50% 100%;
      border-top-right-radius: 50% 100%;
    }

    .name {
      text-transform: uppercase;
      letter-spacing: 15px;
      animation: name 1s linear;
    }

    @keyframes fadein {
      0% {
        opacity: 0;
        transform: scale(0.8);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes name {
      0% {
        opacity: 0;
        transform: scale(0.8);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    </style>
   
  </head>
  <body>
  
    <a class="container" href="https://netlify.com" target="_blank" id="temp-display">
    <div class="logo">
      <div class="uno"></div>
      <div class="dos"></div>
      <div class="tres"></div>
    </div>
    <div class="name">Netlify</div>
  </a>
 <!-- Audio element -->
  <audio id="netflixSound" src="https://files.catbox.moe/aus6st.mp3"></audio>
  <script>
    // Sakrij element nakon 3 sekunde
    setTimeout(() => {
      const element = document.getElementById('temp-display');
      if (element) {
        element.style.display = 'none';
      }
    }, 3000); // 3000ms = 3 sekunde
  </script>
  
    <header>
      <h1>Netflix</h1>
      <nav>
        <a href="#">Home</a>
        <a href="#">Movies</a>
        <a href="#">Series</a>
        <a href="#">My List</a>
      </nav>
    </header>
    
    <div class="filters">
      <select id="year-filters">
        <option value="">Select Year</option>
      </select>
      <select id="genre-filters">
        <option value="">Select Genre</option>
      </select>
    </div>
    <div class="movie-list" id="movie-list"></div>
    <div id="loading">Loading...</div>
    <div id="moviePopup"></div>
    
    <footer>
      © 2025 Netflix Clone | <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a>
    </footer>
    
    
    <script>
const apiKey = '2701858e9bccab54d4d0e4931420a739';
const baseUrl = 'https://api.themoviedb.org/3/';
const movieList = document.getElementById('movie-list');
const yearFilters = document.getElementById('year-filters');
const genreFilters = document.getElementById('genre-filters');
const moviePopup = document.getElementById('moviePopup');
const imageBaseUrl = 'https://image.tmdb.org/t/p/w500';

let currentPage = 1;
let isLoading = false;
let selectedYear = null;
let selectedGenre = null;

const languageUrls = {
  sr: "https://vidsrc.vip/embed/movie/{movieId}&lang=sr",
};

// Funkcija za učitavanje filmova
async function fetchMovies() {
  if (isLoading) return;

  isLoading = true;

  const url = new URL(`${baseUrl}discover/movie`);
  const params = {
    api_key: apiKey,
    page: currentPage,
    sort_by: 'popularity.desc',
    year: selectedYear,
    with_genres: selectedGenre,
  };
  Object.keys(params).forEach((key) => {
    if (params[key]) url.searchParams.append(key, params[key]);
  });

  try {
    const response = await fetch(url);
    const data = await response.json();
    displayMovies(data.results);
    currentPage++;
  } catch (error) {
    console.error('Error fetching movies:', error);
  } finally {
    isLoading = false;
  }
}

// Funkcija za prikaz filmova
function displayMovies(movies) {
  movies.forEach((movie) => {
    const movieElement = document.createElement('div');
    movieElement.className = 'movie-item';
    movieElement.innerHTML = `
      <img src="${imageBaseUrl + movie.poster_path}" alt="${movie.title}" />
      <h3>${movie.title}</h3>
    `;
    movieElement.addEventListener('click', () => openMoviePopup(movie.id));
    movieList.appendChild(movieElement);
  });
}

// Funkcija za otvaranje popup-a sa detaljima filma
async function openMoviePopup(movieId) {
  try {
    const response = await fetch(`${baseUrl}movie/${movieId}?api_key=${apiKey}`);
    const movie = await response.json();
    const watchLink = languageUrls.sr.replace('{movieId}', movieId); // Generisanje linka za gledanje

    moviePopup.innerHTML = `
      <div class="popup-content">
        <img src="${imageBaseUrl + movie.poster_path}" alt="${movie.title}" />
        <h2>${movie.title}</h2>
        <p>${movie.overview}</p>
        <button class="watch-button" onclick="window.location.href='${watchLink}'">Gledaj film</button>
        <button class="close-button" onclick="closeMoviePopup()">Zatvori</button>
      </div>
    `;
    moviePopup.style.display = 'block';
  } catch (error) {
    console.error('Error fetching movie details:', error);
  }
}

// Funkcija za zatvaranje popup-a
function closeMoviePopup() {
  moviePopup.style.display = 'none';
}

// Funkcija za preuzimanje i prikazivanje žanrova
async function fetchGenres() {
  try {
    const response = await fetch(`${baseUrl}genre/movie/list?api_key=${apiKey}`);
    const data = await response.json();
    data.genres.forEach((genre) => {
      const option = document.createElement('option');
      option.value = genre.id;
      option.textContent = genre.name;
      genreFilters.appendChild(option);
    });
  } catch (error) {
    console.error('Error fetching genres:', error);
  }
}

// Funkcija za resetovanje liste filmova i ponovnu pretragu
function resetMovies() {
  movieList.innerHTML = '';
  currentPage = 1;
  fetchMovies();
}

// Event listener za promenu godine
yearFilters.addEventListener('change', () => {
  selectedYear = yearFilters.value;
  resetMovies();
});

// Event listener za promenu žanra
genreFilters.addEventListener('change', () => {
  selectedGenre = genreFilters.value;
  resetMovies();
});

// Funkcija za inicijalizaciju filtera i učitavanje filmova
function initialize() {
  for (let year = 2025; year >= 2010; year--) {
    const option = document.createElement('option');
    option.value = year;
    option.textContent = year;
    yearFilters.appendChild(option);
  }
  fetchGenres();
  fetchMovies();
}

// Event za beskonačno skrolovanje
window.addEventListener('scroll', () => {
  if (
    window.innerHeight + window.scrollY >= document.body.offsetHeight - 100 &&
    !isLoading
  ) {
    fetchMovies();
  }
});

// Pokreni inicijalizaciju
initialize();

 // Show popup and play sound
    window.addEventListener('load', () => {
      netflixSound.play().then(() => {
        console.log('Sound playing successfully.');
        popup.classList.add('active');
        setTimeout(() => popup.classList.remove('active'), 3000); // Hide popup after 3 seconds
      }).catch(error => {

      });
    });

    </script>
    <script>
  window.addEventListener('load', () => {
    const netflixSound = document.getElementById('netflixSound');
    
    // Pokreni zvuk nakon što se stranica učita
    const playSound = () => {
      netflixSound.play().catch((error) => {
        console.log('Autoplay blocked:', error);
      });
    };

    // Proveri podršku za autoplay
    if ('autoplay' in netflixSound) {
      playSound();
    } else {
      document.addEventListener('click', playSound, { once: true });
    }
  });
</script>
  </body>
</html>
