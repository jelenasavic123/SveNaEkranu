<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      justify-content: center;
    }

    .movie-list {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      padding: 20px 0;
      width: 100%;
    }

    .movie-item {
      position: relative;
      width: 150px;
      height: 255px;
      background-color: #333;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .movie-item:hover {
      transform: scale(1.05);
    }

    .movie-item img {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      object-fit: cover;
    }

    .movie-item h3 {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      font-size: 11.2px;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 5px;
      border-radius: 5px;
    }

    #videoPlayer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 80%;
      border: none;
      outline: none;
    }

    #languageMenu {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border-radius: 10px;
      padding: 20px;
      display: none;
      z-index: 1000;
      flex-direction: column;
      gap: 10px;
    }

    .languageButton {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 5px;
    }

    .languageButton:hover {
      background-color: rgba(0, 0, 0, 0.9);
    }

    #closeMenuButton {
      background-color: red;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="movie-list" id="movie-list"></div>
  <div id="loading" class="loading" style="display: none;">Učitavanje...</div>

  <div id="videoPlayer">
    <iframe id="videoIframe" src="" frameborder="0" allowfullscreen tabindex="0"></iframe>
    <button id="closePlayerButton" style="position: absolute; bottom: 20px; left: 20px; padding: 10px; background-color: rgba(0, 0, 0, 0.7); color: white; border: none; border-radius: 5px;">Zatvori</button>
  </div>

  <div id="languageMenu">
    <button class="languageButton" id="sr" onclick="changeLanguage('sr')">Srpski</button>
    <button class="languageButton" id="hr" onclick="changeLanguage('hr')">Hrvatski</button>
    <button class="languageButton" id="mk" onclick="changeLanguage('mk')">Makedonski</button>
    <button class="languageButton" id="bs" onclick="changeLanguage('bs')">Bosanski</button>
    <button class="languageButton" id="sl" onclick="changeLanguage('sl')">Slovenski</button>
    <button class="languageButton" id="en" onclick="changeLanguage('en')">Engleski</button>
    <button id="closeMenuButton" onclick="closeLanguageMenu()">Zatvori</button>
  </div>

  <script>
    const apiKey = '2701858e9bccab54d4d0e4931420a739';
    const baseUrl = `https://api.themoviedb.org/3/`;
    const movieList = document.getElementById('movie-list');
    const videoPlayer = document.getElementById('videoPlayer');
    const videoIframe = document.getElementById('videoIframe');
    const closePlayerButton = document.getElementById('closePlayerButton');
    const languageMenu = document.getElementById('languageMenu');
    const closeMenuButton = document.getElementById('closeMenuButton');

    const languageUrls = {
      sr: "https://vidsrc.vip/embed/movie/{movieId}&lang=sr",
      hr: "https://vidsrc.vip/embed/movie/{movieId}&lang=hr",
      mk: "https://vidsrc.xyz/embed/movie?tmdb={movieId}&ds_lang=sr",
      bs: "https://vidsrc.xyz/embed/movie?tmdb={movieId}&ds_lang=hr",
      sl: "https://player.smashy.stream/movie/{movieId}?subLang=Serbian&btPosition=200",
      en: "https://player.smashy.stream/movie/{movieId}?subLang=Serbian&btPosition=200"
    };

    let currentMovieId = null;
    let selectedLang = 'sr';
    let isVideoPlaying = false;

    function fetchMovies() {
      let url = `${baseUrl}discover/movie?api_key=${apiKey}&language=us-SR&with_watch_providers=8&watch_region=US`;
      fetch(url)
        .then(response => response.json())
        .then(data => {
          const movies = data.results;
          movies.forEach(movie => {
            const movieItem = document.createElement('div');
            movieItem.classList.add('movie-item');
            const movieImage = document.createElement('img');
            movieImage.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
            movieItem.appendChild(movieImage);
            const movieTitle = document.createElement('h3');
            movieTitle.textContent = movie.title;
            movieItem.appendChild(movieTitle);
            movieItem.addEventListener('click', () => {
              displayLanguageMenu(movie.id);
            });
            movieList.appendChild(movieItem);
          });
        })
        .catch(error => {
          console.error('Greška pri učitavanju filmova:', error);
        });
    }

    function displayLanguageMenu(movieId) {
      currentMovieId = movieId;
      languageMenu.style.display = 'flex';
    }

    function changeLanguage(lang) {
      selectedLang = lang;
      const videoUrl = languageUrls[selectedLang].replace("{movieId}", currentMovieId);
      videoIframe.src = `${videoUrl}?autoplay=1&muted=false&controls=0`;
      closeLanguageMenu(); // Zatvori jezički meni
      isVideoPlaying = true;
      videoPlayer.style.display = 'flex';
    }

    function closeLanguageMenu() {
      languageMenu.style.display = 'none';
    }

    function closeVideoPlayer() {
      videoPlayer.style.display = 'none';
      isVideoPlaying = false;
      openLanguageMenu(); // Ponovno otvori jezički meni
    }

    function openLanguageMenu() {
      if (!isVideoPlaying) {
        languageMenu.style.display = 'flex';
      }
    }

    closePlayerButton.addEventListener('click', () => {
      closeVideoPlayer();
    });

    fetchMovies(); // Učitaj filmove pri pokretanju stranice
  </script>
</body>
</html>
