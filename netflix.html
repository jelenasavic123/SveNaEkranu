<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix Stil Stranica</title>
    <style>
     /* Global styles */
body {
  font-family: 'Arial', sans-serif;
  background-color: #000; /* Black background */
  color: white;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

header {
  background-color: #000;
  padding: 20px 50px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

header h1 {
  color: #e50914;
  font-size: 20px; /* Reduced size for logo */
  margin: 0;
}

header nav a {
  text-decoration: none;
  color: white;
  margin: 0 15px;
  font-size: 12px; /* Slightly smaller font size */
  transition: color 0.3s ease;
}

header nav a:hover {
  color: #e50914;
}

.filters {
  display: flex;
  gap: 15px;
  justify-content: center;
  padding: 20px;
}

select {
  background-color: #333;
  color: white;
  border: 1px solid #444;
  padding: 8px 12px; /* Slightly reduced padding */
  border-radius: 15px; /* Rounded edges */
  font-size: 12px;
  cursor: pointer;
}

.movie-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); /* Smaller movie items */
  gap: 15px;
  padding: 20px;
  width: 90%;
  margin: 0 auto;
}

.movie-item {
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.movie-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.movie-item:hover img {
  transform: scale(1.1);
}

.movie-item:hover {
  transform: scale(1.05);
}

.movie-item h3 {
  position: absolute;
  bottom: 5px;
  left: 5px;
  background-color: rgba(0, 0, 0, 0.7);
  color: white;
  padding: 4px 8px;
  font-size: 10px; /* Reduced font size */
  border-radius: 5px;
}

/* Logo container */
.logo {
  position: relative;
  width: 150px; /* Reduced logo width */
  height: 200px; /* Reduced logo height */
  animation: fadein 1s forwards;
  margin: 20px auto; /* Centered logo */
}

.logo .uno, .logo .dos, .logo .tres {
  position: absolute;
  width: 50px; /* Adjusted for smaller logo */
  height: 100%;
  background: #b00612;
}

.logo .uno {
  left: 0;
}

.logo .dos {
  background: #e50815;
  left: 0;
  z-index: 1;
  transform-origin: top left;
  transform: skewX(25.4deg);
  box-shadow: 0 0 15px black;
}

.logo .tres {
  right: 0;
}

.logo::before {
  display: block;
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  z-index: 10;
  width: 100%;
  height: 20px;
  background: black;
  border-top-left-radius: 50% 100%;
  border-top-right-radius: 50% 100%;
}

.name {
  text-transform: uppercase;
  letter-spacing: 10px;
  font-size: 12px; /* Reduced font size */
  animation: name 1s linear;
  text-align: center;
  color: #e50914;
  margin-top: 10px;
}

@keyframes fadein {
  0% {
    opacity: 0;
    transform: scale(0.8);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes name {
  0% {
    opacity: 0;
    transform: scale(0.8);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}

/* Footer */
footer {
  text-align: center;
  padding: 15px;
  background-color: #000;
  color: #777;
  font-size: 12px;
}

footer a {
  color: #e50914;
  text-decoration: none;
  margin: 0 5px;
}

    </style>
   
  </head>
  <body>
  
 <!-- Audio element -->
  <audio id="netflixSound" src="https://files.catbox.moe/aus6st.mp3" preload="auto"></audio>

  
    <a class="container" href="https://netlify.com" target="_blank" id="temp-display">
    <div class="logo">
      <div class="uno"></div>
      <div class="dos"></div>
      <div class="tres"></div>
    </div>
    <div class="name">Netlify</div>
  </a>

  <script>
    // Sakrij element nakon 3 sekunde
    setTimeout(() => {
      const element = document.getElementById('temp-display');
      if (element) {
        element.style.display = 'none';
      }
    }, 3000); // 3000ms = 3 sekunde
  </script>
  
    <header>
      <h1>Netflix</h1>
      <nav>
        <a href="#">Home</a>
        <a href="#">Movies</a>
        <a href="#">Series</a>
        <a href="#">My List</a>
      </nav>
    </header>
    
    <div class="filters">
      <select id="year-filters">
        <option value="">Select Year</option>
      </select>
      <select id="genre-filters">
        <option value="">Select Genre</option>
      </select>
    </div>
    <div class="movie-list" id="movie-list"></div>
    <div id="loading">Loading...</div>
    <div id="moviePopup"></div>
    
    <footer>
      © 2025 Netflix Clone | <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a>
    </footer>
    
    
    <script>
const apiKey = '2701858e9bccab54d4d0e4931420a739';
const baseUrl = 'https://api.themoviedb.org/3/';
const movieList = document.getElementById('movie-list');
const yearFilters = document.getElementById('year-filters');
const genreFilters = document.getElementById('genre-filters');
const moviePopup = document.getElementById('moviePopup');
const imageBaseUrl = 'https://image.tmdb.org/t/p/w500';
 const netflixSound = document.getElementById('netflixSound');
    const popup = document.getElementById('popup');
    const backdrop = document.getElementById('backdrop');
    const playSoundButton = document.getElementById('playSound');

let currentPage = 1;
let isLoading = false;
let selectedYear = null;
let selectedGenre = null;

const languageUrls = {
  sr: "https://vidsrc.vip/embed/movie/{movieId}&lang=sr",
};

// Funkcija za učitavanje filmova
async function fetchMovies() {
  if (isLoading) return;

  isLoading = true;

  const url = new URL(`${baseUrl}discover/movie`);
  const params = {
    api_key: apiKey,
    page: currentPage,
    sort_by: 'popularity.desc',
    year: selectedYear,
    with_genres: selectedGenre,
  };
  Object.keys(params).forEach((key) => {
    if (params[key]) url.searchParams.append(key, params[key]);
  });

  try {
    const response = await fetch(url);
    const data = await response.json();
    displayMovies(data.results);
    currentPage++;
  } catch (error) {
    console.error('Error fetching movies:', error);
  } finally {
    isLoading = false;
  }
}

// Funkcija za prikaz filmova
function displayMovies(movies) {
  movies.forEach((movie) => {
    const movieElement = document.createElement('div');
    movieElement.className = 'movie-item';
    movieElement.innerHTML = `
      <img src="${imageBaseUrl + movie.poster_path}" alt="${movie.title}" />
      <h3>${movie.title}</h3>
    `;
    movieElement.addEventListener('click', () => openMoviePopup(movie.id));
    movieList.appendChild(movieElement);
  });
}

// Funkcija za otvaranje popup-a sa detaljima filma
async function openMoviePopup(movieId) {
  try {
    const response = await fetch(`${baseUrl}movie/${movieId}?api_key=${apiKey}`);
    const movie = await response.json();
    const watchLink = languageUrls.sr.replace('{movieId}', movieId); // Generisanje linka za gledanje

    moviePopup.innerHTML = `
      <div class="popup-content">
        <img src="${imageBaseUrl + movie.poster_path}" alt="${movie.title}" />
        <h2>${movie.title}</h2>
        <p>${movie.overview}</p>
        <button class="watch-button" onclick="window.location.href='${watchLink}'">Gledaj film</button>
        <button class="close-button" onclick="closeMoviePopup()">Zatvori</button>
      </div>
    `;
    moviePopup.style.display = 'block';
  } catch (error) {
    console.error('Error fetching movie details:', error);
  }
}

// Funkcija za zatvaranje popup-a
function closeMoviePopup() {
  moviePopup.style.display = 'none';
}

// Funkcija za preuzimanje i prikazivanje žanrova
async function fetchGenres() {
  try {
    const response = await fetch(`${baseUrl}genre/movie/list?api_key=${apiKey}`);
    const data = await response.json();
    data.genres.forEach((genre) => {
      const option = document.createElement('option');
      option.value = genre.id;
      option.textContent = genre.name;
      genreFilters.appendChild(option);
    });
  } catch (error) {
    console.error('Error fetching genres:', error);
  }
}

// Funkcija za resetovanje liste filmova i ponovnu pretragu
function resetMovies() {
  movieList.innerHTML = '';
  currentPage = 1;
  fetchMovies();
}

// Event listener za promenu godine
yearFilters.addEventListener('change', () => {
  selectedYear = yearFilters.value;
  resetMovies();
});

// Event listener za promenu žanra
genreFilters.addEventListener('change', () => {
  selectedGenre = genreFilters.value;
  resetMovies();
});

// Funkcija za inicijalizaciju filtera i učitavanje filmova
function initialize() {
  for (let year = 2025; year >= 2010; year--) {
    const option = document.createElement('option');
    option.value = year;
    option.textContent = year;
    yearFilters.appendChild(option);
  }
  fetchGenres();
  fetchMovies();
}

// Event za beskonačno skrolovanje
window.addEventListener('scroll', () => {
  if (
    window.innerHeight + window.scrollY >= document.body.offsetHeight - 100 &&
    !isLoading
  ) {
    fetchMovies();
  }
});

// Pokreni inicijalizaciju
initialize();

 // Show popup and play sound
    window.addEventListener('load', () => {
      netflixSound.play().then(() => {
        console.log('Sound playing successfully.');
        popup.classList.add('active');
        setTimeout(() => popup.classList.remove('active'), 3000); // Hide popup after 3 seconds
      }).catch(error => {

      });
    });
    
    // Pokušaj automatske reprodukcije
    window.addEventListener('load', () => {
      netflixSound.play()
        .then(() => {
          console.log('Zvuk je uspešno pokrenut automatski.');
        })
        .catch(error => {
          console.log('Automatska reprodukcija nije uspela:', error);
          // Prikazivanje popup-a za korisničku interakciju
          popup.classList.add('active');
          backdrop.classList.add('active');
        });
    });

    // Ručna reprodukcija zvuka na klik korisnika
    playSoundButton.addEventListener('click', () => {
      netflixSound.play()
        .then(() => {
          console.log('Zvuk je pokrenut na korisnički zahtev.');
          popup.classList.remove('active');
          backdrop.classList.remove('active');
        })
        .catch(error => {
          console.error('Greška pri pokretanju zvuka:', error);
        });
    });
    </script>
    
  </body>
</html>
