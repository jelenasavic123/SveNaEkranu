<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #121212;
      }
      iframe {
        width: 80%;
        height: 80%;
        border: none;
      }
      #videoControls {
        position: absolute;
        top: 10px;
        right: 10px;
        color: white;
        z-index: 999;
      }
      #videoControls select {
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        padding: 5px;
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <div id="videoControls">
      <select id="languageSelect">
        <option value="sr">Srpski</option>
        <option value="hr">Hrvatski</option>
        <option value="mk">Makedonski</option>
        <option value="bs">Bosanski</option>
        <option value="sl">Slovenski</option>
        <option value="en">Engleski</option>
      </select>
      <button id="fullscreenBtn">Fullscreen</button>
    </div>

    <iframe id="videoIframe" src="" frameborder="0" allowfullscreen></iframe>

    <script>
      const languageSelect = document.getElementById('languageSelect');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const videoIframe = document.getElementById('videoIframe');
      const urlParams = new URLSearchParams(window.location.search);
      const movieId = urlParams.get('movieId'); // Dohvatanje movieId sa URL-a

      // Specifični URL-ovi za svaki jezik
      const languageUrls = {
        sr: "https://vidsrc.vip/embed/movie/{movieId}&lang=sr",
        hr: "https://vidsrc.vip/embed/movie/{movieId}&lang=hr",
        mk: "https://vidsrc.xyz/embed/movie?tmdb={movieId}&ds_lang=sr",
        bs: "https://vidsrc.xyz/embed/movie?tmdb={movieId}&ds_lang=hr",
        sl: "https://player.smashy.stream/movie/{movieId}?subLang=Serbian&btPosition=200",
        en: "https://player.smashy.stream/movie/{movieId}?subLang=Serbian&btPosition=200"
      };

      let currentLanguage = 'sr'; // Podrazumevani jezik

      // Učitavanje video URL-a prema jeziku
      function loadVideo() {
        const videoUrl = languageUrls[currentLanguage].replace("{movieId}", movieId);
        videoIframe.src = `${videoUrl}?autoplay=1`;
      }

      // Promena jezika
      languageSelect.addEventListener('change', function() {
        currentLanguage = languageSelect.value;
        loadVideo(); // Reload video sa novim jezikom
      });

      // Aktiviranje fullscreen moda
      fullscreenBtn.addEventListener('click', function() {
        if (videoIframe.requestFullscreen) {
          videoIframe.requestFullscreen();
        } else if (videoIframe.mozRequestFullScreen) { // Firefox
          videoIframe.mozRequestFullScreen();
        } else if (videoIframe.webkitRequestFullscreen) { // Chrome, Safari, Opera
          videoIframe.webkitRequestFullscreen();
        } else if (videoIframe.msRequestFullscreen) { // IE/Edge
          videoIframe.msRequestFullscreen();
        }
      });

      // Učitavanje videa prilikom učitavanja stranice
      loadVideo();
    </script>
  </body>
</html>
