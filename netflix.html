<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #121212;
        color: white;
        margin: 0;
        padding: 0;
        display: flex;
        background: url('https://jelenasavic123.github.io/SveNaEkranu/pocetnahd1.JPG') center center / cover no-repeat fixed;
        flex-direction: column;
        align-items: center;
      }

      .movie-list {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: center;
        padding: 20px 0;
        width: 100%;
      }

      .movie-item {
        position: relative;
        width: 150px;
        height: 255px;
        background-color: #333;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s ease;
        cursor: pointer;
      }

      .movie-item:hover {
        transform: scale(1.05);
      }

      .movie-item img {
        width: 100%;
        height: 100%;
        border-radius: 10px;
        object-fit: cover;
      }

      .movie-item h3 {
        position: absolute;
        bottom: 10px;
        left: 10px;
        color: white;
        font-size: 11.2px;
        background-color: rgba(0, 0, 0, 0.5);
        padding: 5px;
        border-radius: 5px;
      }

      .loading {
        text-align: center;
        color: #fff;
        font-size: 16.8px;
        margin: 20px 0;
      }

      #videoPlayer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        overflow: hidden;
        flex-direction: column;  
      }

      iframe {
        width: 100%;
        height: 90%;
        border: none;
      }

      #languageSelect {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 10px;
        background-color: rgba(0, 0, 0, 0.6);
        color: white;
        border: none;
        border-radius: 5px;
        z-index: 1000;
        width: 150px;
        text-align: center;
        display: none; /* Poništavamo prikaz dok nije otvoreno dugmetom */
      }

      /* Dugmadi za daljinski */
      .remote-buttons {
        position: absolute;
        top: 10px;
        left: 10px;
        display: flex;
        gap: 10px;
      }

      .remote-button {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-color: #ff0000; /* Početna boja - crvena */
        border: none;
        cursor: pointer;
      }

      .remote-button.green {
        background-color: #00ff00; /* Zelena boja */
      }

      .remote-button.yellow {
        background-color: #ffff00; /* Žuta boja */
      }

      /* Efekat fokusa (crveni okvir) kada je selektovan */
      #languageSelect:focus {
        outline: 3px solid red;
      }

      iframe:focus, #languageSelect:focus {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div class="movie-list" id="movie-list"></div>
    <div id="loading" class="loading" style="display: none;">Učitavanje...</div>

    <!-- Video Player -->
    <div id="videoPlayer">
      <iframe id="videoIframe" src="" frameborder="0" allowfullscreen tabindex="0"></iframe>

      <!-- Dugmadi za daljinski -->
      <div class="remote-buttons">
        <button class="remote-button red" id="openLanguageMenu">Red</button>
        <button class="remote-button green" id="selectLanguageGreen">Green</button>
        <button class="remote-button yellow" id="selectLanguageYellow">Yellow</button>
      </div>

      <!-- Jezički meni -->
      <select id="languageSelect" tabindex="1">
        <option value="sr">Srpski</option>
        <option value="hr">Hrvatski</option>
        <option value="mk">Makedonski</option>
        <option value="bs">Bosanski</option>
        <option value="sl">Slovenski</option>
        <option value="en">Engleski</option>
      </select>
    </div>

    <script>
      const apiKey = '2701858e9bccab54d4d0e4931420a739'; // Zameni sa svojim TMDb API ključem
      const baseUrl = `https://api.themoviedb.org/3/`;
      const movieList = document.getElementById('movie-list');
      const videoPlayer = document.getElementById('videoPlayer');
      const videoIframe = document.getElementById('videoIframe');
      const languageSelect = document.getElementById('languageSelect');
      const openLanguageMenuButton = document.getElementById('openLanguageMenu');
      const selectLanguageGreenButton = document.getElementById('selectLanguageGreen');
      const selectLanguageYellowButton = document.getElementById('selectLanguageYellow');

      // Specifični URL-ovi za svaki jezik
      const languageUrls = {
        sr: "https://vidsrc.vip/embed/movie/{movieId}&lang=sr",
        hr: "https://vidsrc.vip/embed/movie/{movieId}&lang=hr",
        mk: "https://vidsrc.xyz/embed/movie?tmdb={movieId}&ds_lang=sr",
        bs: "https://vidsrc.xyz/embed/movie?tmdb={movieId}&ds_lang=hr",
        sl: "https://player.smashy.stream/movie/{movieId}?subLang=Serbian&btPosition=200",
        en: "https://player.smashy.stream/movie/{movieId}?subLang=Serbian&btPosition=200"
      };

      let currentMovieId = null;

      // Učitavanje filmova
      function fetchMovies() {
        let url = `${baseUrl}discover/movie?api_key=${apiKey}&language=us-SR&with_watch_providers=8&watch_region=US`;
        fetch(url)
          .then(response => response.json())
          .then(data => {
            const movies = data.results;
            movies.forEach(movie => {
              const movieItem = document.createElement('div');
              movieItem.classList.add('movie-item');
              const movieImage = document.createElement('img');
              movieImage.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
              movieItem.appendChild(movieImage);
              const movieTitle = document.createElement('h3');
              movieTitle.textContent = movie.title;
              movieItem.appendChild(movieTitle);
              movieItem.addEventListener('click', () => {
                displayVideoPlayer(movie.id);
              });
              movieList.appendChild(movieItem);
            });
          })
          .catch(error => {
            console.error('Greška pri učitavanju filmova:', error);
          });
      }

      // Funkcija za prikazivanje video player-a
      function displayVideoPlayer(movieId) {
        currentMovieId = movieId;
        videoPlayer.style.display = 'flex';
        const selectedLang = languageSelect.value;
        const videoUrl = languageUrls[selectedLang].replace("{movieId}", movieId);
        videoIframe.src = `${videoUrl}?autoplay=1&muted=false`;
      }

      // Promena jezika
      languageSelect.addEventListener('change', function() {
        if (currentMovieId) {
          const selectedLang = languageSelect.value;
          const videoUrl = languageUrls[selectedLang].replace("{movieId}", currentMovieId);
          videoIframe.src = `${videoUrl}?autoplay=1&muted=false`;
        }
      });

      // Dugme za otvaranje menija jezika
      openLanguageMenuButton.addEventListener('click', () => {
        languageSelect.style.display = languageSelect.style.display === 'block' ? 'none' : 'block';
      });

      // Dugme za odabir zelenog jezika
      selectLanguageGreenButton.addEventListener('click', () => {
        languageSelect.value = 'hr';  // Postavi jezik na Hrvatski
        languageSelect.dispatchEvent(new Event('change'));
      });

      // Dugme za odabir žutog jezika
      selectLanguageYellowButton.addEventListener('click', () => {
        languageSelect.value = 'mk';  // Postavi jezik na Makedonski
        languageSelect.dispatchEvent(new Event('change'));
      });

      // Prikazivanje filmova
      fetchMovies();
    </script>
  </body>
</html>
