<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      justify-content: center;
    }

    .movie-list {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      padding: 20px 0;
      width: 100%;
    }

    .movie-item {
      position: relative;
      width: 150px;
      height: 255px;
      background-color: #333;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .movie-item:hover {
      transform: scale(1.05);
    }

    .movie-item img {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      object-fit: cover;
    }

    .movie-item h3 {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      font-size: 11.2px;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 5px;
      border-radius: 5px;
    }

    #videoPlayer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 80%;
      border: none;
      outline: none;
    }

    /* Navbar za izbor jezika unutar iframe */
    #languageNavbar {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
      display: none;
      z-index: 1000;
      flex-direction: row;
      gap: 10px;
    }

    .languageButton {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    .languageButton:hover {
      background-color: rgba(0, 0, 0, 0.9);
    }

    /* Za selektovanje i prepoznavanje kada je dugme u fokusu */
    .languageButton:focus {
      outline: 2px solid yellow;
    }
  </style>
</head>
<body>
  <div class="movie-list" id="movie-list"></div>

  <div id="videoPlayer">
    <iframe id="videoIframe" src="" frameborder="0" allowfullscreen tabindex="0"></iframe>
    <div id="languageNavbar">
      <button class="languageButton" onclick="changeLanguage('sr')">Srpski</button>
      <button class="languageButton" onclick="changeLanguage('hr')">Hrvatski</button>
      <button class="languageButton" onclick="changeLanguage('mk')">Makedonski</button>
      <button class="languageButton" onclick="changeLanguage('bs')">Bosanski</button>
      <button class="languageButton" onclick="changeLanguage('sl')">Slovenski</button>
      <button class="languageButton" onclick="changeLanguage('en')">Engleski</button>
    </div>
  </div>

  <script>
    const apiKey = '2701858e9bccab54d4d0e4931420a739';
    const baseUrl = `https://api.themoviedb.org/3/`;
    const movieList = document.getElementById('movie-list');
    const videoPlayer = document.getElementById('videoPlayer');
    const videoIframe = document.getElementById('videoIframe');
    const languageNavbar = document.getElementById('languageNavbar');

    const languageUrls = {
      sr: "https://vidsrc.vip/embed/movie/{movieId}&lang=sr",
      hr: "https://vidsrc.vip/embed/movie/{movieId}&lang=hr",
      mk: "https://vidsrc.xyz/embed/movie?tmdb={movieId}&ds_lang=sr",
      bs: "https://vidsrc.xyz/embed/movie?tmdb={movieId}&ds_lang=hr",
      sl: "https://player.smashy.stream/movie/{movieId}?subLang=Serbian&btPosition=200",
      en: "https://player.smashy.stream/movie/{movieId}?subLang=Serbian&btPosition=200"
    };

    let currentMovieId = null;
    let navbarTimeout = null;
    let keyDownTime = 0;
    let keyHeld = false;

    function fetchMovies() {
      let url = `${baseUrl}discover/movie?api_key=${apiKey}&language=us-SR&with_watch_providers=8&watch_region=US`;
      fetch(url)
        .then(response => response.json())
        .then(data => {
          const movies = data.results;
          movies.forEach(movie => {
            const movieItem = document.createElement('div');
            movieItem.classList.add('movie-item');
            const movieImage = document.createElement('img');
            movieImage.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
            movieItem.appendChild(movieImage);
            const movieTitle = document.createElement('h3');
            movieTitle.textContent = movie.title;
            movieItem.appendChild(movieTitle);
            movieItem.addEventListener('click', () => {
              displayVideoPlayer(movie.id);
            });
            movieList.appendChild(movieItem);
          });
        })
        .catch(error => {
          console.error('Greška pri učitavanju filmova:', error);
        });
    }

    function displayVideoPlayer(movieId) {
      currentMovieId = movieId;
      videoPlayer.style.display = 'flex';
      const selectedLang = 'sr'; // Podrazumevani jezik
      const videoUrl = languageUrls[selectedLang].replace("{movieId}", movieId);
      videoIframe.src = `${videoUrl}?autoplay=1&muted=false&controls=0`;
      languageNavbar.style.display = 'flex'; // Prikazivanje navbar-a
      resetNavbarTimeout(); // Resetovanje vremena za sakrivanje navbar-a
    }

    function changeLanguage(lang) {
      if (currentMovieId) {
        const videoUrl = languageUrls[lang].replace("{movieId}", currentMovieId);
        videoIframe.src = `${videoUrl}?autoplay=1&muted=false&controls=0`;
      }
      resetNavbarTimeout(); // Resetovanje vremena za sakrivanje navbar-a nakon promene jezika
    }

    // Resetovanje timeout-a za skrivanje navbar-a nakon 10 sekundi
    function resetNavbarTimeout() {
      if (navbarTimeout) {
        clearTimeout(navbarTimeout); // Ako postoji prethodni timeout, poništiti ga
      }

      navbarTimeout = setTimeout(function() {
        languageNavbar.style.display = 'none'; // Sakrij navbar nakon 10 sekundi
      }, 10000); // 10000 milisekundi (10 sekundi)
    }

    // Aktivacija menija kada se pritisne strelica prema dole i drži više od 2 sekunde
    document.addEventListener('keydown', function(event) {
      if (event.key === "ArrowDown" && !keyHeld) {
        keyDownTime = Date.now();
        keyHeld = true;

        setTimeout(() => {
          if (keyHeld && Date.now() - keyDownTime >= 2000) {
            languageNavbar.style.display = 'flex'; // Prikazivanje navbar-a
            document.querySelector('.languageButton').focus(); // Fokus na prvi dugme u navbar-u
          }
        }, 2000); // Ako se taster zadrži 2 sekunde
      }
    });

    // Ako korisnik pusti taster, poništiti stanje
    document.addEventListener('keyup', function(event) {
      if (event.key === "ArrowDown") {
        keyHeld = false;
      }
    });

    // Kada korisnik klikne na iframe, treba da se prikaže navbar za jezike
    videoIframe.addEventListener('click', function() {
      languageNavbar.style.display = 'flex';
      resetNavbarTimeout(); // Resetovanje vremena za sakrivanje navbar-a nakon klika
    });

    fetchMovies();
  </script>
</body>
</html>
