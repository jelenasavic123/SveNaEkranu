<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      justify-content: center;
    }

    .movie-list {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      padding: 20px 0;
      width: 100%;
    }

    .movie-item {
      position: relative;
      width: 150px;
      height: 255px;
      background-color: #333;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .movie-item:hover {
      transform: scale(1.05);
    }

    .movie-item img {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      object-fit: cover;
    }

    .movie-item h3 {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      font-size: 11.2px;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 5px;
      border-radius: 5px;
    }

    #moviePopup {
      display: none;
      position: fixed;
      top: 10%;
      left: 10%;
      width: 80%;
      height: 80%;
      background-color: rgba(0, 0, 0, 0.9);
      border-radius: 15px;
      padding: 20px;
      z-index: 1000;
      overflow-y: auto;
    }

    #moviePopupContent {
      display: flex;
      gap: 20px;
    }

    #moviePopup img {
      width: 250px;
      height: 375px;
      object-fit: cover;
      border-radius: 10px;
    }

    #moviePopupDetails {
      color: white;
      flex-grow: 1;
    }

    #closePopupButton {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: red;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    #languageMenu {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .languageButton {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    .languageButton:hover {
      background-color: rgba(0, 0, 0, 0.9);
    }

    .selectedLanguage {
      background-color: red;
    }

    .languageButton:focus {
      outline: 2px solid red;
      background-color: rgba(0, 0, 0, 0.9);
    }

    #closeMenuButton {
      background-color: red;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="movie-list" id="movie-list"></div>

  <div id="moviePopup">
    <button id="closePopupButton" onclick="closePopup()">X</button>
    <div id="moviePopupContent">
      <img id="moviePopupImage" src="" alt="Movie Poster">
      <div id="moviePopupDetails">
        <h2 id="moviePopupTitle"></h2>
        <p id="moviePopupOverview"></p>
        <p><strong>Datum izlaska:</strong> <span id="moviePopupReleaseDate"></span></p>
        <p><strong>Žanrovi:</strong> <span id="moviePopupGenres"></span></p>
        
        <div id="languageMenu">
          <div>Izaberite drugi jezik za film:</div>
          <button class="languageButton" id="sr" tabindex="1" onclick="changeLanguage('sr')">Srpski</button>
          <button class="languageButton" id="hr" tabindex="2" onclick="changeLanguage('hr')">Hrvatski</button>
          <button class="languageButton" id="mk" tabindex="3" onclick="changeLanguage('mk')">Makedonski</button>
          <button class="languageButton" id="bs" tabindex="4" onclick="changeLanguage('bs')">Bosanski</button>
          <button class="languageButton" id="sl" tabindex="5" onclick="changeLanguage('sl')">Slovenski</button>
          <button class="languageButton" id="en" tabindex="6" onclick="changeLanguage('en')">Engleski</button>
          <button id="closeMenuButton" tabindex="7" onclick="closePopup()">Zatvori</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const apiKey = '2701858e9bccab54d4d0e4931420a739';
    const baseUrl = `https://api.themoviedb.org/3/`;
    const movieList = document.getElementById('movie-list');
    const moviePopup = document.getElementById('moviePopup');

    const languageUrls = {
      sr: "https://vidsrc.vip/embed/movie/{movieId}&lang=sr",
      hr: "https://vidsrc.vip/embed/movie/{movieId}&lang=hr",
      mk: "https://vidsrc.xyz/embed/movie?tmdb={movieId}&ds_lang=sr",
      bs: "https://vidsrc.xyz/embed/movie?tmdb={movieId}&ds_lang=hr",
      sl: "https://player.smashy.stream/movie/{movieId}?subLang=Serbian&btPosition=200",
      en: "https://player.smashy.stream/movie/{movieId}?subLang=Serbian&btPosition=200"
    };

    let currentMovieId = null;

    function fetchMovies() {
      let url = `${baseUrl}discover/movie?api_key=${apiKey}&language=hr-HR`;
      fetch(url)
        .then(response => response.json())
        .then(data => {
          const movies = data.results;
          movies.forEach(movie => {
            const movieItem = document.createElement('div');
            movieItem.classList.add('movie-item');
            const movieImage = document.createElement('img');
            movieImage.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
            movieItem.appendChild(movieImage);
            const movieTitle = document.createElement('h3');
            movieTitle.textContent = movie.title;
            movieItem.appendChild(movieTitle);
            movieItem.addEventListener('click', () => {
              displayMovieInfo(movie.id);
            });
            movieList.appendChild(movieItem);
          });
        })
        .catch(error => {
          console.error('Greška pri učitavanju filmova:', error);
        });
    }

    function displayMovieInfo(movieId) {
      currentMovieId = movieId;
      sessionStorage.setItem('currentMovieId', movieId);
      sessionStorage.setItem('popupOpen', 'true');
      let url = `${baseUrl}movie/${movieId}?api_key=${apiKey}&language=hr-HR`;
      fetch(url)
        .then(response => response.json())
        .then(data => {
          document.getElementById('moviePopupImage').src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
          document.getElementById('moviePopupTitle').textContent = data.title;
          document.getElementById('moviePopupOverview').textContent = data.overview;
          document.getElementById('moviePopupReleaseDate').textContent = data.release_date;
          document.getElementById('moviePopupGenres').textContent = data.genres.map(genre => genre.name).join(', ');

          moviePopup.style.display = 'flex';

          // Postavljanje fokusa na dugme za srpski jezik
          const savedLanguage = sessionStorage.getItem('selectedLanguage');
          const focusButton = savedLanguage ? document.getElementById(savedLanguage) : document.getElementById('sr');
          focusButton.focus();

          // Dodavanje klase za selektovani jezik
          document.querySelectorAll('.languageButton').forEach(button => button.classList.remove('selectedLanguage'));
          focusButton.classList.add('selectedLanguage');
        })
        .catch(error => {
          console.error('Greška pri učitavanju podataka o filmu:', error);
        });
    }

    function closePopup() {
      moviePopup.style.display = 'none';
      sessionStorage.setItem('popupOpen', 'false');
    }

    function changeLanguage(lang) {
      sessionStorage.setItem('selectedLanguage', lang);

      const buttons = document.querySelectorAll('.languageButton');
      buttons.forEach(button => button.classList.remove('selectedLanguage'));
      document.getElementById(lang).classList.add('selectedLanguage');

      const videoUrl = languageUrls[lang].replace("{movieId}", currentMovieId);
      window.location.href = videoUrl;
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchMovies();

      const popupOpen = sessionStorage.getItem('popupOpen') === 'true';
      const savedMovieId = sessionStorage.getItem('currentMovieId');

      if (popupOpen && savedMovieId) {
        displayMovieInfo(savedMovieId);
      }
    });
  </script>
</body>
</html>
