<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Scrolling with Remote Navigation</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #181818;
            color: #fff;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background-color: #242424;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .button-container button {
            background-color: transparent;
            border: none;
            cursor: pointer;
        }
        .button-container img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            transition: transform 0.3s ease-in-out;
        }
        .button-container img:hover {
            transform: scale(1.1);
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .section {
            width: 100%;
            margin-bottom: 30px;
        }
        .section h2 {
            text-align: center;
            margin: 20px 0;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }
        .image-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 0;
        }
        .image-container img {
            width: calc(16.66% - 10px);
            height: auto;
            border: 2px solid #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
        .image-container img:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <!-- Button Section -->
    <div class="button-container" id="buttonContainer">
        <button>
            <img src="https://via.placeholder.com/50" alt="Button 1">
        </button>
        <button>
            <img src="https://via.placeholder.com/50" alt="Button 2">
        </button>
        <button>
            <img src="https://via.placeholder.com/50" alt="Button 3">
        </button>
        <button>
            <img src="https://via.placeholder.com/50" alt="Button 4">
        </button>
        <button>
            <img src="https://via.placeholder.com/50" alt="Button 5">
        </button>
        <button>
            <img src="https://via.placeholder.com/50" alt="Button 6">
        </button>
    </div>

    <!-- Netflix Section -->
    <div class="section" id="netflixSection">
        <h2>Netflix</h2>
        <div class="image-container" id="netflixImages"></div>
    </div>

    <!-- Hulu Section -->
    <div class="section" id="huluSection">
        <h2>Hulu</h2>
        <div class="image-container" id="huluImages"></div>
    </div>

    <!-- Popular Section -->
    <div class="section" id="popularSection">
        <h2>Popular</h2>
        <div class="image-container" id="popularImages"></div>
    </div>

    <script>
        async function fetchMovies(apiKey, sectionId, category) {
            const tmdbBaseUrl = "https://api.themoviedb.org/3";
            const response = await fetch(`${tmdbBaseUrl}/movie/${category}?api_key=${apiKey}&language=en-US&page=1`);
            const data = await response.json();

            if (data.results && data.results.length > 0) {
                displayImages(data.results, sectionId);
            }
        }

        function displayImages(movies, sectionId) {
            const container = document.getElementById(sectionId);
            container.innerHTML = ""; // Clear existing images
            movies.forEach(movie => {
                const imgElement = document.createElement('img');
                imgElement.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                imgElement.alt = movie.title;
                imgElement.tabIndex = 0; // Allow keyboard navigation
                imgElement.addEventListener('click', () => {
                    window.location.href = `https://vidsrc.vip/embed/movie/${movie.id}`;
                });
                container.appendChild(imgElement);
            });

            handleKeyboardNavigation(); // Enable keyboard navigation
        }

        function handleKeyboardNavigation() {
            const sections = document.querySelectorAll('.section');
            let currentSectionIndex = 0;
            let currentImageIndex = 0;

            const focusImage = () => {
                const currentSection = sections[currentSectionIndex];
                const imageContainer = currentSection.querySelector('.image-container');
                const images = imageContainer.querySelectorAll('img');
                if (images.length > 0) {
                    images[currentImageIndex].focus();
                }
            };

            focusImage(); // Initial focus

            document.addEventListener('keydown', (event) => {
                const currentSection = sections[currentSectionIndex];
                const imageContainer = currentSection.querySelector('.image-container');
                const images = imageContainer.querySelectorAll('img');

                if (event.key === 'ArrowRight') {
                    currentImageIndex = (currentImageIndex + 1) % images.length;
                } else if (event.key === 'ArrowLeft') {
                    currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
                } else if (event.key === 'ArrowDown') {
                    currentSectionIndex = (currentSectionIndex + 1) % sections.length;
                    currentImageIndex = 0;
                } else if (event.key === 'ArrowUp') {
                    currentSectionIndex = (currentSectionIndex - 1 + sections.length) % sections.length;
                    currentImageIndex = 0;
                }

                focusImage();
            });
        }

        function handleButtonKeyboardNavigation() {
            const buttons = document.querySelectorAll('.button-container button');
            let currentButtonIndex = 0;

            const focusButton = () => {
                buttons[currentButtonIndex].focus();
            };

            focusButton(); // Initial focus

            document.addEventListener('keydown', (event) => {
                if (event.key === 'ArrowRight') {
                    currentButtonIndex = (currentButtonIndex + 1) % buttons.length;
                } else if (event.key === 'ArrowLeft') {
                    currentButtonIndex = (currentButtonIndex - 1 + buttons.length) % buttons.length;
                }

                focusButton();
            });
        }

        handleButtonKeyboardNavigation();

        // Fetch data for each section
        fetchMovies('2701858e9bccab54d4d0e4931420a739', 'netflixImages', 'popular');
        fetchMovies('2701858e9bccab54d4d0e4931420a739', 'huluImages', 'top_rated');
        fetchMovies('2701858e9bccab54d4d0e4931420a739', 'popularImages', 'upcoming');
    </script>
</body>
</html>
