<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic Movies & Series Explorer (2000–2010)</title>

<style>
:root {
    --red: #E50914;
    --dark: #121212;
    --card: #1e1e1e;
    --muted: #aaa;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--dark);
    color: #fff;
}

header {
    background: linear-gradient(90deg,#E50914,#b20710);
    padding: 20px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
}

.notice {
    text-align: center;
    padding: 10px;
    background: #333;
    font-size: 14px;
    color: #ffdd57;
    border-bottom: 1px solid #444;
}

/* NAV */
nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    background: #1a1a1a;
    padding: 10px;
}

nav button, nav select, nav input {
    background: #222;
    color: #fff;
    border: 1px solid #333;
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 14px;
}

nav button:hover { background: var(--red); }

/* GRID CARDS */
.container {
    padding: 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(170px,1fr));
    gap: 16px;
}

.card {
    background: var(--card);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: .3s;
}

.card:hover { transform: translateY(-4px); }

.card img { width: 100%; height: 260px; object-fit: cover; }

.card h3 { font-size: 14px; margin: 8px; }

.card span { margin: 0 8px 10px; display: block; color: var(--muted); font-size: 12px; }

/* SHOW MORE */
.show-more-wrap { text-align: center; padding: 20px; }
.show-more-btn {
    background: var(--red);
    color: #fff;
    border: none;
    padding: 15px 40px;
    font-size: 18px;
    border-radius: 10px;
    cursor: pointer;
}
.show-more-btn:hover { background: #b20710; }

/* POPUP */
.popup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.94);
    display: flex;
    align-items: center;
    justify-content: center;
    visibility: hidden;
    opacity: 0;
    transition: .3s;
}
.popup.active { visibility: visible; opacity: 1; }

.popup-content {
    background: #222;
    max-width: 900px;
    width: 94%;
    padding: 22px;
    border-radius: 12px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
}

.popup-content img {
    width: 180px;
    float: left;
    margin-right: 18px;
    border-radius: 8px;
}

.close {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--red);
    border: none;
    color: #fff;
    padding: 8px 12px;
    border-radius: 50%;
    cursor: pointer;
}

.section { margin-top: 18px; }
.section p { line-height: 1.6; color: #ddd; }
</style>
</head>

<body>

<header>🎞 Movies & TV Info (2000–2010)</header>
<div class="notice">
⚠️ Note: This page is **for information purposes only**. You cannot watch movies or shows here.
</div>


<nav>
<button onclick="loadMovies()">🎬 Movies</button>
<button onclick="loadTV()">📺 TV Shows</button>
<select onchange="filterGenre(this.value)">
    <option value="">Filter by Genre</option>
    <option value="28">Action</option>
    <option value="12">Adventure</option>
    <option value="16">Animation</option>
    <option value="35">Comedy</option>
    <option value="18">Drama</option>
    <option value="14">Fantasy</option>
    <option value="27">Horror</option>
    <option value="10749">Romance</option>
    <option value="878">Sci-Fi</option>
</select>
<select onchange="filterYear(this.value)">
    <option value="">Filter by Year</option>
    <option value="2000-2002">2000–2002</option>
    <option value="2003-2005">2003–2005</option>
    <option value="2006-2008">2006–2008</option>
    <option value="2009-2010">2009–2010</option>
</select>
<input type="text" placeholder="Search title..." oninput="searchMovies(this.value)">
</nav>

<div class="container" id="list"></div>

<div class="show-more-wrap">
<button class="show-more-btn" onclick="showMore()">⬇ SHOW MORE</button>
</div>

<div class="popup" id="popup">
<div class="popup-content" id="popupContent"></div>
</div>

<script>
const API = "https://api.themoviedb.org/3";
const KEY = "2701858e9bccab54d4d0e4931420a739";

let page = 1;
let mode = "movie";
let baseURL = "";
let allData = [];
let currentGenre = "";
let currentYearRange = "";

/* ---------------- LOADERS ---------------- */
function loadMovies() {
    baseURL = `${API}/discover/movie?api_key=${KEY}&primary_release_date.gte=2000-01-01&primary_release_date.lte=2010-12-31&sort_by=popularity.desc`;
    resetAndLoad("movie");
}

function loadTV() {
    baseURL = `${API}/discover/tv?api_key=${KEY}&first_air_date.gte=2000-01-01&first_air_date.lte=2010-12-31&sort_by=popularity.desc`;
    resetAndLoad("tv");
}

/* ---------------- RESET ---------------- */
function resetAndLoad(type) {
    mode = type;
    page = 1;
    allData = [];
    document.getElementById("list").innerHTML = "";
    document.querySelector(".show-more-btn").style.display = "inline-block";
    fetchPage();
}

/* ---------------- FETCH PAGE ---------------- */
async function fetchPage() {
    let url = `${baseURL}&page=${page}`;
    if (currentGenre) url += `&with_genres=${currentGenre}`;
    if (currentYearRange) {
        const [start, end] = currentYearRange.split("-");
        url = url.replace(/primary_release_date.gte=2000-01-01/, `primary_release_date.gte=${start}-01-01`)
                 .replace(/primary_release_date.lte=2010-12-31/, `primary_release_date.lte=${end}-12-31`);
    }

    const res = await fetch(url);
    const data = await res.json();
    if (!data.results || data.results.length === 0) {
        document.querySelector(".show-more-btn").style.display = "none";
        return;
    }

    allData = allData.concat(data.results);
    render(data.results);
    page++;
}

/* ---------------- RENDER CARDS ---------------- */
function render(items) {
    const c = document.getElementById("list");
    items.forEach(i => {
        if (!i.poster_path) return;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <img src="https://image.tmdb.org/t/p/w500${i.poster_path}" alt="${i.title||i.name}">
            <h3>${i.title||i.name}</h3>
            <span>⭐ ${i.vote_average} | ${(i.release_date||i.first_air_date||"").slice(0,4)}</span>
        `;
        card.onclick = () => openPopup(i.id);
        c.appendChild(card);
    });
}

/* ---------------- SHOW MORE ---------------- */
function showMore() {
    fetchPage();
}

/* ---------------- FILTERS ---------------- */
function filterGenre(genre) {
    currentGenre = genre;
    resetAndLoad(mode);
}

function filterYear(range) {
    currentYearRange = range;
    resetAndLoad(mode);
}

function searchMovies(query) {
    const filtered = allData.filter(m => (m.title||m.name).toLowerCase().includes(query.toLowerCase()));
    document.getElementById("list").innerHTML = "";
    render(filtered);
}

/* ---------------- POPUP ---------------- */
async function openPopup(id) {
    const res = await fetch(`${API}/${mode}/${id}?api_key=${KEY}`);
    const m = await res.json();

    const genres = m.genres ? m.genres.map(g => g.name).join(", ") : "N/A";
    const runtime = m.runtime || m.episode_run_time?.[0] || "N/A";
    const status = m.status || "N/A";

    // Fun fact
    let funFact = "";
    if (m.title && m.title.toLowerCase().includes("ring")) funFact = "💍 This movie features a legendary ring central to its story!";
    else if (m.title && m.title.toLowerCase().includes("matrix")) funFact = "🕶 Famous for its revolutionary 'bullet time' effect!";
    else if (m.title && m.title.toLowerCase().includes("pirates")) funFact = "🏴‍☠️ Inspired by classic pirate tales and adventures!";
    else funFact = "🎬 A standout title from the golden era 2000–2010.";

    document.getElementById("popupContent").innerHTML = `
        <button class="close" onclick="closePopup()">✖</button>
        <img src="https://image.tmdb.org/t/p/w500${m.poster_path}" alt="${m.title||m.name}">
        <h2>${m.title||m.name}</h2>
        <em style="color:#aaa">${m.tagline||""}</em>

        <div class="section">
            <p>${m.overview || "No description available."}</p>
        </div>

        <div class="section">
            <p>
            ⭐ Rating: ${m.vote_average} (${m.vote_count})<br>
            🎭 Genres: ${genres}<br>
            ⏱ Runtime: ${runtime} min<br>
            📅 Year: ${(m.release_date||m.first_air_date||"").slice(0,4)}<br>
            🌍 Language: ${m.original_language.toUpperCase()}<br>
            🔥 Popularity: ${Math.round(m.popularity)}<br>
            📝 Status: ${status}
            </p>
        </div>

        <div class="section">
            <p>This title comes from the golden era (2000–2010), known for strong storytelling, practical effects, and memorable characters.</p>
        </div>

        <div class="section">
            <strong>🎉 Fun Fact / Trivia:</strong>
            <p>${funFact}</p>
        </div>

        <div class="section" style="color:#ffdd57; font-size:13px;">
            ⚠️ Reminder: This popup provides **information only**, not the movie itself.
        </div>
    `;
    document.getElementById("popup").classList.add("active");
}

function closePopup() {
    document.getElementById("popup").classList.remove("active");
}

/* ---------------- INIT ---------------- */
loadMovies();
</script>

</body>
</html>
