/* Stil za desktop i veće ekrane */
header {
    width: 100%;

    align-items: center;

    transition: background-color 0.3s ease;
}

/* Stil za mobilne uređaje */
@media (max-width: 768px) {
    header {
        padding: 10px 15px; /* Smanjuje unutrašnje margine */

}

        header h1 {

            transition: border-color 0.3s ease;
        }

       /* Stilovi za header selekt na desktop uređajima */
header select {

}


        #movie-list {

        .movie-item {
            margin: 1px;
            width: 100px;
            text-align: center;
            border-radius: 0px;
            overflow: hidden;
            background-color: #1f1f1f;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);

        #movie-modal {

            top: 1;
            left: 0;

    <script src="script.js"></script>
    
    <script>
document.addEventListener('DOMContentLoaded', () => {
    const apiKey = '2701858e9bccab54d4d0e4931420a739';
    const baseURL = 'https://api.themoviedb.org/3';
    let currentPage = 1;
    let currentQuery = '';
    let selectedGenre = '';
    let selectedYear = '';
    let selectedLanguage = 'en-US'; // Default language
    let selectedSortBy = ''; // Selected sorting option from popular-select

    // Fetch movies from API
    const fetchMovies = (page = 1, query = '', genre = '', year = '', sortBy = '') => {
        let url = `${baseURL}/discover/movie?api_key=${apiKey}&page=${page}&language=${selectedLanguage}`;

        if (query) url += `&query=${encodeURIComponent(query)}`;
        if (genre) url += `&with_genres=${genre}`;
        if (year) url += `&primary_release_year=${year}`;
        if (sortBy) url += `&sort_by=${sortBy}`;

        fetch(url)
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(`API Error: ${err.status_message}`); });
                }
                return response.json();
            })
            .then(data => {
                displayMovies(data.results);
                currentPage = page;
                document.getElementById('current-page').textContent = page;
            })
            .catch(error => console.error('Error fetching movies:', error));
    };

    // Display movies on the page
    const displayMovies = (movies) => {
        const movieList = document.getElementById('movie-list');
        if (!movieList) {
            console.error('Element with ID "movie-list" not found.');
            return;
        }
        movieList.innerHTML = ''; // Clear previous movies

        movies.forEach(movie => {
            const movieItem = document.createElement('div');
            movieItem.className = 'movie-item';
            movieItem.dataset.id = movie.id; // Store movie ID
            movieItem.dataset.type = 'movie'; // Mark as movie
            movieItem.innerHTML = `
                <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}">
                <h2>${movie.title}</h2>
                <p>${movie.release_date}</p>
            `;
            movieItem.addEventListener('click', () => showMovieDetails(movie.id, 'movie'));
            movieList.appendChild(movieItem);
        });
    };

    // Fetch movie details
    const showMovieDetails = (id, type) => {
        const endpoint = type === 'movie' ? `/movie/${id}` : `/tv/${id}`;
        fetch(`${baseURL}${endpoint}?api_key=${apiKey}&language=${selectedLanguage}`)
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(`API Error: ${err.status_message}`); });
                }
                return response.json();
            })
            .then(details => {
                const { title, release_date, overview, poster_path } = details;
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-release-date').textContent = `Release Date: ${release_date}`;
                document.getElementById('modal-overview').textContent = overview;
                document.getElementById('modal-poster').src = `https://image.tmdb.org/t/p/w500${poster_path}`;

                document.getElementById('media-iframe').src = `https://vidsrc.xyz/embed/movie/${id}`;
                document.getElementById('movie-modal').style.display = 'block';
            })
            .catch(error => console.error('Error fetching movie details:', error));
    };

    // Close modal
    const closeModalButton = document.getElementById('close-modal');
    if (closeModalButton) {
        closeModalButton.addEventListener('click', () => {
            document.getElementById('movie-modal').style.display = 'none';
        });
    } else {
        console.error('Element with ID "close-modal" not found.');
    }

    // Load more button
    const loadMoreButton = document.getElementById('load-more');
    if (loadMoreButton) {
        loadMoreButton.addEventListener('click', () => {
            fetchMovies(currentPage + 1, currentQuery, selectedGenre, selectedYear, selectedSortBy);
        });
    } else {
        console.error('Element with ID "load-more" not found.');
    }

    // Search movies
    const filterMovies = () => {
        const searchInput = document.getElementById('searchInput').value.toLowerCase();
        const movies = document.querySelectorAll('.movie-item');
        movies.forEach(movie => {
            const title = movie.querySelector('h2').textContent.toLowerCase();
            if (title.includes(searchInput)) {
                movie.style.display = 'block';
            } else {
                movie.style.display = 'none';
            }
        });
    };

    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('input', filterMovies);
    } else {
        console.error('Element with ID "searchInput" not found.');
    }

    // Genre filter
    const genreSelect = document.getElementById('genre-select');
    if (genreSelect) {
        genreSelect.addEventListener('change', () => {
            selectedGenre = genreSelect.value;
            fetchMovies(currentPage, currentQuery, selectedGenre, selectedYear, selectedSortBy);
        });
    } else {
        console.error('Element with ID "genre-select" not found.');
    }

    // Year filter
    const yearSelect = document.getElementById('year-select');
    if (yearSelect) {
        yearSelect.addEventListener('change', () => {
            selectedYear = yearSelect.value;
            fetchMovies(currentPage, currentQuery, selectedGenre, selectedYear, selectedSortBy);
        });
    } else {
        console.error('Element with ID "year-select" not found.');
    }

    // Popularity sort filter
   // Ažurirani popular-select sa dodatnim opcijama
const popularSelect = document.getElementById('popular-select');
if (popularSelect) {
    popularSelect.addEventListener('change', () => {
        const selectedOption = popularSelect.value;

       if (selectedOption === 'hulu') {
            fetchHuluMovies();
        } else if (selectedOption === 'marvel') {
            fetchMarvelMovies();
        } else if (selectedOption === 'netflix') {
            fetchNetflixMovies();
        } else if (selectedOption === 'disney') {
            fetchDisneyMovies();
        } else if (selectedOption === 'apple') { // Nova opcija
            fetchAppleMovies();
        } else {
            selectedSortBy = selectedOption;
            fetchMovies(currentPage, currentQuery, selectedGenre, selectedYear, selectedSortBy);
        }
    });
} else {
    console.error('Element with ID "popular-select" not found.');
}

// Funkcija za Hulu filmove
const fetchHuluMovies = () => {
    const url = `${baseURL}/discover/movie?api_key=${apiKey}&with_watch_providers=15&watch_region=US&language=${selectedLanguage}`;
    fetchAndDisplayMovies(url);
};

// Funkcija za Marvel filmove
const fetchMarvelMovies = () => {
    const url = `${baseURL}/discover/movie?api_key=${apiKey}&with_companies=420&language=${selectedLanguage}`;
    fetchAndDisplayMovies(url);
};

// Funkcija za Netflix filmove
const fetchNetflixMovies = () => {
    const url = `${baseURL}/discover/movie?api_key=${apiKey}&with_watch_providers=8&watch_region=US&language=${selectedLanguage}`;
    fetchAndDisplayMovies(url);
};

// Funkcija za Disney+ filmove
const fetchDisneyMovies = () => {
    const url = `${baseURL}/discover/movie?api_key=${apiKey}&with_watch_providers=337&watch_region=US&language=${selectedLanguage}`;
    fetchAndDisplayMovies(url);
};

// Funkcija za Apple TV+ filmove
const fetchAppleMovies = () => {
    const url = `${baseURL}/discover/movie?api_key=${apiKey}&with_watch_providers=350&watch_region=US&language=${selectedLanguage}`;
    fetchAndDisplayMovies(url);
};


// Pomoćna funkcija za prikaz filmova
const fetchAndDisplayMovies = (url) => {
    fetch(url)
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => { throw new Error(`API Error: ${err.status_message}`); });
            }
            return response.json();
        })
        .then(data => displayMovies(data.results))
        .catch(error => console.error('Error fetching filtered movies:', error));
};


    // Initial load
    fetchMovies();
});


</script>
