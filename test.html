<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sve na Ekranu</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        header {
            width: 100%;
            background-color: #1c1c1c;
            padding: 15px 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            border-radius: 0 0 20px 20px; /* Rounded corners */
            transition: background-color 0.3s ease;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        header input[type="text"] {
            padding: 10px;
            border: none;
            border-radius: 5px;
            outline: none;
            font-size: 18px;
            width: 300px;
            transition: border-color 0.3s ease;
        }

        header input[type="text"]:focus {
            border-color: #007bff;
        }

        header select {
            padding: 10px;
            border: none;
            border-radius: 5px;
            outline: none;
            font-size: 18px;
            background-color: #222;
            color: #ddd;
            margin-left: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header select:hover {
            background-color: #007bff;
            color: #fff;
        }

        #movie-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 100px 20px 20px;
            width: 100%;
        }

        .movie-item {
            margin: 15px;
            width: 120px;
            text-align: center;
            border-radius: 10px;
            overflow: hidden;
            background-color: #1f1f1f;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .movie-item img {
            width: 100%;
            height: auto;
            transition: transform 0.3s ease;
        }

        .movie-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }

        .movie-item h2, .movie-item p {
            margin: 10px 0;
            color: #ddd;
            transition: color 0.3s ease;
        }

        .movie-item:hover h2, .movie-item:hover p {
            color: #007bff;
        }

        #movie-modal {
            display: none;
            position: fixed;
            top: 10;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            z-index: 1000;
            overflow-y: auto;
            box-sizing: border-box;
            text-align: center;
            transition: opacity 0.3s ease;
        }

        #movie-modal #close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #fff;
            transition: color 0.3s ease;
        }

        #movie-modal #close-modal:hover {
            color: #007bff;
        }

        #movie-modal h2 {
            margin: 20px 0;
            font-size: 40px;
            font-weight: bold;
        }

        #movie-modal p {
            font-size: 14px;
            margin: 10px 0;
        }

        #movie-modal img {
            width: 20px;
            border-radius: 10px;
            margin: 2px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        #movie-modal iframe {
            width: 100%;
            height: 500px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        #tv-options {
            margin-top: 20px;
        }

        #tv-options input, #tv-options button {
            padding: 12px;
            font-size: 18px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #222;
            color: #ddd;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        #tv-options input:focus {
            border-color: #007bff;
        }

        #tv-options button {
            background-color: #007bff;
            border: none;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        #tv-options button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        #load-more {
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            margin: 20px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        #load-more:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
        
        /* Basic Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}



/* Navigation Bar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #202020;
    padding: 10px 20px;
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
}

.navbar-left {
    display: flex;
    align-items: center;
}

.menu-icon {
    margin-right: 20px;
    cursor: pointer;
}

.logo img {
    height: 30px;
}

.search-bar {
    display: flex;
    align-items: center;
    flex-grow: 1;
    max-width: 600px;
    margin: 0 20px;
}

.search-bar input {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 2px 0 0 2px;
    background-color: #121212;
    color: #FFF;
}

.search-button {
    padding: 10px;
    background-color: #323232;
    border: none;
    cursor: pointer;
    border-radius: 0 2px 2px 0;
}

.search-button img {
    filter: invert(1);
}

.user-menu {
    display: flex;
    align-items: center;
}

.user-menu button {
    background-color: transparent;
    border: none;
    margin-left: 20px;
    cursor: pointer;
}

.user-menu img {
    width: 24px;
    filter: invert(1);
}

/* Sidebar */
.sidebar {
    position: fixed;
    top: 50px;
    left: 0;
    width: 240px;
    height: 100%;
    background-color: #202020;
    padding-top: 20px;
    z-index: 1000;
}

.sidebar ul {
    list-style: none;
    padding: 0;
}

.sidebar ul li {
    padding: 15px 20px;
    display: flex;
    align-items: center;
    color: #FFF;
    cursor: pointer;
    transition: background-color 0.3s;
}

.sidebar ul li img {
    margin-right: 20px;
}

.sidebar ul li:hover,
.sidebar ul li.active {
    background-color: #383838;
}

/* Main Content */
.main-content {
    margin-left: 260px;
    padding: 80px 20px 20px 20px;
    background-color: #181818;
}


.video-info {
    display: flex;
    padding: 15px;
    align-items: center;
}

.channel-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: 15px;
}

.video-details h4 {
    margin-bottom: 5px;
    font-size: 16px;
    color: #FFF;
}

.video-details p {
    font-size: 14px;
    color: #AAA;
}

/* Footer */
.footer {
    text-align: center;
    padding: 10px 0;
    background-color: #202020;
    position: fixed;
    bottom: 0;
    width: 100%;
}



    </style>
</head>
<body>
  
    <header>
        <h1>Sve na Ekranu</h1>
        <input type="text" id="searchInput" placeholder="Search movies...">
        <select id="language-select">
            <option value="en-US">English</option>
            <option value="es-ES">Spanish</option>
            <option value="fr-FR">French</option>
            <option value="ar-AR">Arabic</option>
            <!-- Add more languages as needed -->
        </select>
    </header>
    <div id="movie-list"></div>
    <button id="load-more">Load More</button>

  <div id="popup-modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
         <iframe id="iframe-player" width="100%" height="400" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>
</div>
    <div id="movie-modal">
        <span id="close-modal">×</span>
        <h2 id="modal-title"></h2>
        <p id="modal-release-date"></p>
        <img id="modal-poster" src="" alt="Movie Poster">
        <p id="modal-overview"></p>
        <iframe id="media-iframe" src="" allowfullscreen></iframe>
        <div id="tv-options" style="display: none;">
            <input type="number" id="season-number" placeholder="Season Number" min="1">
            <input type="number" id="episode-number" placeholder="Episode Number" min="1">
            <button id="update-embed">Update Embed</button>
        </div>
    </div>

    <script src="script.js"></script>
    
    <script>document.addEventListener('DOMContentLoaded', () => {
    const apiKey = '2701858e9bccab54d4d0e4931420a739';
    const baseURL = 'https://api.themoviedb.org/3';
    let currentPage = 1;
    let currentQuery = '';
    let selectedLanguage = 'en-US'; // Default language

    const fetchMovies = (page = 1, query = '') => {
        const url = query
            ? `${baseURL}/search/movie?api_key=${apiKey}&query=${encodeURIComponent(query)}&page=${page}&language=${selectedLanguage}`
            : `${baseURL}/movie/popular?api_key=${apiKey}&page=${page}&language=${selectedLanguage}`;

        console.log(`Requesting movies API with URL: ${url}`);

        fetch(url)
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(`Network response was not ok: ${response.statusText}. Response text: ${text}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                console.log('Movies API response:', data);
                displayMovies(data.results);
                currentPage = page;
            })
            .catch(error => console.error('Error fetching movies:', error));
    };
  
  async function openVideo(movieId) {
        const videoUrl = `https://moviesapi.club/movie/${movieId}`;
        const modal = document.getElementById('popup-modal');
        const iframe = document.getElementById('iframe-player');

        iframe.src = videoUrl;
        modal.style.display = 'block';

        // Zatvori modal
        document.querySelector('.close').addEventListener('click', () => {
            modal.style.display = 'none';
            iframe.src = ''; // Resetujemo iframe src kada se zatvori
        });
    }

    const displayMovies = (movies) => {
        const movieList = document.getElementById('movie-list');
        if (movieList) {
            movieList.innerHTML = ''; // Clear previous results
            movies.forEach(movie => {
                const movieItem = document.createElement('div');
                movieItem.className = 'movie-item';
                movieItem.dataset.id = movie.id; // Store movie ID for later use
                movieItem.dataset.type = 'movie'; // Mark as movie
                movieItem.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}">
                    <h2>${movie.title}</h2>
                    <p>${movie.release_date}</p>
                `;
                movieItem.addEventListener('click', () => showMovieDetails(movie.id, 'movie')); // Add click event
                movieList.appendChild(movieItem);
            });
        } else {
            console.error('Element with ID "movie-list" not found.');
        }
    };

    const showMovieDetails = (id, type) => {
        const endpoint = type === 'movie' ? `/movie/${id}` : `/tv/${id}`;
        fetch(`${baseURL}${endpoint}?api_key=${apiKey}&language=${selectedLanguage}`)
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(`Network response was not ok: ${response.statusText}. Response text: ${text}`);
                    });
                }
                return response.json();
            })
            .then(details => {
                const { title, release_date, overview, poster_path } = details;
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-release-date').textContent = `Release Date: ${release_date}`;
                document.getElementById('modal-overview').textContent = overview;
                document.getElementById('modal-poster').src = `https://image.tmdb.org/t/p/w500${poster_path}`;

                const mediaIframe = document.getElementById('media-iframe');
                if (type === 'movie') {
                    mediaIframe.src = `https://vidsrc.pro/embed/movie/${id}`;
                    document.getElementById('tv-options').style.display = 'none';
                } else {
                    mediaIframe.src = '';
                    document.getElementById('tv-options').style.display = 'block';
                }

                document.getElementById('movie-modal').style.display = 'block';
            })
            .catch(error => console.error('Error fetching movie details:', error));
    };

    const updateEmbed = () => {
        const seasonNumber = document.getElementById('season-number').value;
        const episodeNumber = document.getElementById('episode-number').value;
        const id = document.querySelector('.movie-item').dataset.id; // Get current TV show ID

        if (seasonNumber && episodeNumber) {
            const mediaIframe = document.getElementById('media-iframe');
            mediaIframe.src = `https://vidsrc.pro/embed/tv/${id}/${seasonNumber}/${episodeNumber}`;
        }
    };

    const closeModalButton = document.getElementById('close-modal');
    if (closeModalButton) {
        closeModalButton.addEventListener('click', () => {
            document.getElementById('movie-modal').style.display = 'none';
        });
    } else {
        console.error('Element with ID "close-modal" not found.');
    }

    const loadMoreButton = document.getElementById('load-more');
    if (loadMoreButton) {
        loadMoreButton.addEventListener('click', () => {
            fetchMovies(currentPage + 1, currentQuery);
        });
    } else {
        console.error('Element with ID "load-more" not found.');
    }

    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('input', () => {
            const query = searchInput.value;
            currentQuery = query; // Store the search query
            currentPage = 1; // Reset the page number for new search
            fetchMovies(1, query); // Fetch movies with search query
        });
    } else {
        console.error('Element with ID "searchInput" not found.');
    }

    const updateEmbedButton = document.getElementById('update-embed');
    if (updateEmbedButton) {
        updateEmbedButton.addEventListener('click', updateEmbed);
    } else {
        console.error('Element with ID "update-embed" not found.');
    }

    // Handle language change
    const languageSelect = document.getElementById('language-select');
    if (languageSelect) {
        languageSelect.addEventListener('change', () => {
            selectedLanguage = languageSelect.value;
            fetchMovies(currentPage, currentQuery); // Fetch movies with selected language
        });
    } else {
        console.error('Element with ID "language-select" not found.');
    }

    // Initial load
    fetchMovies();
});

</script>
</body>
</html>
