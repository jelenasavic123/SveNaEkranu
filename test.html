<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Serije Grid</title>
<style>
body {
  background:#141414;
  color:#fff;
  font-family:'Segoe UI',sans-serif;
  margin:0;
  padding:0;
  overflow:hidden;
}

.sort-buttons {
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  background:#1a1a1a;
}

.sort-buttons button {
  padding:6px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  color:white;
  transition: background 0.3s;
}

.sort-buttons button.active { background:#ff3d00; }
.sort-buttons button:not(.active) { background:#555; }

#seriesGrid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
  grid-auto-rows: 180px;
  gap:15px;
  overflow-y:auto;
  width:100%;
  max-height:100%;
  scroll-behavior:smooth;
}

.series-card {
  cursor:pointer;
  overflow:hidden;
  border-radius:10px;
  position:relative;
  background:#222;
  transition: transform 0.3s, box-shadow 0.3s;
}

.series-card img {
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:10px;
  transition: transform 0.3s, opacity 0.5s;
  opacity:0;
}

.series-card img.loaded { opacity:1; }
.series-card:hover img,
.series-card.focused img { transform: scale(1.03); }

.series-title {
  position:absolute;
  bottom:0;
  width:100%;
  background:linear-gradient(transparent, rgba(0,0,0,0.85));
  padding:4px;
  font-weight:bold;
  text-align:center;
  font-size:0.8em;
  color:#fff;
}

.series-card.focused {
  box-shadow:0 0 15px rgba(255,61,0,0.8);
  border:2px solid #ff3d00;
}

.series-info-container {
  width:100%;
  padding:8px 6px;
  text-align:center;
  color:#fff;
}

.series-details {
  font-size:0.8em;
  color:#ccc;
}

.favorite-icon {
  position:absolute;
  top:8px;
  right:8px;
  font-size:1.2em;
  color:rgba(255,255,255,0.5);
  transition: color 0.3s;
  cursor:pointer;
}

.favorite-icon.active { color:#ff3d00; }

.series-card.focused {
  box-shadow:0 0 20px rgba(255,61,0,0.8);
  border:2px solid #ff3d00;
}

/* BLOKIRANJE BLOGGER COOKIE POPUPA */
#cookieChoiceInfo,
.cookie-choices-info,
.cookie-choices-button,
.cookie-choices-background,
.cookie-choices {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
}
</style>
</head>
<body>

<div class="sort-buttons">
  <button id="sortOld" tabindex="0">Stare serije</button>
  <button id="sortAll" class="active" tabindex="0">Sve serije</button>
  <button id="sortPopular" tabindex="0">Popularno</button>
  <button id="sortRecommended" tabindex="0">Preporuka</button>
  <button id="sortMini" tabindex="0">Mini</button>
  <button id="sortFavorite" tabindex="0">Favorite</button>
</div>

<div id="seriesGrid"></div>

<script>
const FIREBASE_URL = "https://spring-firefly-83f9.balevasanja.workers.dev/";
let seriesData = {};
let focusIndex = 0;
let currentFilter = 'all';
let focusOnButtons = true;
let buttonIndex = 0;
const buttonIds = ["sortAll","sortPopular","sortRecommended","sortMini","sortFavorite","sortOld"];

function safePoster(url){ return url || 'https://via.placeholder.com/140x210?text=No+Image'; }

function isFavorite(key){
  const favs = JSON.parse(localStorage.getItem("favorites")||"[]");
  return favs.includes(key);
}

function toggleFavorite(e,key){
  e.stopPropagation();
  let favs = JSON.parse(localStorage.getItem("favorites")||"[]");
  if(favs.includes(key)){
    favs = favs.filter(k=>k!==key);
  } else { favs.push(key); }
  localStorage.setItem("favorites", JSON.stringify(favs));
  renderSeriesGrid();
}

async function loadSeriesList(){
  try{
    const cached = localStorage.getItem("seriesCache");
    let data = cached ? JSON.parse(cached) : null;

    const res = await fetch(FIREBASE_URL);
    const freshData = await res.json();

    let updateNeeded = true;
    if(data && data.lastUpdated && freshData.lastUpdated && data.lastUpdated === freshData.lastUpdated){
      updateNeeded = false;
    }

    if(updateNeeded){
      seriesData = freshData.serije || freshData;
      localStorage.setItem("seriesCache", JSON.stringify(freshData));
      localStorage.setItem("seriesCacheTime", Date.now());
    } else { seriesData = data.serije || data; }

    renderSeriesGrid();
    focusCard(0);
  } catch(e){
    console.error(e);
    document.getElementById('seriesGrid').innerHTML = "<p style='color:white;text-align:center;width:100%;'>Greška pri učitavanju serija</p>";
  }
}

// Dugmad filtera
buttonIds.forEach((id,i)=>{
  document.getElementById(id).addEventListener("click", ()=>{
    if(id==="sortAll") currentFilter='all';
    else if(id==="sortPopular") currentFilter='popular';
    else if(id==="sortRecommended") currentFilter='recommended';
    else if(id==="sortMini") currentFilter='mini';
    else if(id==="sortFavorite") currentFilter='favorite';
    else if(id==="sortOld") {
        // Kada klikne na "Stare serije" vodi na link
        window.location.href = "https://mailrusnd.blogspot.com/p/vrati.html";
        return; // prekidamo dalje renderovanje
    }

    setActiveButton(id);
    renderSeriesGrid();
    focusOnButtons=true;
    buttonIndex=i;
    document.getElementById(id).focus();
  });
});

function setActiveButton(id){
  document.querySelectorAll(".sort-buttons button").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function renderSeriesGrid(){
  const grid = document.getElementById("seriesGrid");
  grid.innerHTML = "";

  let keys = Object.keys(seriesData);

  if(currentFilter==='popular'){
    keys = keys.filter(k => seriesData[k].tag && seriesData[k].tag.includes("Popularno"));
  } else if(currentFilter==='recommended'){
    keys = keys.filter(k => seriesData[k].tag && seriesData[k].tag.includes("Preporuka"));
  } else if(currentFilter==='mini'){
    keys = keys.filter(k => seriesData[k].tag && seriesData[k].tag.includes("Mini"));
  } else if(currentFilter==='favorite'){
    keys = keys.filter(k => isFavorite(k));
  }

  keys.sort((a,b)=>{
    const yearA = parseInt(seriesData[a].godina) || 0;
    const yearB = parseInt(seriesData[b].godina) || 0;
    if(yearA===yearB) return seriesData[a].localName.localeCompare(seriesData[b].localName);
    return yearB - yearA;
  });

  keys.forEach((key)=>{
    const s = seriesData[key];
    const card = document.createElement("div");
    card.className = "series-card";
    card.dataset.key = key;

    const img = document.createElement("img");
    img.src = safePoster(s.poster);
    img.addEventListener('load', ()=>{ img.classList.add('loaded'); });
    img.addEventListener('error', ()=>{ img.src='https://via.placeholder.com/140x210?text=No+Image'; img.classList.add('loaded'); });

    const infoContainer = document.createElement("div");
    infoContainer.className = "series-info-container";

    const title = document.createElement("div");
    title.className="series-title";
    title.textContent = s.localName;

    const details = document.createElement("div");
    details.className="series-details";
    details.innerHTML = `${s.zanr} &#8226; ${s.godina}`;

    infoContainer.appendChild(title);
    infoContainer.appendChild(details);

    const fav = document.createElement("span");
    fav.className = `favorite-icon ${isFavorite(key) ? "active" : ""}`;
    fav.innerHTML = "★";
    fav.onclick = (e)=>{ toggleFavorite(e,key); };

    card.appendChild(img);
    card.appendChild(infoContainer);
    card.appendChild(fav);
    card.onclick = ()=>openSeries(key);
    grid.appendChild(card);
  });
}

function focusCard(index){
  const cards = document.querySelectorAll(".series-card");
  cards.forEach(c=>c.classList.remove("focused"));
  if(cards[index]){
    cards[index].classList.add("focused");
    cards[index].scrollIntoView({behavior:"smooth", block:"nearest", inline:"center"});
    focusIndex = index;
  }
}

function openSeries(key){
  window.location.href = `https://mailrusnd.blogspot.com/p/t.html?series=${encodeURIComponent(key)}`;
}

// Navigacija tastaturom
document.addEventListener('keydown', (e)=>{
  const cards = document.querySelectorAll(".series-card");
  const buttons = document.querySelectorAll(".sort-buttons button");

  if(focusOnButtons){
    if(e.key==="ArrowRight"){ 
      buttonIndex = (buttonIndex+1)%buttons.length;
      buttons[buttonIndex].focus();
    }
    if(e.key==="ArrowLeft"){ 
      buttonIndex = (buttonIndex-1+buttons.length)%buttons.length;
      buttons[buttonIndex].focus();
    }
    if(e.key==="ArrowDown"){ 
      focusOnButtons=false;
      focusCard(0);
    }
    if(e.key==="Enter"){ 
      buttons[buttonIndex].click();
    }
  } else {
    const grid = document.getElementById("seriesGrid");
    const gridWidth = grid.offsetWidth;
    const colWidth = 140 + 15;
    const cols = Math.floor(gridWidth / colWidth);

    if(e.key==="ArrowRight"){ focusCard((focusIndex+1)%cards.length); }
    if(e.key==="ArrowLeft"){ focusCard((focusIndex-1+cards.length)%cards.length); }
    if(e.key==="ArrowDown"){ 
      let next = focusIndex + cols; 
      if(next >= cards.length) next = cards.length - 1; 
      focusCard(next); 
    }
    if(e.key==="ArrowUp"){ 
      let prev = focusIndex - cols; 
      if(prev < 0) {
        focusOnButtons=true;
        buttons[buttonIndex].focus();
      } else focusCard(prev); 
    }
    if(e.key==="Enter" && cards[focusIndex]){
      const key = cards[focusIndex].dataset.key;
      openSeries(key);
    }
  }
});

loadSeriesList();
</script>

</body>
</html>
