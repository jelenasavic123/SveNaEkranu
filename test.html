        body {
            margin: 0;

            top: 0;

            display: flex;

        }

            top: 1;

            color: #fff;

            text-align: center;
            transition: opacity 0.3s ease;

            position: absolute;

            right: 20px;

            cursor: pointer;
            color: #920000;
            transition: color 0.3s ease;

    <script src="script.js"></script>
    
    <script>
document.addEventListener('DOMContentLoaded', () => {
    const apiKey = '2701858e9bccab54d4d0e4931420a739';
    const baseURL = 'https://api.themoviedb.org/3';
    let currentPage = 1;
    let currentQuery = '';
    let selectedGenre = '';
    let selectedYear = '';
    let selectedLanguage = 'en-US'; // Default language

    const fetchMovies = (page = 1, query = '', genre = '', year = '') => {
        let url = `${baseURL}/discover/movie?api_key=${apiKey}&page=${page}&language=${selectedLanguage}`;

        if (query) {
            url += `&query=${encodeURIComponent(query)}`; // Dodajte query parametar ako postoji
        }
        if (genre) {
            url += `&with_genres=${genre}`;
        }
        if (year) {
            url += `&primary_release_year=${year}`;
        }

        console.log(`Requesting movies with URL: ${url}`);

        fetch(url)
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(`Network response was not ok: ${response.statusText}. Response text: ${text}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                console.log('Movies API response:', data);
                displayMovies(data.results); // Call displayMovies to add more movies
                currentPage = page;
                document.getElementById('current-page').textContent = page; // Update current page display
            })
            .catch(error => console.error('Error fetching movies:', error));
    };

    // Function for filtering movies
    const filterMovies = () => {
        const searchInput = document.getElementById('searchInput').value.toLowerCase(); // Dohvata sadržaj iz inputa i konvertuje u mala slova
        const movies = document.querySelectorAll('.movie-item'); // Selektuj sve filmove

        movies.forEach(movie => {
            const title = movie.querySelector('h2').textContent.toLowerCase(); // Uzimamo tekst naslova filma i konvertujemo u mala slova
            if (title.includes(searchInput)) {
                movie.style.display = 'block'; // Prikaži ako odgovara
            } else {
                movie.style.display = 'none'; // Sakrij ako ne odgovara
            }
        });
    };

    const displayMovies = (movies) => {
        const movieList = document.getElementById('movie-list');
        if (movieList) {
            movieList.innerHTML = ''; // Clear previous movies

            const newMovieContainer = document.createElement('div');
            newMovieContainer.classList.add('movie-item-container');

            movies.forEach(movie => {
                const movieItem = document.createElement('div');
                movieItem.className = 'movie-item';
                movieItem.dataset.id = movie.id; // Store movie ID for later use
                movieItem.dataset.type = 'movie'; // Mark as movie
                movieItem.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}">
                    <h2>${movie.title}</h2>
                    <p>${movie.release_date}</p>
                `;
                movieItem.addEventListener('click', () => showMovieDetails(movie.id, 'movie')); // Add click event
                newMovieContainer.appendChild(movieItem);
            });

            movieList.appendChild(newMovieContainer);
        } else {
            console.error('Element with ID "movie-list" not found.');
        }
    };

    const showMovieDetails = (id, type) => {
        const endpoint = type === 'movie' ? `/movie/${id}` : `/tv/${id}`;
        fetch(`${baseURL}${endpoint}?api_key=${apiKey}&language=${selectedLanguage}`)
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(`Network response was not ok: ${response.statusText}. Response text: ${text}`);
                    });
                }
                return response.json();
            })
            .then(details => {
                const { title, release_date, overview, poster_path } = details;
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-release-date').textContent = `Release Date: ${release_date}`;
                document.getElementById('modal-overview').textContent = overview;
                document.getElementById('modal-poster').src = `https://image.tmdb.org/t/p/w500${poster_path}`;

                const mediaIframe = document.getElementById('media-iframe');
                if (type === 'movie') {
                    mediaIframe.src = `https://vidsrc.pro/embed/movie/${id}`;
                    document.getElementById('tv-options').style.display = 'none';
                } else {
                    mediaIframe.src = '';
                    document.getElementById('tv-options').style.display = 'block';
                }

                document.getElementById('movie-modal').style.display = 'block';
            })
            .catch(error => console.error('Error fetching movie details:', error));
    };

    // Close modal
    const closeModalButton = document.getElementById('close-modal');
    if (closeModalButton) {
        closeModalButton.addEventListener('click', () => {
            document.getElementById('movie-modal').style.display = 'none';
        });
    } else {
        console.error('Element with ID "close-modal" not found.');
    }

    // Load More Button
    const loadMoreButton = document.getElementById('load-more');
    if (loadMoreButton) {
        loadMoreButton.addEventListener('click', () => {
            fetchMovies(currentPage + 1, currentQuery, selectedGenre, selectedYear); // Fetch more movies
        });
    } else {
        console.error('Element with ID "load-more" not found.');
    }

    // Pagination
    const prevPageButton = document.getElementById('prev-page');
    const nextPageButton = document.getElementById('next-page');
    if (prevPageButton && nextPageButton) {
        prevPageButton.addEventListener('click', () => {
            if (currentPage > 1) {
                fetchMovies(--currentPage, currentQuery, selectedGenre, selectedYear);
            }
        });

        nextPageButton.addEventListener('click', () => {
            fetchMovies(++currentPage, currentQuery, selectedGenre, selectedYear);
        });
    } else {
        console.error('Pagination buttons not found.');
    }

    // Search input
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('input', filterMovies); // Dodaje event za input polje pretrage
    } else {
        console.error('Element with ID "searchInput" not found.');
    }

    // Genre filter
    const genreSelect = document.getElementById('genre-select');
    if (genreSelect) {
        genreSelect.addEventListener('change', () => {
            selectedGenre = genreSelect.value;
            fetchMovies(currentPage, currentQuery, selectedGenre, selectedYear); // Fetch movies by genre
        });
    } else {
        console.error('Element with ID "genre-select" not found.');
    }

    // Year filter
    const yearSelect = document.getElementById('year-select');
    if (yearSelect) {
        yearSelect.addEventListener('change', () => {
            selectedYear = yearSelect.value;
            fetchMovies(currentPage, currentQuery, selectedGenre, selectedYear); // Fetch movies by year
        });
    } else {
        console.error('Element with ID "year-select" not found.');
    }

    // Initial load
    fetchMovies();
});


</script>
