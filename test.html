<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sve na Ekranu</title>
   <style>
   body {
    font-family: 'Arial', sans-serif;
    background-color: #1c1c1c; /* Tamna tema za TV */
    color: #fff;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    overflow-y: auto;
}

header {
    width: 100%;
    background-color: #333;
    padding: 10px 20px;
    position: fixed;
    top: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    border-bottom: 1px solid #444;
    height: 60px;
    z-index: 1000;
}

header h1 {
    font-size: 20px;
    margin: 0;
    font-weight: bold;
}

header input[type="text"] {
    width: 200px;
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #555;
    background-color: #222;
    color: #ddd;
    font-size: 16px;
}

header select {
    padding: 8px;
    border-radius: 5px;
    background-color: #222;
    color: #ddd;
    border: 1px solid #555;
    font-size: 16px;
}

#movie-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    padding: 100px 20px 20px;
    width: 100%;
}

.movie-item {
    margin: 15px;
    width: 120px;
    text-align: center;
    border-radius: 10px;
    background-color: #333;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.movie-item img {
    width: 100%;
    height: auto;
    border-radius: 5px;
    transition: transform 0.3s ease;
}

.movie-item:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
}

.movie-item h2, .movie-item p {
    margin: 10px 0;
    color: #ddd;
}

.movie-item:hover h2, .movie-item:hover p {
    color: #007bff;
}

#movie-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    color: #fff;
    z-index: 1000;
    overflow-y: auto;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
}

#movie-modal #close-modal {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 24px;
    cursor: pointer;
    color: #fff;
}

#movie-modal h2 {
    font-size: 24px;
    margin: 20px 0;
}

#movie-modal img {
    width: 200px;
    border-radius: 10px;
    margin: 20px 0;
}

#movie-modal p {
    font-size: 16px;
}

#tv-options {
    margin-top: 20px;
}

#tv-options input, #tv-options button {
    padding: 10px;
    font-size: 16px;
    margin: 5px;
    border-radius: 5px;
    border: 1px solid #444;
    background-color: #222;
    color: #ddd;
    transition: background-color 0.3s ease, border-color 0.3s ease;
}

#tv-options button {
    background-color: #007bff;
    border: none;
    color: #fff;
    cursor: pointer;
}

#tv-options button:hover {
    background-color: #0056b3;
}

#load-more {
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    margin: 20px;
}

#load-more:hover {
    background-color: #0056b3;
}
/* Modal styles */
.modal {
    display: none;
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.5);
}

.modal-content {
    position: relative;
    background-color: #fff;
    margin: 10% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 80%;
    max-width: 800px;
}

.close {
    position: absolute;
    top: 10px;
    right: 25px;
    color: #000;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
}

.close:hover,
.close:focus {
    color: red;
    text-decoration: none;
    cursor: pointer;
}

</style>

</head>
<body>
  
    <header>
        <h1>Sve na Ekranu</h1>
        <input type="text" id="searchInput" placeholder="Search movies...">
        <select id="language-select">
            <option value="en-US">English</option>
            <option value="es-ES">Spanish</option>
            <option value="fr-FR">French</option>
            <option value="ar-AR">Arabic</option>
            <!-- Add more languages as needed -->
        </select>
    </header>
    <div id="movie-list"></div>
    <button id="load-more">Load More</button>


</div>
    <div id="movie-modal">
        <span id="close-modal">×</span>
        <h2 id="modal-title"></h2>
        <p id="modal-release-date"></p>
        <img id="modal-poster" src="" alt="Movie Poster">
        <p id="modal-overview"></p>
        <iframe id="media-iframe" src="" allowfullscreen></iframe>
        <div id="tv-options" style="display: none;">
            <input type="number" id="season-number" placeholder="Season Number" min="1">
            <input type="number" id="episode-number" placeholder="Episode Number" min="1">
            <button id="update-embed">Update Embed</button>
        </div>
    </div>
<!-- Modal for video playback -->
<div id="popup-modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <iframe id="iframe-player" src="" frameborder="0" allowfullscreen></iframe>
    </div>
</div>
    <script src="script.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const apiKey = '2701858e9bccab54d4d0e4931420a739'; // API key for The Movie Database (TMDb)
    const baseURL = 'https://api.themoviedb.org/3'; // Base URL for TMDb API
    let currentPage = 1; // Current page of results
    let currentQuery = ''; // Current search query
    let selectedLanguage = 'en-US'; // Default language for movie data

    // Fetch movies from TMDb API
    const fetchMovies = (page = 1, query = '') => {
        const url = query
            ? `${baseURL}/search/movie?api_key=${apiKey}&query=${encodeURIComponent(query)}&page=${page}&language=${selectedLanguage}`
            : `${baseURL}/movie/popular?api_key=${apiKey}&page=${page}&language=${selectedLanguage}`;

        console.log(`Requesting movies API with URL: ${url}`);

        fetch(url)
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(`Network response was not ok: ${response.statusText}. Response text: ${text}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                console.log('Movies API response:', data);
                displayMovies(data.results);
                currentPage = page; // Update the current page
            })
            .catch(error => console.error('Error fetching movies:', error));
    };
  
    // Open video in a modal
    async function openVideo(movieId) {
        const videoUrl = `https://moviesapi.club/movie/${movieId}`; // Replace this with your video source URL
        const modal = document.getElementById('popup-modal');
        const iframe = document.getElementById('iframe-player');

        iframe.src = videoUrl;
        modal.style.display = 'block';

        // Close modal
        document.querySelector('.close').addEventListener('click', () => {
            modal.style.display = 'none';
            iframe.src = ''; // Reset iframe src when modal is closed
        });
    }

    // Display movies on the page
    const displayMovies = (movies) => {
        const movieList = document.getElementById('movie-list');
        if (movieList) {
            movieList.innerHTML = ''; // Clear previous results
            movies.forEach(movie => {
                const movieItem = document.createElement('div');
                movieItem.className = 'movie-item';
                movieItem.dataset.id = movie.id; // Store movie ID for later use
                movieItem.dataset.type = 'movie'; // Mark as movie
                movieItem.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}">
                    <h2>${movie.title}</h2>
                    <p>${movie.release_date}</p>
                `;
                movieItem.addEventListener('click', () => openVideo(movie.id)); // Add click event for opening video
                movieList.appendChild(movieItem);
            });
        } else {
            console.error('Element with ID "movie-list" not found.');
        }
    };

    // Show movie details in a modal
    const showMovieDetails = (id, type) => {
        const endpoint = type === 'movie' ? `/movie/${id}` : `/tv/${id}`;
        fetch(`${baseURL}${endpoint}?api_key=${apiKey}&language=${selectedLanguage}`)
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(`Network response was not ok: ${response.statusText}. Response text: ${text}`);
                    });
                }
                return response.json();
            })
            .then(details => {
                const { title, release_date, overview, poster_path } = details;
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-release-date').textContent = `Release Date: ${release_date}`;
                document.getElementById('modal-overview').textContent = overview;
                document.getElementById('modal-poster').src = `https://image.tmdb.org/t/p/w500${poster_path}`;

                const mediaIframe = document.getElementById('media-iframe');
                if (type === 'movie') {
                    mediaIframe.src = `https://vidsrc.pro/embed/movie/${id}`; // Replace this with your video embed URL
                    document.getElementById('tv-options').style.display = 'none'; // Hide TV options
                } else {
                    mediaIframe.src = '';
                    document.getElementById('tv-options').style.display = 'block'; // Show TV options
                }

                document.getElementById('movie-modal').style.display = 'block'; // Show the modal
            })
            .catch(error => console.error('Error fetching movie details:', error));
    };

    // Load more button event
    const loadMoreButton = document.getElementById('load-more');
    if (loadMoreButton) {
        loadMoreButton.addEventListener('click', () => {
            fetchMovies(currentPage + 1, currentQuery); // Load more movies
        });
    } else {
        console.error('Element with ID "load-more" not found.');
    }

    // Search input event
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('input', () => {
            const query = searchInput.value;
            currentQuery = query; // Store the search query
            currentPage = 1; // Reset the page number for new search
            fetchMovies(1, query); // Fetch movies with search query
        });
    } else {
        console.error('Element with ID "searchInput" not found.');
    }

    // Handle language change
    const languageSelect = document.getElementById('language-select');
    if (languageSelect) {
        languageSelect.addEventListener('change', () => {
            selectedLanguage = languageSelect.value;
            fetchMovies(currentPage, currentQuery); // Fetch movies with selected language
        });
    } else {
        console.error('Element with ID "language-select" not found.');
    }

    // Initial load
    fetchMovies(); // Load popular movies by default
});

</script>

</body>
</html>
