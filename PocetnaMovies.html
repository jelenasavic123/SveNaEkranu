<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Scrolling with Remote Navigation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .section {
            display: flex;
            overflow-x: auto;
            width: 80%;
            margin-bottom: 30px;
        }
        .section h2 {
            width: 100%;
            text-align: center;
            margin: 10px 0;
        }
        .image-container {
            display: flex;
            gap: 10px;
            flex-wrap: nowrap;
        }
        .image-container img {
            width: calc(16.66% - 10px); /* 6 images per row */
            height: auto;
            border: none;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
        }
        .image-container img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Netflix Section -->
        <div class="section" id="netflixSection">
            <h2>Netflix</h2>
            <div class="image-container" id="netflixImages"></div>
        </div>

        <!-- Hulu Section -->
        <div class="section" id="huluSection">
            <h2>Hulu</h2>
            <div class="image-container" id="huluImages"></div>
        </div>

        <!-- Popular Section -->
        <div class="section" id="popularSection">
            <h2>Popular</h2>
            <div class="image-container" id="popularImages"></div>
        </div>
    </div>

    <script>
        async function fetchMovies(apiKey, sectionId, category) {
            const tmdbBaseUrl = "https://api.themoviedb.org/3";
            const response = await fetch(`${tmdbBaseUrl}/movie/${category}?api_key=${apiKey}&language=en-US&page=1`);
            const data = await response.json();

            if (data.results && data.results.length > 0) {
                displayImages(data.results, sectionId);
            }
        }

        function displayImages(movies, sectionId) {
            const container = document.getElementById(sectionId);
            container.innerHTML = ""; // Clear existing images
            movies.forEach(movie => {
                const imgElement = document.createElement('img');
                imgElement.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                imgElement.alt = movie.title;
                imgElement.tabIndex = 0;  // Allow keyboard navigation
                imgElement.addEventListener('click', () => {
                    alert(`Clicked on: ${movie.title}`);
                });
                container.appendChild(imgElement);
            });

            handleKeyboardNavigation(sectionId); // Enable keyboard navigation
        }

        function handleKeyboardNavigation(sectionId) {
            const container = document.getElementById(sectionId);
            const images = container.querySelectorAll('img');
            let currentIndex = 0;

            if (images.length > 0) {
                images[currentIndex].focus();  // Focus the first image
            }

            container.addEventListener('keydown', (event) => {
                if (event.key === 'ArrowRight') {
                    currentIndex = (currentIndex + 1) % images.length;
                } else if (event.key === 'ArrowLeft') {
                    currentIndex = (currentIndex - 1 + images.length) % images.length;
                }
                
                images[currentIndex].focus(); // Focus the current image
            });
        }

        // Fetch data for each section
        fetchMovies('2701858e9bccab54d4d0e4931420a739', 'netflixImages', 'popular');
        fetchMovies('2701858e9bccab54d4d0e4931420a739', 'huluImages', 'top_rated'); // Or any other category
        fetchMovies('2701858e9bccab54d4d0e4931420a739', 'popularImages', 'popular');
    </script>

</body>
</html>
