/* Kontejner za iframe */
.iframe-container {
  display: flex; /* Koristi flexbox za poravnanje */

}

/* Sam iframe */
#iframe-container iframe,
#media-iframe {
  width: 95%; /* Prilagodljiva širina */

}

    <script>
   document.addEventListener('DOMContentLoaded', () => {
    const apiKey = '2701858e9bccab54d4d0e4931420a739';
    const baseURL = 'https://api.themoviedb.org/3';
    let currentPage = 1;
    let currentQuery = '';
    let selectedGenre = '';
    let selectedYear = '';
    let selectedLanguage = 'en-US'; // Default language
    let selectedSortBy = ''; // Selected sorting option from popular-select
    
    

    const fetchMovies = (page = 1, query = '', genre = '', year = '', sortBy = '') => {
    let url = `${baseURL}/discover/movie?api_key=${apiKey}&page=${page}&language=en-US`;

    if (query) {
        url = `${baseURL}/search/movie?api_key=${apiKey}&query=${encodeURIComponent(query)}&page=${page}&language=en-US`;
    }
    if (genre) url += `&with_genres=${genre}`;
    if (year) url += `&primary_release_year=${year}`;
    if (sortBy) url += `&sort_by=${sortBy}`;

    fetch(url)
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => { throw new Error(`API Error: ${err.status_message}`); });
            }
            return response.json();
        })
        .then(data => {
            const movieList = document.getElementById('movie-list');
            movieList.innerHTML = '';

            data.results.forEach(movie => {
                const movieItem = document.createElement('div');
                movieItem.className = 'movie-item';
                movieItem.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}" onclick="showMovieDetails(${movie.id}, 'movie')">
                    <h2>${movie.title}</h2>
                    <p>${movie.release_date}</p>
                `;
                movieList.appendChild(movieItem);

                // Automatski prikaži detalje klikom na sliku
                movieItem.querySelector('img').addEventListener('click', () => {
                    fetch(`${baseURL}/movie/${movie.id}?api_key=${apiKey}&language=en-US`)
                        .then(response => {
                            if (!response.ok) {
                                return response.json().then(err => { throw new Error(`API Error: ${err.status_message}`); });
                            }
                            return response.json();
                        })
                        .then(details => {
                            const { title, release_date, overview, poster_path } = details;
                            document.getElementById('modal-title').textContent = title;
                            document.getElementById('modal-release-date').textContent = `Release Date: ${release_date}`;
                            document.getElementById('modal-overview').textContent = overview;
                            document.getElementById('modal-poster').src = `https://image.tmdb.org/t/p/w500${poster_path}`;
                            document.getElementById('media-iframe').src = `https://vidsrc.vip/embed/movie/${movie.id}`;
                            document.getElementById('movie-modal').style.display = 'flex';
                        })
                        .catch(error => console.error('Error fetching movie details:', error));
                });
            });

            currentPage = page;
        })
        .catch(error => console.error('Error fetching movies:', error));
};

 // Close modal
    const closeModalButton = document.getElementById('close-modal');
    if (closeModalButton) {
        closeModalButton.addEventListener('click', () => {
            document.getElementById('movie-modal').style.display = 'none';
        });
    } else {
        console.error('Element with ID "close-modal" not found.');
    }


    // Display movies on the page
    const displayMovies = (movies) => {
        const movieList = document.getElementById('movie-list');
        movieList.innerHTML = ''; // Clear previous movies

        movies.forEach(movie => {
            const movieItem = document.createElement('div');
            movieItem.className = 'movie-item';
            movieItem.innerHTML = `
                <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}">
                <h2>${movie.title}</h2>
                <p>${movie.release_date}</p>
            `;
            movieList.appendChild(movieItem);
        });
    };

    // Event listeners for filters
    document.getElementById('search-input').addEventListener('input', (e) => {
        currentQuery = e.target.value;
        fetchMovies(1, currentQuery, selectedGenre, selectedYear, selectedSortBy);
    });

    document.getElementById('genre-select').addEventListener('change', (e) => {
        selectedGenre = e.target.value;
        fetchMovies(1, currentQuery, selectedGenre, selectedYear, selectedSortBy);
    });

    document.getElementById('year-select').addEventListener('change', (e) => {
        selectedYear = e.target.value;
        fetchMovies(1, currentQuery, selectedGenre, selectedYear, selectedSortBy);
    });

    document.getElementById('popular-select').addEventListener('change', (e) => {
        selectedSortBy = e.target.value;
        fetchMovies(1, currentQuery, selectedGenre, selectedYear, selectedSortBy);
    });

const popularSelect = document.getElementById('popular-select');
if (popularSelect) {
    popularSelect.addEventListener('change', () => {
        const selectedOption = popularSelect.value;

       if (selectedOption === 'hulu') {
    fetchHuluMovies();
} else if (selectedOption === 'marvel') {
    fetchMarvelMovies();
} else if (selectedOption === 'netflix') {
    fetchNetflixMovies();
} else if (selectedOption === 'disney') {
    fetchDisneyMovies();
} else if (selectedOption === 'apple') {
    fetchAppleMovies();
} else if (selectedOption === 'hbo') {
    fetchHBOMovies();
} else if (selectedOption === 'prime') { // Dodato za Prime Video
    fetchPrimeMovies();
} else {
    selectedSortBy = selectedOption;
    fetchMovies(currentPage, currentQuery, selectedGenre, selectedYear, selectedSortBy);
}
    });
} else {
    console.error('Element with ID "popular-select" not found.');
}

// Funkcija za Hulu filmove
const fetchHuluMovies = () => {
    const url = `${baseURL}/discover/movie?api_key=${apiKey}&with_watch_providers=15&watch_region=US&language=${selectedLanguage}`;
    fetchAndDisplayMovies(url);
};

// Funkcija za Marvel filmove
const fetchMarvelMovies = () => {
    const url = `${baseURL}/discover/movie?api_key=${apiKey}&with_companies=420&language=${selectedLanguage}`;
    fetchAndDisplayMovies(url);
};

// Funkcija za Netflix filmove
const fetchNetflixMovies = () => {
    const url = `${baseURL}/discover/movie?api_key=${apiKey}&with_watch_providers=8&watch_region=US&language=${selectedLanguage}`;
    fetchAndDisplayMovies(url);
};

// Funkcija za Disney+ filmove
const fetchDisneyMovies = () => {
    const url = `${baseURL}/discover/movie?api_key=${apiKey}&with_watch_providers=337&watch_region=US&language=${selectedLanguage}`;
    fetchAndDisplayMovies(url);
};

// Funkcija za Apple TV+ filmove
const fetchAppleMovies = () => {
    const url = `${baseURL}/discover/movie?api_key=${apiKey}&with_watch_providers=350&watch_region=US&language=${selectedLanguage}`;
    fetchAndDisplayMovies(url);
};

// Funkcija za HBO filmove
const fetchHBOMovies = () => {
    const url = `${baseURL}/discover/movie?api_key=${apiKey}&with_watch_providers=8&watch_region=US&language=${selectedLanguage}`;
    fetchAndDisplayMovies(url);
};

// Funkcija za Prime Video filmove
const fetchPrimeMovies = () => {
    const url = `${baseURL}/discover/movie?api_key=${apiKey}&with_watch_providers=9&watch_region=US&language=${selectedLanguage}`;
    fetchAndDisplayMovies(url);
};

// Pomoćna funkcija za prikaz filmova
const fetchAndDisplayMovies = (url) => {
    fetch(url)
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => { throw new Error(`API Error: ${err.status_message}`); });
            }
            return response.json();
        })
        .then(data => displayMovies(data.results))
        .catch(error => console.error('Error fetching filtered movies:', error));
};


    // Initial load
    fetchMovies();
});
</script>

<script>
    const API_KEY = '2701858e9bccab54d4d0e4931420a739';
    const baseURL = 'https://api.themoviedb.org/3';
    let page = 1;
    const selectedLanguage = 'en-US';

    const fetchAndDisplayMovies = (url, containerId) => {
      fetch(url)
        .then(response => response.json())
        .then(data => {
          const container = document.getElementById(containerId);
          data.results.forEach(movie => {
            const contentItem = document.createElement("div");
            contentItem.classList.add("content-item");

            const movieImage = document.createElement("img");
            movieImage.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
            movieImage.alt = movie.title;

            const rating = document.createElement("div");
            rating.classList.add("rating");
            rating.textContent = movie.vote_average.toFixed(1);

            const year = document.createElement("div");
            year.classList.add("year");
            year.textContent = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';

            contentItem.appendChild(movieImage);
            contentItem.appendChild(rating);
            contentItem.appendChild(year);

            // Open modal on click
            contentItem.addEventListener('click', () => openModal(movie));

            container.appendChild(contentItem);
          });
          page++;
        })
        .catch(error => console.error('Error fetching movies:', error));
    };

    const openModal = (movie) => {
      document.getElementById('modal-title').textContent = movie.title;
      document.getElementById('modal-release-date').textContent = `Release Date: ${movie.release_date}`;
      document.getElementById('modal-overview').textContent = movie.overview;
      document.getElementById('modal-poster').src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
      document.getElementById('media-iframe').src = `https://vidsrc.vip/embed/movie/${movie.id}`;
      document.getElementById('movie-modal').style.display = 'flex';
    };

    const closeModal = () => {
      document.getElementById('movie-modal').style.display = 'none';
    };

    // Load movie lists for all platforms
    const fetchMovies = () => {
      const urls = {
        netflix: `${baseURL}/discover/movie?api_key=${API_KEY}&with_watch_providers=8&watch_region=US&language=${selectedLanguage}&page=${page}`,
        marvel: `${baseURL}/discover/movie?api_key=${API_KEY}&with_companies=420&language=${selectedLanguage}&page=${page}`,
        hulu: `${baseURL}/discover/movie?api_key=${API_KEY}&with_watch_providers=15&watch_region=US&language=${selectedLanguage}&page=${page}`,
        disneyplus: `${baseURL}/discover/movie?api_key=${API_KEY}&with_watch_providers=337&watch_region=US&language=${selectedLanguage}&page=${page}`,
        appleTv: `${baseURL}/discover/movie?api_key=${API_KEY}&with_watch_providers=350&watch_region=US&language=${selectedLanguage}&page=${page}`
      };

      fetchAndDisplayMovies(urls.netflix, 'netflix-content-container');
      fetchAndDisplayMovies(urls.marvel, 'marvel-content-container');
      fetchAndDisplayMovies(urls.hulu, 'hulu-content-container');
      fetchAndDisplayMovies(urls.disneyplus, 'disneyplus-content-container');
      fetchAndDisplayMovies(urls.appleTv, 'apple-tv-content-container');
    };

    fetchMovies();

    document.getElementById("load-more-netflix").addEventListener("click", () => fetchMovies());
    document.getElementById("load-more-marvel").addEventListener("click", () => fetchMovies());
    document.getElementById("load-more-hulu").addEventListener("click", () => fetchMovies());
    document.getElementById("load-more-disneyplus").addEventListener("click", () => fetchMovies());
    document.getElementById("load-more-apple-tv").addEventListener("click", () => fetchMovies());
  </script>
