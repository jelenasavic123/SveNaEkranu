<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart TV Daljinski</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .item {
            display: inline-block;
            width: 150px;
            height: 50px;
            background-color: #3498db;
            color: white;
            line-height: 50px;
            margin: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .item:focus {
            background-color: #2ecc71;
        }

        #selected {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Smart TV Daljinski</h1>
    
    <iframe src="https://vidsrc.xyz/embed/movie/tt5433140" title="W3Schools Free Online Web Tutorials">
</iframe>


    <div id="selected">Nema selektovanog elementa.</div>

    <script>
        let items = document.querySelectorAll('.item');
        let currentIndex = 0;

        // Fokusiranje na prvi element po učitavanju stranice
        items[currentIndex].focus();

        // Funkcija za selektovanje elementa
        function updateSelected() {
            document.getElementById('selected').textContent = 'Selektovan: ' + items[currentIndex].textContent;
        }

        // Slušač za keydown događaje
        document.addEventListener('keydown', function(event) {
            switch(event.keyCode) {
                case 37: // Levo strelica
                    if (currentIndex > 0) {
                        currentIndex--;
                        items[currentIndex].focus();
                    }
                    break;
                case 39: // Desno strelica
                    if (currentIndex < items.length - 1) {
                        currentIndex++;
                        items[currentIndex].focus();
                    }
                    break;
                case 38: // Gore strelica (ako želimo dodatnu navigaciju)
                    if (currentIndex > 0) {
                        currentIndex--; // Možeš prilagoditi logiku za gore/dole kretanje
                        items[currentIndex].focus();
                    }
                    break;
                case 40: // Dole strelica (ako želimo dodatnu navigaciju)
                    if (currentIndex < items.length - 1) {
                        currentIndex++;
                        items[currentIndex].focus();
                    }
                    break;
                case 13: // Enter (OK)
                    updateSelected();
                    break;
                case 27: // Escape (Za izlaz, opcionalno)
                    document.getElementById('selected').textContent = 'Akcija prekinuta.';
                    break;
                default:
                    console.log('Nepodržani taster: ' + event.keyCode);
                    break;
            }
        });
    </script>
</body>
</html>
