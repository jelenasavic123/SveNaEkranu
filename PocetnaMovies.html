<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popularni Filmovi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 40px;
            width: 100%;
        }

        .section-title {
            font-size: 24px;
            margin: 20px 0;
            text-align: left;
            width: 100%;
        }

        .movie-list {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding: 10px 0;
            scroll-snap-type: x mandatory;
            width: 100%;
        }

        .movie-item {
            position: relative;
            width: 200px;
            height: 300px;
            background-color: #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
            transition: transform 0.3s ease;
            scroll-snap-align: start;
        }

        .movie-item img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
        }

        .movie-item h3 {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 5px;
        }

        .movie-item.selected {
            outline: 3px solid red; /* Crveni okvir */
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Popularni Filmovi</h1>

    <div class="section">
        <div class="section-title">Netflix</div>
        <div class="movie-list" id="netflix-list"></div>
    </div>
    <div class="section">
        <div class="section-title">Disney+</div>
        <div class="movie-list" id="disney-list"></div>
    </div>

    <script>
        const apiKey = '2701858e9bccab54d4d0e4931420a739';

        // Funkcija za preuzimanje filmova
        function fetchMovies(listId) {
            const apiBase = `https://api.themoviedb.org/3/movie/popular?api_key=${apiKey}&language=sr-SR&page=1`;

            fetch(apiBase)
                .then(response => response.json())
                .then(data => {
                    const movies = data.results;
                    const movieList = document.getElementById(listId);

                    movies.forEach(movie => {
                        const movieItem = document.createElement('div');
                        movieItem.classList.add('movie-item');
                        movieItem.setAttribute('data-id', movie.id);

                        const movieImage = document.createElement('img');
                        movieImage.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                        movieImage.alt = movie.title;

                        const movieTitle = document.createElement('h3');
                        movieTitle.textContent = movie.title;

                        movieItem.appendChild(movieImage);
                        movieItem.appendChild(movieTitle);
                        movieList.appendChild(movieItem);
                    });
                })
                .catch(error => console.error('Greška prilikom preuzimanja filmova:', error));
        }

        // Poziv funkcije za Netflix i Disney+ sekcije
        fetchMovies('netflix-list');
        fetchMovies('disney-list');

        // Funkcija za navigaciju
        function navigateMovies(direction) {
            const sections = document.querySelectorAll('.movie-list');
            let activeSectionIndex = Array.from(sections).findIndex(section =>
                Array.from(section.children).some(item => item.classList.contains('selected'))
            );

            if (activeSectionIndex === -1) activeSectionIndex = 0;

            const activeSection = sections[activeSectionIndex];
            const movieItems = activeSection.querySelectorAll('.movie-item');

            let currentIndex = Array.from(movieItems).findIndex(item => item.classList.contains('selected'));

            if (currentIndex === -1) {
                currentIndex = 0;
                movieItems[currentIndex].classList.add('selected');
                return;
            }

            let newIndex = -1;

            switch (direction) {
                case 'left':
                    if (currentIndex > 0) newIndex = currentIndex - 1;
                    break;
                case 'right':
                    if (currentIndex < movieItems.length - 1) newIndex = currentIndex + 1;
                    break;
                case 'up':
                    if (activeSectionIndex > 0) {
                        const prevSection = sections[activeSectionIndex - 1];
                        const prevItems = prevSection.querySelectorAll('.movie-item');
                        if (prevItems.length > 0) {
                            movieItems[currentIndex].classList.remove('selected');
                            prevItems[0].classList.add('selected');
                            prevSection.scrollIntoView({ behavior: 'smooth' });
                        }
                    }
                    return;
                case 'down':
                    if (activeSectionIndex < sections.length - 1) {
                        const nextSection = sections[activeSectionIndex + 1];
                        const nextItems = nextSection.querySelectorAll('.movie-item');
                        if (nextItems.length > 0) {
                            movieItems[currentIndex].classList.remove('selected');
                            nextItems[0].classList.add('selected');
                            nextSection.scrollIntoView({ behavior: 'smooth' });
                        }
                    }
                    return;
                case 'enter':
                    if (currentIndex !== -1) {
                        window.location.href = `https://vidsrc.vip/embed/movie/${movieItems[currentIndex].getAttribute('data-id')}`;
                    }
                    return;
            }

            if (newIndex !== -1) {
                movieItems[currentIndex].classList.remove('selected');
                movieItems[newIndex].classList.add('selected');
                movieItems[newIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        document.addEventListener('keydown', event => {
            switch (event.key) {
                case 'ArrowLeft':
                    navigateMovies('left');
                    break;
                case 'ArrowRight':
                    navigateMovies('right');
                    break;
                case 'ArrowUp':
                    navigateMovies('up');
                    break;
                case 'ArrowDown':
                    navigateMovies('down');
                    break;
                case 'Enter':
                    navigateMovies('enter');
                    break;
            }
        });
    </script>
</body>
</html>
