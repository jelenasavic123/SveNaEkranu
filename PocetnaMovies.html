<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Scrolling with Remote Navigation</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #181818; /* Tamna pozadina */
            color: #fff; /* Bela boja za tekst */
            overflow: hidden; /* Disable page scroll */
        }
   
        }
        .image-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 0;
            flex-wrap: nowrap; /* Prevent scrolling in this container */
        }
        .image-container img {
            width: calc(16.66% - 10px);
            height: auto;
            border: 2px solid #fff; /* Bele ivice */
            border-radius: 8px; /* Blago zaobljeni rubovi */
            cursor: pointer;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
        .image-container img:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }



        .image-button {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .image-button img {
            width: 100px; /* Podesite širinu slike */
            height: auto; /* Zadržite proporcije */
            border-radius: 10px; /* Zaobljeni uglovi, ako želite */
            transition: transform 0.2s ease; /* Animacija na hover */
        }

        .image-button:hover img {
            
            
          transform: scale(1.1); /* Uvećava sliku pri hoveru */
        }
    </style>
</head>
<body>

    <div class="button-container">
        <!-- Button 1 -->
        <button class="button" id="button1" tabindex="0">
            <img src="putanja-do-slike1.jpg" alt="Button 1">
            <span>Button 1</span>
        </button>
        <!-- Button 2 -->
        <button class="button" id="button2" tabindex="0">
            <img src="putanja-do-slike2.jpg" alt="Button 2">
            <span>Button 2</span>
        </button>
        <!-- Button 3 -->
        <button class="button" id="button3" tabindex="0">
            <img src="putanja-do-slike3.jpg" alt="Button 3">
            <span>Button 3</span>
        </button>
        <!-- Button 4 -->
        <button class="button" id="button4" tabindex="0">
            <img src="putanja-do-slike4.jpg" alt="Button 4">
            <span>Button 4</span>
        </button>
        <!-- Button 5 -->
        <button class="button" id="button5" tabindex="0">
            <img src="putanja-do-slike5.jpg" alt="Button 5">
            <span>Button 5</span>
        </button>
        <!-- Button 6 -->
        <button class="button" id="button6" tabindex="0">
            <img src="putanja-do-slike6.jpg" alt="Button 6">
            <span>Button 6</span>
        </button>
    <div class="container">
        <!-- Netflix Section -->
        <div class="section" id="netflixSection">
            <h2>Netflix</h2>
            <div class="image-container" id="netflixImages">
                <button class="image-button">
                    <img src="putanja-do-slike.jpg" alt="Netflix Button Image">
                </button>
            </div>
        </div>

        <!-- Hulu Section -->
        <div class="section" id="huluSection">
            <h2>Hulu</h2>
            <div class="image-container" id="huluImages"></div>
        </div>

        <!-- Popular Section -->
        <div class="section" id="popularSection">
            <h2>Popular</h2>
            <div class="image-container" id="popularImages"></div>
        </div>
    </div>

    <script>
        async function fetchMovies(apiKey, sectionId, category) {
            const tmdbBaseUrl = "https://api.themoviedb.org/3";
            const response = await fetch(`${tmdbBaseUrl}/movie/${category}?api_key=${apiKey}&language=en-US&page=1`);
            const data = await response.json();

            if (data.results && data.results.length > 0) {
                displayImages(data.results, sectionId);
            }
        }

        function displayImages(movies, sectionId) {
            const container = document.getElementById(sectionId);
            container.innerHTML = ""; // Clear existing images
            movies.forEach(movie => {
                const imgElement = document.createElement('img');
                imgElement.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                imgElement.alt = movie.title;
                imgElement.tabIndex = 0;  // Allow keyboard navigation
                imgElement.addEventListener('click', () => {
                    window.location.href = `https://vidsrc.vip/embed/movie/${movie.id}`;
                });
                container.appendChild(imgElement);
            });

            handleKeyboardNavigation(); // Enable keyboard navigation
        }

        function handleKeyboardNavigation() {
            const sections = document.querySelectorAll('.section');
            let currentSectionIndex = 0;
            let currentImageIndex = 0;

            sections[currentSectionIndex].querySelector('img').focus(); // Focus prvi image u prvoj sekciji

            document.addEventListener('keydown', (event) => {
                const currentSection = sections[currentSectionIndex];
                const imageContainer = currentSection.querySelector('.image-container');

                if (event.key === 'ArrowRight') {
                    // Navigate right within the current section
                    currentImageIndex = (currentImageIndex + 1) % imageContainer.children.length;
                    imageContainer.children[currentImageIndex].focus();
                } else if (event.key === 'ArrowLeft') {
                    // Navigate left within the current section
                    currentImageIndex = (currentImageIndex - 1 + imageContainer.children.length) % imageContainer.children.length;
                    imageContainer.children[currentImageIndex].focus();
                } else if (event.key === 'ArrowDown') {
                    // Navigate down to the next section
                    currentSectionIndex = (currentSectionIndex + 1) % sections.length;
                    currentImageIndex = 0; // Reset image index
                    sections[currentSectionIndex].querySelector('img').focus();
                } else if (event.key === 'ArrowUp') {
                    // Navigate up to the previous section
                    currentSectionIndex = (currentSectionIndex - 1 + sections.length) % sections.length;
                    currentImageIndex = 0; // Reset image index
                    sections[currentSectionIndex].querySelector('img').focus();
                }
            });
        }

        // Fetch data for each section
        fetchMovies('2701858e9bccab54d4d0e4931420a739', 'netflixImages', 'popular');
        fetchMovies('2701858e9bccab54d4d0e4931420a739', 'huluImages', 'top_rated'); // Or any other category
        fetchMovies('2701858e9bccab54d4d0e4931420a739', 'popularImages', 'popular');

        // Button Navigation
        const buttons = document.querySelectorAll('.button');
        let currentButtonIndex = 0;
        
        // Focus the first button on page load
        buttons[currentButtonIndex].focus();

        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowRight') {
                currentButtonIndex = (currentButtonIndex + 1) % buttons.length;
                buttons[currentButtonIndex].focus();
            } else if (event.key === 'ArrowLeft') {
                currentButtonIndex = (currentButtonIndex - 1 + buttons.length) % buttons.length;
                buttons[currentButtonIndex].focus();
            }
        });
    </script>
    <script>
        const buttons = document.querySelectorAll('.button');
        let currentButtonIndex = 0;

        // Focus the first button on page load
        buttons[currentButtonIndex].focus();

        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowRight') {
                // Move right, if at the last button, loop back to the first
                currentButtonIndex = (currentButtonIndex + 1) % buttons.length;
                buttons[currentButtonIndex].focus();
            } else if (event.key === 'ArrowLeft') {
                // Move left, if at the first button, loop back to the last
                currentButtonIndex = (currentButtonIndex - 1 + buttons.length) % buttons.length;
                buttons[currentButtonIndex].focus();
            } else if (event.key === 'Enter') {
                // Trigger the button click event
                buttons[currentButtonIndex].click();
            }
        });
    </script>
</body>
</html>
