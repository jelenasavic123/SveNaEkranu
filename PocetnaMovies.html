<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Navigation</title>
  <style>
    /* CSS Stilovi */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }

    .cursor {
      position: absolute;
      width: 40px;
      height: 40px;
      background-color: red;
      border-radius: 50%;
      pointer-events: none;
      transition: left 0.1s ease, top 0.1s ease; /* Animacija za pomeranje kursora */
    }

    .content {
      display: flex;
      justify-content: space-between;
      width: 300px;
      position: relative;
    }

    .item {
      padding: 20px;
      background-color: #ccc;
      border: none;
      cursor: pointer;
      font-size: 16px;
      outline: none;
    }

    .item:focus {
      background-color: #00f;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Kursor -->
  <div class="cursor" id="cursor"></div>


<iframe src="https://vidsrc.xyz/embed/movie/tt5433140" title="W3Schools Free Online Web Tutorials">
</iframe>

  <!-- JavaScript za funkcionalnost -->
  <script>
    document.addEventListener('keydown', function(event) {
      const cursor = document.getElementById('cursor');
      const items = document.querySelectorAll('.item');
      let currentIndex = -1;
      
      // Find currently focused item
      items.forEach((item, index) => {
        if (item === document.activeElement) {
          currentIndex = index;
        }
      });

      switch(event.keyCode) {
        case 37: // Arrow Left
          if (currentIndex > 0) {
            items[currentIndex - 1].focus();
          }
          break;
        case 39: // Arrow Right
          if (currentIndex < items.length - 1) {
            items[currentIndex + 1].focus();
          }
          break;
        case 13: // OK (Enter)
          alert('Selected: ' + items[currentIndex].textContent);
          break;
      }

      // Update cursor position to match focused item
      if (currentIndex !== -1) {
        const selectedItem = items[currentIndex];
        cursor.style.left = `${selectedItem.offsetLeft + selectedItem.offsetWidth / 2 - cursor.offsetWidth / 2}px`;
        cursor.style.top = `${selectedItem.offsetTop + selectedItem.offsetHeight / 2 - cursor.offsetHeight / 2}px`;
      }
    });
  </script>

</body>
</html>
