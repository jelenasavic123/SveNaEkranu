<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer & TV Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Spectral+SC:wght@400&display=swap" rel="stylesheet">
    <style>
        /* Global styles */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            text-transform: uppercase;
            padding: 10px 20px;
        }

        .navbar a:hover {
            background-color: #34495e;
            border-radius: 5px;
        }

        /* Sections for Movies */
        main {
            padding: 20px;
        }

        h2 {
            font-size: 1.5em;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        /* Movie grid layout */
        .movie-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .movie-item {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .movie-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .movie-item h3 {
            font-size: 1.2em;
            margin: 10px;
        }

        /* TV Controls */
        .tv-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .tv-controls button {
            background-color: #3498db;
            color: white;
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .tv-controls button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="#home">Home</a>
            <a href="#top-movies">Top Movies</a>
            <a href="#recommended">Recommended</a>
            <a href="#now-playing">Now Playing</a>
            <a href="#popular">Popular</a>
            <a href="#upcoming">Upcoming</a>
        </nav>
    </header>

    <main>
        <!-- Top Movies Section -->
        <section id="top-movies">
            <h2>Top Movies</h2>
            <div class="movie-list" id="top-movies-list"></div>
        </section>

        <!-- Recommended Movies Section -->
        <section id="recommended">
            <h2>Recommended Movies</h2>
            <div class="movie-list" id="recommended-movies-list"></div>
        </section>

        <!-- Now Playing Section -->
        <section id="now-playing">
            <h2>Now Playing</h2>
            <div class="movie-list" id="now-playing-movies-list"></div>
        </section>

        <!-- Popular Movies Section -->
        <section id="popular">
            <h2>Popular Movies</h2>
            <div class="movie-list" id="popular-movies-list"></div>
        </section>

        <!-- Upcoming Movies Section -->
        <section id="upcoming">
            <h2>Upcoming Movies</h2>
            <div class="movie-list" id="upcoming-movies-list"></div>
        </section>

        <!-- TV Control Section -->
        <section id="tv-control">
            <h2>TV Control</h2>
            <div class="tv-controls">
                <button onclick="sendCommandToTV('volumeUp')">Volume Up</button>
                <button onclick="sendCommandToTV('volumeDown')">Volume Down</button>
                <button onclick="sendCommandToTV('playPause')">Play/Pause</button>
                <button onclick="sendCommandToTV('next')">Next</button>
                <button onclick="sendCommandToTV('previous')">Previous</button>
                <button onclick="sendCommandToTV('mute')">Mute</button>
            </div>
        </section>
    </main>

    <script>
        const apiKey = '2701858e9bccab54d4d0e4931420a739';
        const baseUrl = 'https://api.themoviedb.org/3';

        // Function to fetch movies
        async function fetchMovies(endpoint) {
            const response = await fetch(`${baseUrl}${endpoint}?api_key=${apiKey}&language=en-US&page=1`);
            const data = await response.json();
            return data.results;
        }

        // Function to display movies
        function displayMovies(movies, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            movies.forEach(movie => {
                const movieElement = document.createElement('div');
                movieElement.classList.add('movie-item');

                const movieImage = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                const movieTitle = movie.title || movie.name;

                movieElement.innerHTML = `
                    <img src="${movieImage}" alt="${movieTitle}">
                    <div class="movie-info">
                        <h3>${movieTitle}</h3>
                    </div>
                `;
                container.appendChild(movieElement);
            });
        }

        // Function for sending TV control commands
        function sendCommandToTV(command) {
            console.log(`Sending command: ${command}`);
            // Here you'd implement real TV control logic (via API, IR, etc.)
        }

        // Fetch and display movies when the page loads
        window.onload = async () => {
            const topMovies = await fetchMovies('/movie/top_rated');
            const recommendedMovies = await fetchMovies('/movie/recommendations');
            const nowPlayingMovies = await fetchMovies('/movie/now_playing');
            const popularMovies = await fetchMovies('/movie/popular');
            const upcomingMovies = await fetchMovies('/movie/upcoming');

            displayMovies(topMovies, 'top-movies-list');
            displayMovies(recommendedMovies, 'recommended-movies-list');
            displayMovies(nowPlayingMovies, 'now-playing-movies-list');
            displayMovies(popularMovies, 'popular-movies-list');
            displayMovies(upcomingMovies, 'upcoming-movies-list');
        };
    </script>
</body>
</html>
