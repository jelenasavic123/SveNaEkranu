<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Control</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .cursor {
            width: 20px;
            height: 20px;
            position: absolute;
            background-color: red;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="cursor" id="cursor"></div>

    <script>
        let cursor = document.getElementById('cursor');
        let cursorPosition = { x: 0, y: 0 };

        // Postavljanje inicijalnog kursora na sredinu ekrana
        function updateCursorPosition() {
            cursor.style.left = cursorPosition.x + 'px';
            cursor.style.top = cursorPosition.y + 'px';
        }

        // Pomera kursor
        function moveCursor(direction) {
            const step = 20; // Korak kretanja kursora
            if (direction === 'up') cursorPosition.y -= step;
            if (direction === 'down') cursorPosition.y += step;
            if (direction === 'left') cursorPosition.x -= step;
            if (direction === 'right') cursorPosition.x += step;
            updateCursorPosition();
        }

        // Klik na kursor (simulacija levo klik)
        function clickCursor() {
            alert("Kursor je kliknut!");
        }

        // Detekcija tastera sa tastature ili daljinskog uređaja
        document.addEventListener('keydown', function(e) {
            switch (e.key) {
                case 'ArrowUp':
                    moveCursor('up');
                    break;
                case 'ArrowDown':
                    moveCursor('down');
                    break;
                case 'ArrowLeft':
                    moveCursor('left');
                    break;
                case 'ArrowRight':
                    moveCursor('right');
                    break;
                case 'Enter': // Simulira klik kada pritisneš OK dugme
                    clickCursor();
                    break;
            }
        });

        // Inicijalizacija kursora
        updateCursorPosition();
    </script>
</body>
</html>
