<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .filter-button {
            padding: 8px 15px;
            font-size: 14px;
            color: white;
            background-color: #e50914;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .filter-button:hover {
            background-color: #b20610;
        }

        .movie-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 20px 0;
            width: 100%;
        }

        .movie-item {
            position: relative;
            width: 200px;
            height: 300px;
            background-color: #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            outline: none; /* Za navigaciju tastaturom */
        }

        .movie-item.selected {
            border: 2px solid #e50914; /* Istaknut selektovani film */
        }

        .movie-item img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
        }

        .movie-item h3 {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 16px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 5px;
        }

        .movie-item .genre {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 5px;
            border-radius: 5px;
        }

        .movie-item .rating {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 14px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 5px;
            border-radius: 5px;
        }

        .loading {
            text-align: center;
            color: #fff;
            font-size: 24px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="filters" id="year-filters"></div>
    <div class="filters" id="genre-filters"></div>

    <div class="movie-list" id="movie-list"></div>
    <div id="loading" class="loading" style="display: none;">Učitavanje...</div>

    <script>
        const apiKey = '2701858e9bccab54d4d0e4931420a739';
        const baseUrl = `https://api.themoviedb.org/3/`;
        const netflixProviderId = 8; // Netflix ID

        let currentPage = 1;
        let currentFilter = { type: 'popular', value: '' };
        let isLoading = false;

        const yearFilters = document.getElementById('year-filters');
        const genreFilters = document.getElementById('genre-filters');

        // Generišemo dugmad za godine
        for (let year = 2024; year >= 2000; year--) {
            const button = document.createElement('button');
            button.classList.add('filter-button');
            button.textContent = year;
            button.onclick = () => fetchFilteredMovies('year', year);
            yearFilters.appendChild(button);
        }

        // Učitavanje i prikazivanje žanrova
        fetch(`${baseUrl}genre/movie/list?api_key=${apiKey}&language=sr-SR`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Greška u preuzimanju žanrova: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                data.genres.forEach(genre => {
                    const button = document.createElement('button');
                    button.classList.add('filter-button');
                    button.textContent = genre.name;
                    button.onclick = () => fetchFilteredMovies('genre', genre.id);
                    genreFilters.appendChild(button);
                });
            })
            .catch(error => console.error('Greška pri učitavanju žanrova:', error));

        // Funkcija za učitavanje filmova
        function fetchFilteredMovies(type, value) {
            currentPage = 1;
            currentFilter = { type, value };
            document.getElementById('movie-list').innerHTML = '';
            fetchMovies();
        }

        // Fetch movies by filter
        function fetchMovies() {
            if (isLoading) return;

            isLoading = true;
            document.getElementById('loading').style.display = 'block';

            let url = `${baseUrl}discover/movie?api_key=${apiKey}&language=sr-SR&with_watch_providers=${netflixProviderId}&watch_region=RS&page=${currentPage}`;

            if (currentFilter.type === 'year') {
                url += `&primary_release_year=${currentFilter.value}`;
            } else if (currentFilter.type === 'genre') {
                url += `&with_genres=${currentFilter.value}`;
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const movies = data.results;
                    const movieList = document.getElementById('movie-list');

                    movies.forEach(movie => {
                        const movieItem = document.createElement('div');
                        movieItem.classList.add('movie-item');
                        movieItem.setAttribute('tabindex', 0); // Dodaje fokus za navigaciju tastaturom

                        const movieImage = document.createElement('img');
                        movieImage.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                        movieImage.alt = movie.title;

                        const movieTitle = document.createElement('h3');
                        movieTitle.textContent = movie.title;

                        const movieGenre = document.createElement('div');
                        movieGenre.classList.add('genre');
                        movieGenre.textContent = currentFilter.type === 'genre' ? '' : '';

                        const movieRating = document.createElement('div');
                        movieRating.classList.add('rating');
                        movieRating.textContent = `TMDB: ${movie.vote_average}`;

                        movieItem.appendChild(movieImage);
                        movieItem.appendChild(movieTitle);
                        movieItem.appendChild(movieGenre);
                        movieItem.appendChild(movieRating);
                        movieList.appendChild(movieItem);
                    });

                    currentPage++;
                    isLoading = false;
                    document.getElementById('loading').style.display = 'none';
                })
                .catch(error => {
                    console.error('Greška pri učitavanju filmova:', error);
                    isLoading = false;
                    document.getElementById('loading').style.display = 'none';
                });
        }

        // Funkcija za navigaciju kroz filmove
        function navigateMovies(direction) {
            const movieItems = document.querySelectorAll('.movie-item');
            let currentIndex = Array.from(movieItems).findIndex(item => item.classList.contains('selected'));

            if (currentIndex === -1) {
                currentIndex = 0;
                movieItems[currentIndex].classList.add('selected'); // Ističe prvi film na početku
            }

            let newIndex = -1;

            if (direction === 'left' && currentIndex % 5 > 0) { // Levo
                newIndex = currentIndex - 1;
            } else if (direction === 'right' && (currentIndex + 1) % 5 !== 0) { // Desno
                newIndex = currentIndex + 1;
            } else if (direction === 'up' && currentIndex >= 5) { // Gore
                newIndex = currentIndex - 5;
            } else if (direction === 'down' && currentIndex + 5 < movieItems.length) { // Dole
                newIndex = currentIndex + 5;
            }

            if (newIndex !== -1) {
                movieItems[currentIndex].classList.remove('selected');
                movieItems[newIndex].classList.add('selected');
                movieItems[newIndex].focus(); // Fokusiraj novi izabrani film
            }
        }

        // Event za tastaturu
        document.addEventListener('keydown', event => {
            switch (event.key) {
                case 'ArrowUp':
                    navigateMovies('up');
                    break;
                case 'ArrowDown':
                    navigateMovies('down');
                    break;
                case 'ArrowLeft':
                    navigateMovies('left');
                    break;
                case 'ArrowRight':
                    navigateMovies('right');
                    break;
            }
        });

        // Učitavanje početnih filmova
        fetchMovies();
        
        // Event za scroll
window.addEventListener('scroll', () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 100 && !isLoading) {
        fetchMovies();
    }
});



document.addEventListener('keydown', (event) => {
    const focusableButtons = Array.from(document.querySelectorAll('.filter-button, .movie-item:not(.movie-item .rating)'));
    let focusedIndex = focusableButtons.findIndex(button => button === document.activeElement);

    if (event.key === 'ArrowRight') {
        focusedIndex = (focusedIndex + 10) % focusableButtons.length;
    } else if (event.key === 'ArrowLeft') {
        focusedIndex = (focusedIndex - 10 + focusableButtons.length) % focusableButtons.length;
    }

    if (focusedIndex >= 0 && focusableButtons[focusedIndex]) {
        focusableButtons[focusedIndex].focus();
    }
});


    </script>

</body>
</html>
