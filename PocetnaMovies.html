<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 20px;
            margin: 20px;
        }

        .filters-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            width: 90%; /* Širina kontejnera za filtriranje */
            max-width: 1200px;
            margin: 20px auto;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px; /* Razmak između dugmadi */
            flex: 1; /* Svaka strana zauzima jednak prostor */
            justify-content: center;
        }

        .filter-button {
            padding: 6px 10px; /* Smanjen padding za dugmad */
            font-size: 12px; /* Smanjen font */
            color: white;
            background-color: #e50914;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .filter-button:hover {
            background-color: #b20610;
        }

        .filter-button:focus {
            outline: 2px solid white; /* Fokus vidljiv za TV navigaciju */
        }

        .movie-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px; /* Više prostora između elemenata */
            justify-content: center;
            padding: 20px 0;
            width: 100%;
        }

        .movie-item {
            position: relative;
            width: 180px; /* Smanjena širina za TV ekran */
            height: 270px; /* Smanjena visina */
            background-color: #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .movie-item:hover {
            transform: scale(1.05);
        }

        .movie-item img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
        }

        .movie-item h3 {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 14px; /* Smanjen font */
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 5px;
        }

        .movie-item .rating {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 12px; /* Smanjen font */
            background-color: rgba(0, 0, 0, 0.7);
            padding: 5px;
            border-radius: 5px;
        }

        .loading {
            text-align: center;
            color: #fff;
            font-size: 24px;
            margin: 20px 0;
        }

        .logo {
            margin: 20px 0;
            text-align: center;
        }

        .logo img {
            width: 150px;
        }
        
        .filter-button:focus,
        .movie-item:focus {
            outline: 2px solid #e50914;
            outline-offset: 3px;
            transform: scale(1.1); /* Uvećanje fokusa */
        }
    </style>
</head>
<body>

<div class="logo">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo">
</div>

<div class="filters-container">
    <div class="filters" id="year-filters"></div> <!-- Leva strana - Godine -->
    <div class="filters" id="genre-filters"></div> <!-- Desna strana - Žanrovi -->
</div>

<div class="movie-list" id="movie-list"></div>
<div id="loading" class="loading" style="display: none;">Učitavanje...</div>

<script>
    const apiKey = '2701858e9bccab54d4d0e4931420a739';
    const baseUrl = `https://api.themoviedb.org/3/`;
    const netflixProviderId = 8; // Netflix ID
    
    let currentPage = 1;
    let currentFilter = { type: 'popular', value: '' };
    let isLoading = false;

    const yearFilters = document.getElementById('year-filters');
    const genreFilters = document.getElementById('genre-filters');

    // Funkcija za konverziju ćirilice u latinicu
    function toLatin(text) {
        const cyrillicToLatinMap = {
            А: 'A', Б: 'B', В: 'V', Г: 'G', Д: 'D', Ђ: 'Đ', Е: 'E', Ж: 'Ž',
            З: 'Z', И: 'I', Ј: 'J', К: 'K', Л: 'L', Љ: 'Lj', М: 'M', Н: 'N',
            Њ: 'Nj', О: 'O', П: 'P', Р: 'R', С: 'S', Т: 'T', Ћ: 'Ć', У: 'U',
            Ф: 'F', Х: 'H', Ц: 'C', Ч: 'Č', Џ: 'Dž', Ш: 'Š', а: 'a', б: 'b',
            в: 'v', г: 'g', д: 'd', ђ: 'đ', е: 'e', ж: 'ž', з: 'z', и: 'i',
            ј: 'j', к: 'k', л: 'l', љ: 'lj', м: 'm', н: 'n', њ: 'nj', о: 'o',
            п: 'p', р: 'r', с: 's', т: 't', ћ: 'ć', у: 'u', ф: 'f', х: 'h',
            ц: 'c', ч: 'č', џ: 'dž', ш: 'š'
        };
        return text.replace(/[А-Яа-яЀ-ӿ]/g, char => cyrillicToLatinMap[char] || char);
    }

    // Generišemo dugmad za godine
    for (let year = 2024; year >= 2000; year--) {
        const button = document.createElement('button');
        button.classList.add('filter-button');
        button.textContent = year;
        button.onclick = () => fetchFilteredMovies('year', year);
        yearFilters.appendChild(button);
    }

    // Učitavanje i prikazivanje žanrova
    fetch(`${baseUrl}genre/movie/list?api_key=${apiKey}&language=sr-SR`)
        .then(response => {
            if (!response.ok) {
                throw new Error(`Greška u preuzimanju žanrova: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            data.genres.forEach(genre => {
                const button = document.createElement('button');
                button.classList.add('filter-button');
                button.textContent = toLatin(genre.name);
                button.onclick = () => fetchFilteredMovies('genre', genre.id);
                genreFilters.appendChild(button);
            });
        })
        .catch(error => console.error('Greška pri učitavanju žanrova:', error));

    // Funkcija za učitavanje filmova
    function fetchFilteredMovies(type, value) {
        currentPage = 1;
        currentFilter = { type, value };
        document.getElementById('movie-list').innerHTML = '';
        fetchMovies();
    }

    // Fetch movies by filter
    function fetchMovies() {
        if (isLoading) return;

        isLoading = true;
        document.getElementById('loading').style.display = 'block';

        let url = `${baseUrl}discover/movie?api_key=${apiKey}&language=sr-SR&with_watch_providers=${netflixProviderId}&watch_region=RS&page=${currentPage}`;

        if (currentFilter.type === 'year') {
            url += `&primary_release_year=${currentFilter.value}`;
        } else if (currentFilter.type === 'genre') {
            url += `&with_genres=${currentFilter.value}`;
        }

        fetch(url)
            .then(response => response.json())
            .then(data => {
                const movies = data.results;
                const movieList = document.getElementById('movie-list');

                movies.forEach(movie => {
                    const movieItem = document.createElement('div');
                    movieItem.classList.add('movie-item');

                    const movieImage = document.createElement('img');
                    movieImage.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                    movieImage.alt = movie.title;

                    const movieTitle = document.createElement('h3');
                    movieTitle.textContent = toLatin(movie.title);

                    const movieRating = document.createElement('div');
                    movieRating.classList.add('rating');
                    movieRating.textContent = `TMDB: ${movie.vote_average}`;

                    movieItem.appendChild(movieImage);
                    movieItem.appendChild(movieTitle);
                    movieItem.appendChild(movieRating);
                    movieList.appendChild(movieItem);

                    // Navigate to URL in the same page on image click
                    movieImage.addEventListener('click', () => {
                        window.location.href = `https://vidsrc.vip/embed/movie/${movie.id}`;
                    });

                    // Open URL in a new tab on title click
                    movieTitle.addEventListener('click', () => {
                        window.open(`https://vidsrc.vip/embed/movie/${movie.id}`, '_blank');
                    });
                });

                currentPage++;
                isLoading = false;
                document.getElementById('loading').style.display = 'none';
            })
            .catch(error => {
                console.error('Greška pri učitavanju filmova:', error);
                isLoading = false;
                document.getElementById('loading').style.display = 'none';
            });
    }

    // Infinite scroll
    window.addEventListener('scroll', () => {
        const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
        if (scrollTop + clientHeight >= scrollHeight - 100 && !isLoading) {
            fetchMovies();
        }
    });

    // Početno učitavanje filmova
    fetchMovies();
    
   document.addEventListener('keydown', (event) => {
    const focusableButtons = Array.from(document.querySelectorAll('.filters button')); // Sve dugmadi iz svih filtera
    let focusedIndex = focusableButtons.findIndex(button => button === document.activeElement);

    switch (event.key) {
        case 'ArrowRight':
            focusedIndex = (focusedIndex + 1) % focusableButtons.length; // Desno - ide na sledeći element
            break;
        case 'ArrowLeft':
            focusedIndex = (focusedIndex - 1 + focusableButtons.length) % focusableButtons.length; // Levo - ide na prethodni element
            break;
        case 'ArrowDown':
            focusedIndex = (focusedIndex + 10) % focusableButtons.length; // Ako je fokus na poslednjem dugmetu prvog filtera, prelazi na prvi dugme drugog filtera
            break;
        case 'ArrowUp':
            focusedIndex = (focusedIndex - 3 + focusableButtons.length) % focusableButtons.length; // Ako je fokus na prvom dugmetu drugog filtera, prelazi na poslednje dugme prvog filtera
            break;
        default:
            return;
    }

    if (focusedIndex >= 0 && focusableButtons[focusedIndex]) {
        focusableButtons[focusedIndex].focus();
    }
});
</script>

</body>
</html>
