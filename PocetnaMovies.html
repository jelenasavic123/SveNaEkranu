<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popularni Filmovi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        h1 {
            font-size: 6px;
            margin-bottom: 2px;
        }

        .section {
            margin-bottom: 40px;
            width: 100%;
        }

        .section-title {
            font-size: 20px;
            margin: 20px 0;
            text-align: left;
            width: 100%;
        }

        .movie-list {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding: 10px 0;
            scroll-snap-type: x mandatory;
            width: 100%;
            position: relative;
        }

        .movie-item {
            position: relative;
            width: 120px;
            height: auto;
            background-color: #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
            transition: transform 0.3s ease;
            scroll-snap-align: center;
            cursor: pointer;
        }

        .movie-item img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
        }

        .movie-item h3 {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 5px;
        }

        .movie-item.selected {
            outline: 3px solid red; /* Crveni okvir */
            border-radius: 10px;
        }

        .logo {
            margin: 0px 0;
            text-align: center;
        }

        .logo img {
            width: 50px;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;      /* Omogućava prelazak na sledeći red ako ne stane u trenutni */
            justify-content: space-around; /* Razmak između dugmadi */
        }

        .button {
            display: inline-flex;
            align-items: center;
            margin: 7px;
            border-radius: 5px;
            background-color: #333;
            color: white;
            text-decoration: none;
            justify-content: center;
            gap: 2px;             /* Razmak između dugmadi */
        }

        .button img {
            width: 30px;
            height: 30px;
            margin-right: 10px;
        }

        .button:hover {
            background-color: #555;
        }

        .movie-item.selected {
            outline: 3px solid red; /* Crveni okvir */
        }

        .filter-container {
            margin-bottom: 20px;
        }

        .filter-input {
            padding: 5px;
            width: 300px;
            border-radius: 5px;
            border: 1px solid #555;
            background-color: #222;
            color: white;
            margin-right: 10px;
        }

        .select-container {
            margin-bottom: 20px;
        }

        .select-input {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #555;
            background-color: #222;
            color: white;
        }

        /* Fokusiranje na selektovane elemente */
        .focus-visible {
            outline: 3px solid red; /* Crvena granica za fokusirane elemente */
        }
    </style>
</head>
<body>

<div class="button-container">
    <a href="https://jelenasavic123.github.io/SveNaEkranu/netflix.html" class="button" tabindex="0">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo">
        Netflix
    </a>

    <a href="https://jelenasavic123.github.io/SveNaEkranu/marvel.html" class="button" tabindex="0">
        <img src="https://cdn.worldvectorlogo.com/logos/marvel.svg" alt="Marvel Logo">
        Marvel
    </a>

    <a href="https://jelenasavic123.github.io/SveNaEkranu/hulu.html" class="button" tabindex="0">
        <img src="https://cdn.worldvectorlogo.com/logos/hulu.svg" alt="Hulu Logo">
        Hulu
    </a>

    <a href="https://jelenasavic123.github.io/SveNaEkranu/apple.html" class="button" tabindex="0">
        <img src="https://bgr.com/wp-content/uploads/2021/06/Apple-introduces-apple-tv-plus-03252019.jpg?quality=82&strip=all&resize=1400,1400" alt="Apple Logo">
        Apple TV+
    </a>

    <a href="https://jelenasavic123.github.io/SveNaEkranu/prime.html" class="button" tabindex="0">
        <img src="https://cdn.worldvectorlogo.com/logos/amazon-prime-video-1.svg" alt="Amazon Prime Logo">
        Prime Video
    </a>

    <a href="https://jelenasavic123.github.io/SveNaEkranu/dizni.html" class="button" tabindex="0">
        <img src="https://cdn.worldvectorlogo.com/logos/disney-wbackground.svg" alt="Disney+ Logo">
        Disney+
    </a>
</div>

<div class="filter-container">
    <input type="text" id="filter-input" class="filter-input" placeholder="Pretraži filmove..." tabindex="0">
</div>

<div class="select-container">
    <select id="keyword-select" class="select-input" tabindex="0" aria-label="Odaberi ključnu reč">
        <option value="">-- Odaberi ključnu reč --</option>
        <option value="action">Akcija</option>
        <option value="comedy">Komedija</option>
        <option value="drama">Drama</option>
        <option value="adventure">Avantura</option>
        <option value="fantasy">Fantazija</option>
        <option value="horror">Horor</option>
        <option value="romance">Romansa</option>
    </select>
</div>

<div class="section">
    <div class="section-title">Top Rated</div>
    <div class="movie-list" id="top-rated-list" tabindex="0"></div>
</div>

<div class="section">
    <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo">
    </div>
    <div class="movie-list" id="netflix-list" tabindex="0"></div>
</div>

<div class="section">
    <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Disney%2B_logo.svg/1280px-Disney%2B_logo.svg.png" alt="Disney+ Logo">
    </div>
    <div class="movie-list" id="disney-list" tabindex="0"></div>
</div>

<div class="section">
    <div class="logo">
        <img src="https://static1.colliderimages.com/wordpress/wp-content/uploads/2019/03/apple-tv-plus-logo-slice.jpg" alt="Apple TV+ Logo">
    </div>
    <div class="movie-list" id="apple-tv-list" tabindex="0"></div>
</div>

<div class="section">
    <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/Hulu_2019.svg/2560px-Hulu_2019.svg.png" alt="Hulu Logo">
    </div>
    <div class="movie-list" id="hulu-list" tabindex="0"></div>
</div>

<div class="section">
    <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Amazon_Prime_logo_%282022%29.svg/768px-Amazon_Prime_logo_%282022%29.svg.png" alt="Amazon Prime Video Logo">
    </div>
    <div class="movie-list" id="prime-list" tabindex="0"></div>
</div>

<script>
const apiKey = '2701858e9bccab54d4d0e4931420a739';

// Funkcija za preuzimanje filmova
function fetchMovies(listId, serviceId, filterKeyword = '') {
    const apiBase = `https://api.themoviedb.org/3/discover/movie?api_key=${apiKey}&with_watch_providers=${serviceId}&watch_region=US&sort_by=popularity.desc`;

    fetch(apiBase)
        .then(response => {
            if (!response.ok) {
                throw new Error('API greška!');
            }
            return response.json();
        })
        .then(data => {
            displayMovies(listId, data.results, filterKeyword);
        })
        .catch(error => {
            console.error('Greška pri učitavanju podataka:', error);
        });
}

// Funkcija za prikazivanje filmova
function displayMovies(listId, movies, filterKeyword) {
    const list = document.getElementById(listId);
    list.innerHTML = '';

    movies.filter(movie => {
        if (!filterKeyword) {
            return true;
        }
        return movie.title.toLowerCase().includes(filterKeyword.toLowerCase());
    }).forEach(movie => {
        const movieItem = document.createElement('div');
        movieItem.className = 'movie-item';
        movieItem.tabIndex = 0;
        movieItem.innerHTML = `
            <img src="https://image.tmdb.org/t/p/w200${movie.poster_path}" alt="${movie.title}">
            <h3>${movie.title}</h3>
        `;
        movieItem.addEventListener('click', () => {
            movieItem.classList.toggle('selected');
        });
        list.appendChild(movieItem);
    });

    // Omogućavanje navigacije tastaturom
    list.addEventListener('keydown', event => {
        const focusedElement = document.activeElement;
        if (focusedElement.classList.contains('movie-item')) {
            if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
                const next = focusedElement.nextElementSibling;
                if (next) {
                    next.focus();
                }
            } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
                const prev = focusedElement.previousElementSibling;
                if (prev) {
                    prev.focus();
                }
            } else if (event.key === 'Enter') {
                focusedElement.classList.toggle('selected');
            }
        }
    });
}

// Funkcija za filtriranje filmova
function filterMovies() {
    const filterInput = document.getElementById('filter-input').value;
    fetchMovies('top-rated-list', '', filterInput);
    fetchMovies('netflix-list', '8', filterInput);
    fetchMovies('disney-list', '337', filterInput);
    fetchMovies('apple-tv-list', '361', filterInput);
    fetchMovies('hulu-list', '119', filterInput);
    fetchMovies('prime-list', '264', filterInput);
}

// Event Listeners
document.getElementById('filter-input').addEventListener('input', filterMovies);
document.getElementById('keyword-select').addEventListener('change', event => {
    fetchMovies('top-rated-list', '', event.target.value);
    fetchMovies('netflix-list', '8', event.target.value);
    fetchMovies('disney-list', '337', event.target.value);
    fetchMovies('apple-tv-list', '361', event.target.value);
    fetchMovies('hulu-list', '119', event.target.value);
    fetchMovies('prime-list', '264', event.target.value);
});

// Initial fetch
fetchMovies('top-rated-list', '');
fetchMovies('netflix-list', '8');
fetchMovies('disney-list', '337');
fetchMovies('apple-tv-list', '361');
fetchMovies('hulu-list', '119');
fetchMovies('prime-list', '264');
</script>

</body>
</html>
