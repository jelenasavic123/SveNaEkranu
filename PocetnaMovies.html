<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Style Movie App</title>
    <style>
        /* Osnovni stilovi */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #141414;
            color: white;
        }

        .container {
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 20px;
            text-align: center;
        }

        .movie-row {
            margin: 20px 0;
        }

        .movie-row h2 {
            margin: 10px 0;
            font-size: 1.5em;
            color: white;
        }

        .movie-list {
            display: flex;
            overflow-x: scroll;
            padding-bottom: 20px;
            gap: 10px;
        }

        .movie-card {
            width: 200px;
            background-color: #333;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }

        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .movie-card:hover {
            transform: scale(1.05);
        }

        .movie-card .details {
            padding: 10px;
        }

        .movie-card .details h3 {
            font-size: 16px;
            font-weight: bold;
        }

        .movie-card .details p {
            font-size: 12px;
            color: #bbb;
        }

        /* Scrollbar stilizacija */
        .movie-list::-webkit-scrollbar {
            height: 8px;
        }

        .movie-list::-webkit-scrollbar-thumb {
            background-color: #888;
            border-radius: 4px;
        }

        .movie-list::-webkit-scrollbar-track {
            background-color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Movie Library</h1>

    <!-- Popularni filmovi -->
    <div class="movie-row" id="popular-movies">
        <h2>Popular Movies</h2>
        <div class="movie-list" id="popular-movie-list"></div>
    </div>

    <!-- Najbolje ocenjeni filmovi -->
    <div class="movie-row" id="top-rated-movies">
        <h2>Top Rated Movies</h2>
        <div class="movie-list" id="top-rated-movie-list"></div>
    </div>

    <!-- Novi filmovi -->
    <div class="movie-row" id="new-movies">
        <h2>New Movies</h2>
        <div class="movie-list" id="new-movie-list"></div>
    </div>
</div>

<script>
    const apiKey = '2701858e9bccab54d4d0e4931420a739'; // Tvoj TMDb API ključ

    // Funkcija za dohvat filmova sa TMDb API-a
    async function fetchMovies(endpoint) {
        const url = `https://api.themoviedb.org/3${endpoint}?api_key=${apiKey}&language=en-US&page=1`;
        const response = await fetch(url);
        const data = await response.json();
        return data.results;
    }

    // Funkcija za kreiranje i dodavanje filmova na stranicu
    function displayMovies(movies, elementId) {
        const movieList = document.getElementById(elementId);
        movieList.innerHTML = '';  // Očisti prethodne filmove

        movies.forEach(movie => {
            const movieCard = document.createElement('div');
            movieCard.classList.add('movie-card');

            // Kreiraj link za svaki film koji vodi na detalje o filmu
            const movieLink = document.createElement('a');
            movieLink.href = `https://vidsrc.vip/embed/movie/${movie.id}`;
            movieLink.target = "_blank"; // Otvori u novom tabu

            // Dodavanje slike filma
            const img = document.createElement('img');
            img.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
            img.alt = movie.title;

            // Dodavanje detalja o filmu
            const details = document.createElement('div');
            details.classList.add('details');

            const title = document.createElement('h3');
            title.textContent = movie.title;

            const rating = document.createElement('p');
            rating.textContent = `Rating: ${movie.vote_average}`;

            // Sastavljanje kartice
            details.appendChild(title);
            details.appendChild(rating);
            movieCard.appendChild(img);
            movieCard.appendChild(details);

            // Dodajemo karticu unutar linka
            movieLink.appendChild(movieCard);
            movieList.appendChild(movieLink);
        });
    }

    // Poziv funkcije za učitavanje filmova
    async function loadMovies() {
        const popularMovies = await fetchMovies('/movie/popular');
        const topRatedMovies = await fetchMovies('/movie/top_rated');
        const newMovies = await fetchMovies('/movie/upcoming');

        displayMovies(popularMovies, 'popular-movie-list');
        displayMovies(topRatedMovies, 'top-rated-movie-list');
        displayMovies(newMovies, 'new-movie-list');
    }

    window.onload = loadMovies;  // Pokreni učitavanje filmova kada stranica bude učitana
</script>

</body>
</html>
