<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popularni Netflix Filmovi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .movie-list {
            display: flex;
            overflow-x: scroll;
            gap: 20px;
            padding: 20px 0;
            scroll-snap-type: x mandatory;
            width: 100%;
            justify-content: flex-start;
        }

        .movie-item {
            position: relative;
            width: 200px;
            height: 300px;
            background-color: #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
            transition: transform 0.3s ease;
            scroll-snap-align: start;
        }

        .movie-item:hover {
            transform: scale(1.05);
        }

        .movie-item img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
        }

        .movie-item h3 {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 5px;
        }

        .loading {
            text-align: center;
            color: #fff;
            font-size: 24px;
            margin: 20px 0;
        }

        .movie-item.focused {
            outline: 3px solid red; /* Crveni okvir */
            border-radius: 4px;
        }

        .movie-item.selected {
            outline: 3px solid red; /* Crveni okvir za aktivni film */
            border-radius: 4px; /* Dodaje zaobljenje ivica */
        }
    </style>
</head>
<body>

    <h1>Popularni Netflix Filmovi</h1>
    <div class="movie-list" id="movie-list"></div>
    <div id="loading" class="loading" style="display: none;">Učitavanje...</div>

    <script>
        const apiKey = '2701858e9bccab54d4d0e4931420a739';
        const apiBase = `https://api.themoviedb.org/3/movie/popular?api_key=${apiKey}&language=sr-SR`;

        let currentPage = 1;
        let isLoading = false;

        // Funkcija za prikazivanje filmova
        function fetchMovies(page) {
            if (isLoading) return; // Prevent multiple requests at the same time

            isLoading = true;
            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            fetch(`${apiBase}&page=${currentPage}`)
                .then(response => response.json())
                .then(data => {
                    const movies = data.results;
                    const movieList = document.getElementById('movie-list');

                    // Loop through the movies and add them to the list
                    movies.forEach(movie => {
                        const movieItem = document.createElement('div');
                        movieItem.classList.add('movie-item');
                        movieItem.setAttribute('data-id', movie.id); // Dodano data-id atribut

                        const movieImage = document.createElement('img');
                        movieImage.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                        movieImage.alt = movie.title;

                        const movieTitle = document.createElement('h3');
                        movieTitle.textContent = capitalizeTitle(movie.title);

                        movieItem.appendChild(movieImage);
                        movieItem.appendChild(movieTitle);
                        movieList.appendChild(movieItem);

                        movieItem.addEventListener('click', () => {
                            window.location.href = `https://vidsrc.vip/embed/movie/${movie.id}`;
                        });
                    });

                    currentPage++;
                    isLoading = false;
                    loading.style.display = 'none';
                })
                .catch(error => {
                    console.error('Greška prilikom preuzimanja podataka:', error);
                    isLoading = false;
                    loading.style.display = 'none';
                });
        }

        // Utility funkcije
        function capitalizeTitle(title) {
            return title.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        // Initial fetch
        fetchMovies(currentPage);

        // Funkcija za navigaciju kroz filmove
        function navigateMovies(direction) {
            const movieItems = document.querySelectorAll('.movie-item');
            let currentIndex = Array.from(movieItems).findIndex(item => item.classList.contains('selected'));

            if (currentIndex === -1) {
                currentIndex = 0; // Početno selektovan prvi film
                movieItems[currentIndex].classList.add('selected', 'focused'); // Dodavanje klasi za selektovani i fokusirani film
                movieItems[currentIndex].focus(); // Fokus na prvi film
            }

            let newIndex = -1;

            switch (direction) {
                case 'left': // Levo
                    if (currentIndex > 0) { // Ako nije prvi film
                        newIndex = currentIndex - 1;
                    }
                    break;
                case 'right': // Desno
                    if (currentIndex < movieItems.length - 1) { // Ako nije poslednji film
                        newIndex = currentIndex + 1;
                    }
                    break;
                case 'enter': // Enter
                    if (currentIndex !== -1) {
                        window.location.href = `https://vidsrc.vip/embed/movie/${movieItems[currentIndex].getAttribute('data-id')}`; // Klik na selektovani film
                    }
                    break;
            }

            if (newIndex !== -1) {
                movieItems[currentIndex].classList.remove('selected', 'focused'); // Ukloni selekciju iz starog filma
                movieItems[newIndex].classList.add('selected', 'focused'); // Dodaj novi selektovani film
                movieItems[newIndex].focus(); // Fokusiraj novi izabrani film
            } else {
                movieItems[currentIndex].classList.remove('selected', 'focused'); // Ukloni selekciju iz starog filma
            }
        }

        // Event za tastaturu
        document.addEventListener('keydown', event => {
            switch (event.key) {
                case 'ArrowLeft':
                    navigateMovies('left');
                    break;
                case 'ArrowRight':
                    navigateMovies('right');
                    break;
                case 'Enter': // Enter
                    navigateMovies('enter');
                    break;
            }
        });
    </script>

</body>
</html>
