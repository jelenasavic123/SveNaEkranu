<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Scrolling with Remote Navigation</title>
    <style>
        body {
        background-color: #181818; /* Tamna pozadina */
  
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .section {
            width: 100%;
            margin-bottom: 30px;
        }
        .section h2 {
            width: 100%;
            text-align: center;
            margin: 20px 0;
            font-size: 24px;
            font-weight: 700;
            color: #fff; /* Bela boja za naslov */
        }
        .image-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 0;
        }
        .image-container img {
            width: calc(16.66% - 10px);
            height: auto;
            border: 2px solid #fff; /* Bele ivice */
            border-radius: 8px; /* Blago zaobljeni rubovi */
            cursor: pointer;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
        .image-container img:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .button-container button {
            background-color: #444;
            border: 2px solid #fff;
            color: #fff;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
            transition: background-color 0.3s ease-in-out;
        }
        .button-container button:hover {
            background-color: #666;
        }
        
            
.button-container {
    display: flex;
    flex-wrap: wrap;      /* Omogućava prelazak na sledeći red ako ne stane u trenutni */
    justify-content: space-around; /* Razmak između dugmadi */
}

.navbar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background-color: #333;
    padding: 1rem;
}

.navbar-list {
    list-style: none;
    display: flex;
    gap: 1rem;
    margin: 0;
    padding: 0;
}

.navbar-item {
    display: flex;
    align-items: center;
}

.navbar-link {
    text-decoration: none;
    color: white;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.navbar-link img {
    width: 30px;
    height: auto;
}

    </style>
</head>
<body>


<nav class="navbar">
    <ul class="navbar-list">
        <li class="navbar-item">
            <a href="https://jelenasavic123.github.io/SveNaEkranu/netflix.html" class="navbar-link">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo">
                Netflix
            </a>
        </li>
        <li class="navbar-item">
            <a href="https://jelenasavic123.github.io/SveNaEkranu/marvel.html" class="navbar-link">
                <img src="https://cdn.worldvectorlogo.com/logos/marvel.svg" alt="Marvel Logo">
                Marvel
            </a>
        </li>
        <li class="navbar-item">
            <a href="https://jelenasavic123.github.io/SveNaEkranu/hulu.html" class="navbar-link">
                <img src="https://cdn.worldvectorlogo.com/logos/hulu.svg" alt="Hulu Logo">
                Hulu
            </a>
        </li>
        <li class="navbar-item">
            <a href="https://jelenasavic123.github.io/SveNaEkranu/apple.html" class="navbar-link">
                <img src="https://bgr.com/wp-content/uploads/2021/06/Apple-introduces-apple-tv-plus-03252019.jpg?quality=82&strip=all&resize=1400,1400" alt="Apple Logo">
                Apple TV+
            </a>
        </li>
        <li class="navbar-item">
            <a href="https://jelenasavic123.github.io/SveNaEkranu/prime.html" class="navbar-link">
                <img src="https://cdn.worldvectorlogo.com/logos/amazon-prime-video-1.svg" alt="Amazon Prime Logo">
                Prime Video
            </a>
        </li>
        <li class="navbar-item">
            <a href="https://jelenasavic123.github.io/SveNaEkranu/dizni.html" class="navbar-link">
                <img src="https://cdn.worldvectorlogo.com/logos/disney-wbackground.svg" alt="Disney+ Logo">
                Disney+
            </a>
        </li>
    </ul>
</nav>





    <div class="container">
        <!-- Netflix Section -->
        <div class="section" id="netflixSection">
            <h2>Netflix</h2>
            <div class="image-container" id="netflixImages"></div>
        </div>

        <!-- Hulu Section -->
        <div class="section" id="huluSection">
            <h2>Hulu</h2>
            <div class="image-container" id="huluImages"></div>
        </div>

        <!-- Popular Section -->
        <div class="section" id="popularSection">
            <h2>Popular</h2>
            <div class="image-container" id="popularImages"></div>
        </div>

        <!-- Button Container for Controls -->
        <div class="button-container">
            <button id="prevSection">Previous Section</button>
            <button id="nextSection">Next Section</button>
        </div>
    </div>

    <script>
        async function fetchMovies(apiKey, sectionId, category) {
            const tmdbBaseUrl = "https://api.themoviedb.org/3";
            const response = await fetch(`${tmdbBaseUrl}/movie/${category}?api_key=${apiKey}&language=en-US&page=1`);
            const data = await response.json();

            if (data.results && data.results.length > 0) {
                displayImages(data.results, sectionId);
            }
        }

        function displayImages(movies, sectionId) {
            const container = document.getElementById(sectionId);
            container.innerHTML = ""; // Clear existing images
            movies.forEach(movie => {
                const imgElement = document.createElement('img');
                imgElement.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                imgElement.alt = movie.title;
                imgElement.tabIndex = 0;  // Allow keyboard navigation
                imgElement.addEventListener('click', () => {
                    window.location.href = `https://vidsrc.vip/embed/movie/${movie.id}`;
                });
                container.appendChild(imgElement);
            });

            handleKeyboardNavigation(); // Enable keyboard navigation
        }

        function handleKeyboardNavigation() {
            const sections = document.querySelectorAll('.section');
            let currentSectionIndex = 0;
            let currentImageIndex = 0;

            sections[currentSectionIndex].querySelector('img').focus(); // Focus prvi image u prvoj sekciji

            document.addEventListener('keydown', (event) => {
                const currentSection = sections[currentSectionIndex];
                const imageContainer = currentSection.querySelector('.image-container');

                if (event.key === 'ArrowRight') {
                    // Navigate right within the current section
                    currentImageIndex = (currentImageIndex + 1) % imageContainer.children.length;
                    imageContainer.children[currentImageIndex].focus();
                } else if (event.key === 'ArrowLeft') {
                    // Navigate left within the current section
                    currentImageIndex = (currentImageIndex - 1 + imageContainer.children.length) % imageContainer.children.length;
                    imageContainer.children[currentImageIndex].focus();
                } else if (event.key === 'ArrowDown') {
                    // Navigate down to the next section
                    currentSectionIndex = (currentSectionIndex + 1) % sections.length;
                    currentImageIndex = 0; // Reset image index
                    sections[currentSectionIndex].querySelector('img').focus();
                } else if (event.key === 'ArrowUp') {
                    // Navigate up to the previous section
                    currentSectionIndex = (currentSectionIndex - 1 + sections.length) % sections.length;
                    currentImageIndex = 0; // Reset image index
                    sections[currentSectionIndex].querySelector('img').focus();
                }
            });

            // Add navigation buttons functionality
            document.getElementById('prevSection').addEventListener('click', () => {
                currentSectionIndex = (currentSectionIndex - 1 + sections.length) % sections.length;
                currentImageIndex = 0;
                sections[currentSectionIndex].querySelector('img').focus();
            });

            document.getElementById('nextSection').addEventListener('click', () => {
                currentSectionIndex = (currentSectionIndex + 1) % sections.length;
                currentImageIndex = 0;
                sections[currentSectionIndex].querySelector('img').focus();
            });
        }

        // Fetch data for each section
        fetchMovies('2701858e9bccab54d4d0e4931420a739', 'netflixImages', 'popular');
        fetchMovies('2701858e9bccab54d4d0e4931420a739', 'huluImages', 'top_rated'); // Or any other category
        fetchMovies('2701858e9bccab54d4d0e4931420a739', 'popularImages', 'popular');
    </script>

</body>
</html>
