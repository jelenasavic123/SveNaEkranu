<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preusmerivač Linkova</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 10px;
    }
    input, button {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
      box-sizing: border-box;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
  </style>
</head>
<body>
  <h1>Dodavanje i Generisanje Preusmeravanja</h1>
  <div id="form-container">
    <input type="text" id="tmdb-id" placeholder="Unesite TMDB ID (npr. 762509)">
    <input type="text" id="dooodster-link" placeholder="Unesite originalni link (npr. https://dooodster.com/e/6mfqxg1589sl)">
    <button id="generate-btn">Generiši Preusmeravajući Fajl</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>TMDB Link</th>
        <th>Originalni Link</th>
      </tr>
    </thead>
    <tbody id="links-table">
      <!-- Linkovi će se ovde prikazati -->
    </tbody>
  </table>
  <script>
    const generateButton = document.getElementById('generate-btn');
    const linksTable = document.getElementById('links-table');

    generateButton.addEventListener('click', () => {
      const tmdbId = document.getElementById('tmdb-id').value.trim();
      const dooodsterLink = document.getElementById('dooodster-link').value.trim();

      if (!tmdbId || !dooodsterLink) {
        alert('Unesite oba polja!');
        return;
      }

      const fileName = `id/${tmdbId}.html`;
      const redirectCode = `
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Redirecting...</title>
          <meta http-equiv="refresh" content="0;url=${dooodsterLink}">
        </head>
        <body>
          <p>Redirecting to <a href="${dooodsterLink}">${dooodsterLink}</a>...</p>
        </body>
        </html>
      `;

      // Prikazujemo generisani link u tabeli
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><a href="https://jelenasavic123.github.io/SveNaEkranu/${fileName}" target="_blank">${fileName}</a></td>
        <td><a href="${dooodsterLink}" target="_blank">${dooodsterLink}</a></td>
      `;
      linksTable.appendChild(row);

      // Preuzimanje fajla za preusmeravanje
      const blob = new Blob([redirectCode], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      a.click();

      // Čistimo unos
      document.getElementById('tmdb-id').value = '';
      document.getElementById('dooodster-link').value = '';
    });
  </script>
</body>
</html>
