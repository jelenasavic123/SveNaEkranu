<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preusmeravanje</title>
  <script>
    // Mapa TMDB ID-ova i originalnih linkova
    const redirects = {
      "762509": "https://dooodster.com/e/6mfqxg1589sl",
      "123456": "https://dooodster.com/e/examplelink",
      "987654": "https://dooodster.com/e/anotherlink"
      // Dodaj više ID-ova ovde
    };

    // Dobijanje trenutnog URL-a
    const url = new URL(window.location.href);
    
    // Ekstrahovanje TMDB ID-a iz URL-a
    const pathParts = url.pathname.split('/');
    const tmdbId = pathParts[pathParts.length - 1];

    // Preusmeravanje na odgovarajući link
    if (redirects[tmdbId]) {
      window.location.href = redirects[tmdbId];
    } else {
      document.write(`<h1>TMDB ID "${tmdbId}" nije pronađen!</h1>`);
    }
  </script>
</head>
<body>
  <noscript>Ovaj sajt zahteva JavaScript za preusmeravanje.</noscript>
</body>
</html>
