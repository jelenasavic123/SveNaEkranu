<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Preusmerivač</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 10px;
    }
    input, button {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
      box-sizing: border-box;
    }
    #form-container {
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
  </style>
</head>
<body>
  <h1>Link Preusmerivač</h1>
  <div id="form-container">
    <input type="text" id="dooodster-link" placeholder="Unesite Dooodster link (npr. https://dooodster.com/e/6mfqxg1589sl)">
    <input type="text" id="tmdb-id" placeholder="Unesite TMDB ID (npr. 762509)">
    <button id="add-link-btn">Dodaj Link</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>TMDB Link</th>
        <th>Originalni Link</th>
      </tr>
    </thead>
    <tbody id="links-table">
      <!-- Linkovi će se ovde prikazati -->
    </tbody>
  </table>

  <script>
    // Mapa linkova (TMDB ID -> Originalni link)
    const links = {};

    // Elementi DOM-a
    const dooodsterInput = document.getElementById('dooodster-link');
    const tmdbInput = document.getElementById('tmdb-id');
    const addLinkBtn = document.getElementById('add-link-btn');
    const linksTable = document.getElementById('links-table');

    // Dodavanje novog linka
    addLinkBtn.addEventListener('click', () => {
      const dooodsterLink = dooodsterInput.value.trim();
      const tmdbId = tmdbInput.value.trim();

      if (!dooodsterLink || !tmdbId) {
        alert('Molimo unesite oba polja!');
        return;
      }

      // Dodavanje u mapu
      links[tmdbId] = dooodsterLink;

      // Očistimo unos
      dooodsterInput.value = '';
      tmdbInput.value = '';

      // Prikaz u tabeli
      updateTable();
    });

    // Ažuriranje tabele
    function updateTable() {
      linksTable.innerHTML = '';
      Object.keys(links).forEach((tmdbId) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><a href="https://jelenasavic123.github.io/SveNaEkranu/${tmdbId}" target="_blank">https://jelenasavic123.github.io/SveNaEkranu/${tmdbId}</a></td>
          <td><a href="${links[tmdbId]}" target="_blank">${links[tmdbId]}</a></td>
        `;
        linksTable.appendChild(row);
      });
    }

    // Preusmeravanje na osnovu URL-a
    const currentPath = window.location.pathname.split('/').pop();
    if (currentPath && links[currentPath]) {
      window.location.href = links[currentPath];
    }
  </script>
</body>
</html>
