<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preusmeravanje</title>
  <script>
    // Mapa TMDB ID-ova i originalnih linkova
    const redirects = {
      "545609": "https://filemoon.in/e/96bqrqgnsui7/Zivot_koji_nas_spaja_95_epz",
      "123456": "https://dooodster.com/e/examplelink",
      "987654": "https://dooodster.com/e/anotherlink"
    };

    // Ekstrahovanje TMDB ID-a iz URL hash-a
    const hash = window.location.hash;
    const tmdbId = hash ? hash.substring(2) : null;

    // Preusmeravanje na odgovarajući link
    if (tmdbId && redirects[tmdbId]) {
      window.location.href = redirects[tmdbId];
    } else if (tmdbId) {
      document.write(`<h1>TMDB ID "${tmdbId}" nije pronađen!</h1>`);
    } else {
      document.write("<h1>Dobrodošli! Unesite TMDB ID u URL hash za preusmeravanje.</h1>");
    }
  </script>
</head>
<body>
  <noscript>Ovaj sajt zahteva JavaScript za preusmeravanje.</noscript>
</body>
</html>
