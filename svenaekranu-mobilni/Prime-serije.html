<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serije - TMDB</title>
    <style>
        /* Global Styles */
      /* Global Styles */
body {
    font-family: Arial, sans-serif;
    background: url('https://jelenasavic123.github.io/SveNaEkranu/slike/pozadinaprime.jpg') center center / cover no-repeat fixed;
    color: white;
}

h2, h3 {
    color: #fff;
    font-weight: bold;
}

a {
    text-decoration: none;
    color: inherit;
}

/* Main Content */
#series-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    padding: 20px;
}

.series-card {
    position: relative;
    cursor: pointer;
    border-radius: 10px;
    overflow: hidden;
    background-color: #222;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.series-card img {
    width: 100%;
    height: 300px; /* Adjusted to maintain a normal thumbnail format */
    object-fit: cover; /* Ensures the image fills the box without stretching */
}

.series-card h3 {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 18px;
    text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
}

.series-card:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
}

/* Loading Spinner */
#loading {
    text-align: center;
    color: #fff;
    font-size: 20px;
    margin-top: 20px;
}

/* Popup */
.popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.popup-content {
    background-color: #1f1f1f;
    padding: 20px;
    border-radius: 10px;
    max-width: 800px;
    width: 90%;
    overflow-y: auto;
    max-height: 80%;
    position: relative;
}

.close {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 30px;
    color: #fff;
    cursor: pointer;
    background: rgba(0, 0, 0, 0.5);
    padding: 5px 10px;
    border-radius: 50%;
}

/* Seasons and Episodes */
.season-list {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    margin-top: 20px;
}

.season-button {
    padding: 12px 20px;
    background-color: #e50914;
    color: white;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s;
}

.season-button:hover {
    background-color: #b20710;
}

.episode-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 20px;
}

.episode-button {
    padding: 10px;
    background-color: #333;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    transition: background-color 0.3s;
}

.episode-button:hover {
    background-color: #e50914;
}

/* Responsive */
@media (max-width: 768px) {
    .series-card {
        width: 100%;
        margin-bottom: 20px;
    }

    .season-button {
        font-size: 14px;
        padding: 10px 15px;
    }

    .episode-button {
        font-size: 12px;
        padding: 8px;
    }
}

.filters {
    display: flex;
    justify-content: space-between;
    width: 100%;
    flex-wrap: nowrap;
    gap: 10px;
    margin-bottom: 20px;
}

.filter-group {
    display: flex;
    flex-direction: column;
    flex: 1;
}

label {
    margin-bottom: 5px;
    font-weight: bold;
    color: white;
}

.filter-input {
    padding: 10px;
    font-size: 1rem;
    border-radius: 5px;
    border: 1px solid #333;
    background-color: #333;
    color: white;
}

/* Loading Text Style */
#loading {
    text-align: center;
    font-size: 18px;
    color: #007bff;
    margin: 20px 0;
    font-weight: bold;
    display: none; /* Hidden by default */
}

/* Series List Styling */
#series-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-evenly;
    margin-top: 20px;
    padding: 10px;
}

/* Load More Button Styling */
#load-more {
    display: inline-block;
    background-color: #28a745;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    margin: 20px auto;
    transition: background-color 0.3s;
}

#load-more:hover {
    background-color: #218838;
}

/* Ensure the "Load More" button is centered */
#load-more {
    text-align: center;
    margin-top: 30px;
    display: none; /* Hidden by default */
}

.logo {
    margin: 5px 0;
    text-align: center;
}

.logo img {
    width: 80px;
}

#series-list {
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 15px;
    padding: 10px;
}


/* Popup optimizacija za mobilne uređaje */
@media (max-width: 768px) {
    .popup-content {
        max-height: 90vh;
        overflow-y: auto;
        padding: 15px;
        border-radius: 10px;
    }

    #series-title {
        font-size: 20px;
        margin-bottom: 10px;
    }

    #series-overview {
        font-size: 15px;
        line-height: 1.5;
        margin-bottom: 20px;
    }

    .season-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
    }

    .season-button {
        flex: 1 1 45%;
        padding: 10px;
        font-size: 15px;
    }

    .episode-list {
        display: grid;
        grid-template-columns: 1fr 1fr; /* Dve epizode po redu */
        gap: 10px;
    }

    .episode-button {
        font-size: 13px;
        padding: 8px;
    }

    .close {
        font-size: 28px;
        top: 5px;
        right: 10px;
    }
}

  </style>
</head>
<body>
    <div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Amazon_Prime_logo_%282022%29.svg/768px-Amazon_Prime_logo_%282022%29.svg.png" alt="Netflix Logo">
    </div>
    <div class="filters">
        <div class="filter-group">
            <label for="genre-select">Žanr:</label>
            <select id="genre-select" class="filter-input">
                <option value="">Svi žanrovi</option>
                <option value="35">Komedija</option>
                <option value="18">Drama</option>
                <option value="80">Krimi</option>
                <option value="10749">Romantika</option>
                <option value="14">Horor</option>
                <option value="9648">Triler</option>
                <option value="878">Sci-Fi</option>
                <option value="10751">Porodični</option>
                <option value="10759">Akcija i avantura</option>
                <option value="10765">Sci-Fi i fantazija</option>
                <option value="10763">Vestern</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="year-select">Godina:</label>
            <select id="year-select" class="filter-input">
                <option value="">Sve godine</option>
                <!-- Godine od 2025. do 2010. -->
                <script>
                    for (let i = 2025; i >= 2010; i--) {
                        const option = document.createElement('option');
                        option.value = i;
                        option.textContent = i;
                        document.getElementById('year-select').appendChild(option);
                    }
                </script>
            </select>
        </div>
    </div>
    
        <div id="loading" style="display: none;">Učitavanje...</div>
<div id="series-list"></div>
<button id="load-more" style="display: none;">Učitaj više</button>



    <div id="loading" style="display: none;">Učitavanje...</div>
    <div id="series-list"></div>

<!-- Popup prozor -->
<div id="popup" class="popup">
    <div class="popup-content">
        <span id="close" class="close">&times;</span>
        <h2 id="series-title"></h2>
        <p id="series-overview"></p>

        <div id="seasons" class="season-list"></div>

        <div id="episodes-section">
            <div id="episodes" class="episode-list"></div>
        </div>
    </div>
</div>



<script>
    const apiKey = '2701858e9bccab54d4d0e4931420a739';
    const netflixProviderId = 8;
    const baseUrl = 'https://api.themoviedb.org/3/';
    
    const genreSelect = document.getElementById('genre-select');
    const yearSelect = document.getElementById('year-select');
    const seriesList = document.getElementById('series-list');
    const loadMoreButton = document.getElementById('load-more');
    const popup = document.getElementById('popup');
    const closeBtn = document.getElementById('close');
    const seriesTitle = document.getElementById('series-title');
    const seriesOverview = document.getElementById('series-overview');
    const seasonsContainer = document.getElementById('seasons');
    const episodesContainer = document.getElementById('episodes');

    let currentPage = 1;
    let currentSeason = 1;
    let currentSeriesId = null;

    async function fetchSeries() {
        const selectedGenre = genreSelect.value;
        const selectedYear = yearSelect.value;

        let url = `${baseUrl}discover/tv?api_key=${apiKey}&language=sr-SR&sort_by=popularity.desc&page=${currentPage}&with_watch_providers=119&watch_region=RS`;


        if (selectedGenre) {
            url += `&with_genres=${selectedGenre}`;
        }

        if (selectedYear) {
            url += `&first_air_date_year=${selectedYear}`;
        }

        document.getElementById('loading').style.display = 'block';
        const response = await fetch(url);
        const data = await response.json();
        displaySeries(data.results);

        if (data.page < data.total_pages) {
            loadMoreButton.style.display = 'block';
        } else {
            loadMoreButton.style.display = 'none';
        }
        document.getElementById('loading').style.display = 'none';
    }

    function displaySeries(series) {
        series.forEach(seriesItem => {
            const card = document.createElement('div');
            card.classList.add('series-card');
            card.innerHTML = `
                <img src="https://image.tmdb.org/t/p/w500${seriesItem.poster_path}" alt="${seriesItem.name}">
                <h3>${seriesItem.name}</h3>
            `;
            card.addEventListener('click', () => openPopup(seriesItem));
            seriesList.appendChild(card);
        });
    }

    async function openPopup(seriesItem) {
        seriesTitle.textContent = seriesItem.name;
        seriesOverview.textContent = seriesItem.overview;
        currentSeriesId = seriesItem.id;
        currentSeason = 1;
        fetchSeasons();
        popup.style.display = 'flex';
    }

    async function fetchSeasons() {
        const url = `${baseUrl}tv/${currentSeriesId}?api_key=${apiKey}&language=hr-HR`;
        const response = await fetch(url);
        const data = await response.json();
        displaySeasons(data.seasons);
    }

    function displaySeasons(seasons) {
        seasonsContainer.innerHTML = '';
        seasons.forEach(season => {
            const button = document.createElement('button');
            button.classList.add('season-button');
            button.textContent = `Sezona ${season.season_number}`;
            button.addEventListener('click', () => {
                currentSeason = season.season_number;
                fetchEpisodes();
            });
            seasonsContainer.appendChild(button);
        });
    }

    async function fetchEpisodes() {
        const url = `${baseUrl}tv/${currentSeriesId}/season/${currentSeason}?api_key=${apiKey}&language=hr-HR`;
        const response = await fetch(url);
        const data = await response.json();
        displayEpisodes(data.episodes);
        scrollToEpisodes(); // automatski skrol
    }

    function displayEpisodes(episodes) {
        episodesContainer.innerHTML = '';
        episodes.forEach(episode => {
            const button = document.createElement('button');
            button.classList.add('episode-button');
            button.textContent = `Epizoda ${episode.episode_number}: ${episode.name}`;
            button.addEventListener('click', () => openEpisode(episode));
            episodesContainer.appendChild(button);
        });
    }

    function openEpisode(episode) {
    const tmdbId = currentSeriesId;
    window.location.href = `https://vidsrc.me/embed/tv?tmdb=${tmdbId}&season=${currentSeason}&episode=${episode.episode_number}&ds_lang=rs`;
}

    function scrollToEpisodes() {
        const section = document.getElementById("episodes-section");
        if (section) {
            section.scrollIntoView({ behavior: "smooth" });
        }
    }

    closeBtn.addEventListener('click', () => {
        popup.style.display = 'none';
    });

    genreSelect.addEventListener('change', () => {
        currentPage = 1;
        seriesList.innerHTML = '';
        fetchSeries();
    });

    yearSelect.addEventListener('change', () => {
        currentPage = 1;
        seriesList.innerHTML = '';
        fetchSeries();
    });

    loadMoreButton.addEventListener('click', () => {
        currentPage++;
        fetchSeries();
    });

    fetchSeries();

    async function loadGenres() {
        const url = `${baseUrl}genre/tv/list?api_key=${apiKey}&language=en-EN`;
        const response = await fetch(url);
        const data = await response.json();
        const genres = data.genres;

        genreSelect.innerHTML = '<option value="">Svi žanrovi</option>';
        genres.forEach(genre => {
            const option = document.createElement('option');
            option.value = genre.id;
            option.textContent = genre.name;
            genreSelect.appendChild(option);
        });
    }

    loadGenres();
</script>



</body>
</html>
