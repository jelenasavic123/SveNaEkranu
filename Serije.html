<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serije Player — Sve Serije</title>
    <link href="https://vjs.zencdn.net/8.13.0/video-js.css" rel="stylesheet" />
    <style>
      /* Osnovno */
      body {
        margin:0;
        font-family:'Segoe UI',sans-serif;
        background:#141414;
        color:#fff;
      }

      /* Grids */
      #seriesGrid, #newEpisodesGrid, #favoritesGrid {
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
        gap:15px;
        padding:15px;
        justify-items:center;
      }

      .series-card {
        width:140px;
        cursor:pointer;
        text-align:center;
        border-radius:10px;
        overflow:hidden;
        transition:.3s;
        background:#1a1a1a;
        position:relative;
      }

      .series-card:hover {
        transform:scale(1.05);
        box-shadow:0 0 20px rgba(255,255,255,.06);
      }

      .series-card img {
        width:100%;
        height:200px;
        object-fit:cover;
        border-bottom:2px solid #333;
        background:#222;
      }

      .series-title {
        padding:6px;
        font-size:.9em;
        font-weight:bold;
        text-transform:uppercase;
      }

      .new-ep-label {
        position:absolute;
        top:8px;
        right:8px;
        background:#ff3d00;
        color:#fff;
        font-size:12px;
        font-weight:bold;
        padding:2px 5px;
        border-radius:4px;
      }

      /* Tab panel */
      #tabPanel {
        position:relative; /* nije fixed */
        width:100%;
        min-height:100vh;
        background:#141414;
        padding:10px;
        display:flex;
        flex-direction:column;
        align-items:center;
      }


      #tabHeader {
        width:90%;
        display:flex;
        justify-content:center;
        margin-bottom:10px;
      }

      #tabHeader h2 {
        margin:0;
        font-size:1.2em;
        text-align:center;
      }

      /* Player */
#playerContainer {
  width:90%;
  max-width:1200px;
  aspect-ratio:16/9;
  background:black;
  border-radius:8px;
  overflow:hidden;
  margin:20px auto 10px auto; /* razmak od headera i dugmadi */
}

      .video-js {
        width:100%;
        height:100%;
        border-radius:8px;
      }

      /* Dugmad iznad epizoda */
#tabButtons {
  width:90%;
  max-width:1200px;
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}

      #favoriteBtn, #backBtn {
        background:#ff3d00;
        color:#fff;
        border:none;
        padding:8px 12px;
        border-radius:6px;
        font-weight:bold;
        cursor:pointer;
        transition:.3s;
      }

      #favoriteBtn:hover, #backBtn:hover {
        background:#ff1a00;
      }

      /* Episode buttons */
#episodeList {
  width:90%;
  max-width:1200px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-bottom:20px; /* razmak ispod epizoda */
  position:relative;  /* važno da ostane u toku dokumenta */
  overflow:visible;   /* ne koristi scroll */
}

      .episode-btn {
        background:#1e1e1e;
        color:#fff;
        border:1px solid #555;
        padding:6px 12px;
        border-radius:6px;
        cursor:pointer;
        font-size:12px;
        transition:0.3s;
        margin:2px;
      }

      .episode-btn:hover {
        background:#ff3d00;
        border-color:#ff3d00;
        transform: scale(1.05);
      }

      .episode-btn.active {
        background:#ff3d00;
        border-color:#ff3d00;
        color:#fff;
        box-shadow:0 4px 12px rgba(255,61,0,0.6);
      }

      /* Search bar */
      #searchBar {
        width:100%;
        padding:12px 0;
        background:#141414;
        position:sticky;
        top:0;
        z-index:50;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:10px;
      }

      #searchContainer {
        display:flex;
        align-items:center;
        gap:8px;
        width:95%;
        max-width:480px;
      }

      #searchBox {
        flex:1;
        padding:10px 14px;
        border-radius:10px;
        background:#f5f5f5;
        border:1px solid #ccc;
        color:#000;
        font-size:16px;
        transition:.3s;
      }

      #searchBox::placeholder {
        color:#666;
      }

      #searchBox:focus {
        border-color:#e50914;
        box-shadow:0 0 5px rgba(229,9,20,0.5);
        outline:none;
      }

      /* Kontrolna dugmad */
      #controlButtons {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 12px 0;
        flex-wrap: wrap;
      }

      .control-btn {
        background: #ff3d00;
        color: #fff;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s ease;
        box-shadow: 0 0 10px rgba(255,61,0,0.4);
      }

      .control-btn:hover {
        background: #ff1a00;
        box-shadow: 0 0 20px rgba(255,0,0,0.6);
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div id="searchBar">
      <div id="searchContainer">
        <input
          type="text"
          id="searchBox"
          placeholder="🔍Pretraži serije…"
          oninput="filterSeries()"
        />
      </div>
      <div id="controlButtons">
        <button class="control-btn" onclick="renderAllSeries()">
          Sve serije
        </button>
        <button class="control-btn" onclick="showNewEpisodes()">🆕 Nove</button>
        <button class="control-btn" onclick="showFavorites()">
          ⭐ Favoriti
        </button>
      </div>
    </div>

    <div id="seriesGrid"></div>
    <div id="newEpisodesGrid" style="display:none;"></div>
    <div id="favoritesGrid" style="display:none;"></div>

    <!-- HTML -->
    <div id="tabPanel">
      <div id="tabHeader">
        <h2 id="tabTitle"></h2>
      </div>

      <div id="playerContainer">
        <video-js
          id="video"
          class="video-js vjs-default-skin"
          controls
        ></video-js>
      </div>

      <div id="tabButtons">
        <button id="backBtn" onclick="closeTab()">⬅ Nazad</button>
        <button id="favoriteBtn" onclick="toggleFavorite()">
          Dodaj u favorite
        </button>
      </div>

      <div id="episodeList"></div>
      <!-- sve epizode će biti prikazane odmah -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://vjs.zencdn.net/8.13.0/video.min.js"></script>
    <script>
      const FIREBASE_URL = "https://spring-firefly-83f9.balevasanja.workers.dev/";
      let seriesData = {}, player=null, hls=null, currentSeries=null;

      // Load series list
      async function loadSeriesList(){
        const cached = localStorage.getItem("seriesList");
        const cachedTime = localStorage.getItem("seriesListLastUpdated")||0;
        try{
          const res = await fetch(FIREBASE_URL);
          const data = await res.json();
          let maxLast = Math.max(...Object.values(data).map(s=>s.lastUpdated||0));
          if(cached && cachedTime==maxLast) seriesData = JSON.parse(cached);
          else {
            seriesData = data;
            localStorage.setItem("seriesList", JSON.stringify(data));
            localStorage.setItem("seriesListLastUpdated", maxLast);
          }
        }catch(e){
          if(cached) seriesData = JSON.parse(cached);
          else seriesData = {};
          console.log("Greška fetch:", e);
        }
      }

      // Render grids
      function renderGrid(containerId, seriesList){
        const grid = document.getElementById(containerId);
        grid.innerHTML="";
        for(const key of seriesList){
          const s = seriesData[key];
          if(!s) continue;
          const card = document.createElement("div");
          card.className="series-card";
          card.innerHTML=`<img src="${s.poster}" loading="lazy"><div class="series-title">${s.localName}</div>`;
          card.onclick = ()=>openTab(key);
          grid.appendChild(card);
        }
      }

      // Sve serije
      function renderAllSeries(){
        document.getElementById("seriesGrid").style.display="grid";
        document.getElementById("newEpisodesGrid").style.display="none";
        document.getElementById("favoritesGrid").style.display="none";
        renderGrid("seriesGrid", Object.keys(seriesData));
      }

      // Nove epizode
      function getNewEpisodes(s){
        const seen = JSON.parse(localStorage.getItem("seenEpisodes")||'{}');
        for(let i=s.episodes.length-1;i>=0;i--){
          if(!seen[s.episodes[i]]) return {url:s.episodes[i], number:i+1};
        }
        return null;
      }

      function showNewEpisodes(){
        const grid = document.getElementById("newEpisodesGrid");
        grid.innerHTML="";
        let count=0;
        for(const key in seriesData){
          if(count>=10) break;
          const s = seriesData[key];
          const latest = getNewEpisodes(s);
          if(!latest) continue;
          const card = document.createElement("div");
          card.className="series-card";
          card.innerHTML=`<img src="${s.poster}" loading="lazy"><div class="new-ep-label">${latest.number} Epz</div><div class="series-title">${s.localName}</div>`;
          card.onclick = ()=>openTab(key);
          grid.appendChild(card);
          count++;
        }
        document.getElementById("seriesGrid").style.display="none";
        document.getElementById("newEpisodesGrid").style.display="grid";
        document.getElementById("favoritesGrid").style.display="none";
      }

      // Favoriti
      function showFavorites(){
        const favKeys = JSON.parse(localStorage.getItem("favorites")||'[]');
        renderGrid("favoritesGrid", favKeys);
        document.getElementById("seriesGrid").style.display="none";
        document.getElementById("newEpisodesGrid").style.display="none";
        document.getElementById("favoritesGrid").style.display="grid";
      }

      // Open tab
      function openTab(name){
        const s = seriesData[name];
        if(!s) return;
        currentSeries=name;
        document.getElementById("seriesGrid").style.display="none";
        document.getElementById("newEpisodesGrid").style.display="none";
        document.getElementById("favoritesGrid").style.display="none";
        document.getElementById("tabPanel").style.display="flex";
        document.getElementById("tabTitle").textContent = s.localName;

        // favorite button text
        const favs = JSON.parse(localStorage.getItem("favorites")||'[]');
        document.getElementById("favoriteBtn").textContent = favs.includes(name) ? "Ukloni iz favorite" : "Dodaj u favorite";

        // episodes
        const epList = document.getElementById("episodeList");
        epList.innerHTML="";
        const episodes = [...s.episodes].reverse();
        episodes.forEach((url,i)=>{
          const btn = document.createElement("button");
          btn.className="episode-btn";
          btn.textContent="Epizoda "+(i+1);
          btn.dataset.url=url;
          btn.onclick=()=>playEpisode(btn);
          epList.appendChild(btn);
        });

        window.scrollTo({top:0, behavior:'smooth'});
      }

      // Toggle favorite
      function toggleFavorite(){
        const favs = JSON.parse(localStorage.getItem("favorites")||'[]');
        if(favs.includes(currentSeries)){
          const idx = favs.indexOf(currentSeries);
          favs.splice(idx,1);
          document.getElementById("favoriteBtn").textContent = "Dodaj u favorite";
        }else{
          favs.push(currentSeries);
          document.getElementById("favoriteBtn").textContent = "Ukloni iz favorite";
        }
        localStorage.setItem("favorites", JSON.stringify(favs));
      }

      // Close tab
      function closeTab(){
        document.getElementById("tabPanel").style.display="none";
        renderAllSeries();
        if(hls){ try{hls.destroy(); }catch(e){} hls=null; }
        if(player){ try{player.pause(); player.currentTime(0);}catch(e){} }
      }

      // Play episode
      function playEpisode(btn){
        document.querySelectorAll(".episode-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        const url = btn.dataset.url;
        document.getElementById("playerContainer").scrollIntoView({behavior:"smooth", block:"start"});
        if(hls){ try{hls.destroy();}catch(e){} hls=null; }
        if(!player){
          player = videojs('video',{autoplay:false, controls:true, fluid:true});
          const Button = videojs.getComponent("Button");
          class Back15Button extends Button { constructor(p,o){super(p,o);this.addClass("vjs-back15-button");this.el().innerHTML="⏪ 15s";} handleClick(){player.currentTime(Math.max(0,player.currentTime()-15));} }
          class Forward15Button extends Button { constructor(p,o){super(p,o);this.addClass("vjs-forward15-button");this.el().innerHTML="15s ⏩";} handleClick(){player.currentTime(player.currentTime()+15);} }
          const cb = player.getChild('controlBar');
          const idx = cb.children().findIndex(c=>c.name_==='fullscreenToggle');
          cb.addChild(new Back15Button(player),{},idx);
          cb.addChild(new Forward15Button(player),{},idx+1);
        }
        try{ player.pause(); player.src({src:'', type:'application/x-mpegURL'}); player.currentTime(0);}catch(e){}
        if(Hls.isSupported()){ hls=new Hls(); hls.attachMedia(player.tech().el()); hls.loadSource(url); hls.on(Hls.Events.MANIFEST_PARSED,()=>player.play()); }
        else{ player.src({src:url, type:'application/x-mpegURL'}); player.play(); }
      }

      // Search
      function filterSeries(){
        const search=document.getElementById("searchBox").value.toLowerCase();
        ["seriesGrid","newEpisodesGrid","favoritesGrid"].forEach(id=>{
          document.querySelectorAll("#"+id+" .series-card").forEach(card=>{
            const title = card.querySelector(".series-title").textContent.toLowerCase();
            card.style.display = title.includes(search)?"block":"none";
          });
        });
      }

      // Init
      (async function init(){ await loadSeriesList(); renderAllSeries(); })();
    </script>
  </body>
</html>
