<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serije Player sa TMDb</title>
<style>
body { font-family: 'Segoe UI', sans-serif; background: #141414; color: #fff; margin: 20px; }
h1 { text-align: center; margin-bottom: 20px; }

/* Search Box */
.search-box { max-width: 600px; margin: 0 auto 10px; position: relative; }
.search-box input { width: 100%; padding: 10px 15px; border-radius: 6px; border: none; font-size: 1em; background: #fff; color: #000; }
.search-results { position: absolute; top: 100%; left: 0; right: 0; background: #222; max-height: 300px; overflow-y: auto; border-radius: 6px; z-index: 20; display: none; }
.search-item { display: flex; padding: 8px; cursor: pointer; align-items: center; border-bottom: 1px solid #333; transition: 0.2s; }
.search-item img { width: 60px; height: 90px; object-fit: cover; border-radius: 4px; margin-right: 10px; }
.search-item:hover { background: #e50914; }
.search-item div { text-align: left; }
.search-item div strong { display: block; font-size: 1em; }
.search-item div small { display: block; font-size: 0.8em; color: #ccc; }

/* Dropdown */
.dropdown { position: relative; max-width: 600px; margin: 0 auto 20px; }
.dropdown-toggle { background: #333; padding: 12px 20px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.dropdown-toggle span { font-weight: bold; font-size: 1em; }
.dropdown-menu { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #222; max-height: 300px; overflow-y: auto; border-radius: 6px; margin-top: 5px; z-index: 10; }
.dropdown-item { display: flex; padding: 8px; cursor: pointer; align-items: center; transition: 0.2s; border-bottom: 1px solid #333; }
.dropdown-item img { width: 60px; height: 90px; object-fit: cover; border-radius: 4px; margin-right: 10px; }
.dropdown-item:hover { background: #e50914; }
.dropdown-item div { text-align: left; }
.dropdown-item div strong { display: block; font-size: 1em; }
.dropdown-item div small { display: block; font-size: 0.8em; color: #ccc; }

/* Video Player */
#videoWrapper { 
    max-width: 300px;
    position: relative; 
    padding-top: 56.25%;
    background: #000; 
    border-radius: 10px; 
    margin: auto; 
    margin-bottom: 15px; 
}
video { 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    border-radius: 8px; 
    background: black; 
}
#loadingSpinner { 
    position: absolute; 
    left: 50%; 
    top: 50%; 
    transform: translate(-50%, -50%); 
    border: 5px solid rgba(229, 9, 20, 0.3); 
    border-top: 5px solid #e50914; 
    border-radius: 50%; 
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite; 
    display: none; 
}
@keyframes spin { 
    0% { transform: translate(-50%, -50%) rotate(0deg);} 
    100% { transform: translate(-50%, -50%) rotate(360deg);} 
}

/* Episodes */
#episodeButtons { display: flex; flex-wrap: wrap; justify-content: center; margin-bottom: 15px; }
#episodeButtons button { background: #333; border: none; color: #eee; padding: 12px 18px; margin: 5px; border-radius: 5px; font-weight: 600; cursor: pointer; transition: 0.3s; }
#episodeButtons button:hover { background: #e50914; color: white; transform: scale(1.05); }
#episodeButtons button.active { background: #e50914; color: white; transform: scale(1.1); }

/* Series info */
#seriesInfo { max-width: 800px; margin: auto; font-size: 1em; text-align: center; background: #222; padding: 15px; border-radius: 8px; }
#seriesInfo img { width: 150px; height: 225px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
#seriesInfo strong { display: block; font-size: 1.2em; margin-bottom: 5px; }
#seriesInfo small { display: block; font-size: 0.9em; color: #ccc; margin-bottom: 10px; }
#refreshBtn { font-size: 0.7em; margin-top: 5px; background: #333; color: #ccc; border: none; border-radius: 3px; padding: 3px 6px; cursor: pointer; }
#refreshBtn:hover { background: #e50914; color: #fff; }
</style>
</head>
<body>

<h1>▼ KLIKNITE MENI ZA LISTU SERIJA ▼</h1>

<!-- Search -->
<div class="search-box">
  <input type="text" id="searchInput" placeholder="Pretraži serije...">
  <div class="search-results" id="searchResults"></div>
</div>

<!-- Dropdown -->
<div class="dropdown">
  <div class="dropdown-toggle"><span>Izaberite seriju...</span> ▼</div>
  <div class="dropdown-menu" id="dropdownMenu"></div>
</div>

<!-- Video Player -->
<div id="videoWrapper">
  <div id="loadingSpinner"></div>
  <video id="videoPlayer" controls>
    <source id="videoSource" src="" type="application/x-mpegURL">
  </video>
</div>

<!-- Refresh -->
<div style="text-align:center;"><button id="refreshBtn">Osveži listu serija</button></div>

<div id="episodeButtons"></div>
<div id="seriesInfo"></div>

<script>
const firebaseBaseURL = "https://jsonserije-4d79b-default-rtdb.firebaseio.com";
const tmdbApiKey = "2701858e9bccab54d4d0e4931420a739";

const videoPlayer = document.getElementById("videoPlayer");
const videoSource = document.getElementById("videoSource");
const loadingSpinner = document.getElementById("loadingSpinner");
const seriesInfo = document.getElementById("seriesInfo");
const episodeButtons = document.getElementById("episodeButtons");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");
const dropdownToggle = document.querySelector('.dropdown-toggle');
const dropdownMenu = document.getElementById("dropdownMenu");
const dropdownSpan = dropdownToggle.querySelector('span');
const refreshBtn = document.getElementById("refreshBtn");

let allSeries = [];

// Toggle dropdown
dropdownToggle.addEventListener('click', () => {
  dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
});

// Fetch Series + TMDb Poster
async function loadSeries() {
  try {
    const res = await fetch(`${firebaseBaseURL}/.json?_=${Date.now()}`);
    const data = await res.json();
    if(!data) return;

    const seriesNames = Object.keys(data);

    allSeries = await Promise.all(seriesNames.map(async name => {
      let poster = "https://via.placeholder.com/100x150?text=Serija";
      try {
        const tmdbRes = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${tmdbApiKey}&query=${encodeURIComponent(name)}&language=sr`);
        const tmdbData = await tmdbRes.json();
        if(tmdbData.results && tmdbData.results.length>0 && tmdbData.results[0].poster_path){
          poster = `https://image.tmdb.org/t/p/w200${tmdbData.results[0].poster_path}`;
        }
      } catch(e){}

      return {
        name,
        epizode: data[name],
        poster
      };
    }));

    renderDropdown(allSeries);

  } catch(err){ console.error(err); }
}

// Render Dropdown
function renderDropdown(seriesList){
  dropdownMenu.innerHTML = "";
  seriesList.forEach(series => {
    const div = document.createElement("div");
    div.className = "dropdown-item";
    div.innerHTML = `<img src="${series.poster}" alt="${series.name}"><div><strong>${series.name}</strong></div>`;
    div.addEventListener("click", () => selectSeries(series.name));
    dropdownMenu.appendChild(div);
  });
}

// Search
searchInput.addEventListener('input', () => {
  const term = searchInput.value.toLowerCase();
  const filtered = allSeries.filter(s => s.name.toLowerCase().includes(term));
  renderSearchResults(filtered);
});

function renderSearchResults(list){
  searchResults.innerHTML = "";
  if(list.length === 0 || searchInput.value.trim() === ""){
    searchResults.style.display = "none";
    return;
  }
  searchResults.style.display = "block";
  list.forEach(series => {
    const div = document.createElement("div");
    div.className = "search-item";
    div.innerHTML = `<img src="${series.poster}" alt="${series.name}"><div><strong>${series.name}</strong></div>`;
    div.addEventListener("click", () => selectSeries(series.name));
    searchResults.appendChild(div);
  });
}

// SELECT SERIES (Firebase fresh fetch)
async function selectSeries(name){
  searchResults.style.display = "none";
  dropdownMenu.style.display = "none";
  searchInput.value = name;
  dropdownSpan.textContent = name;

  const res = await fetch(`${firebaseBaseURL}/${encodeURIComponent(name)}.json?_=${Date.now()}`);
  const data = await res.json();
  if(!data) return;

  let epArray = [];

  if (Array.isArray(data)) {
    epArray = data.filter(link => link);
  } else if (typeof data === 'object') {
    epArray = Object.values(data).filter(link => link);
  }

  episodeButtons.innerHTML = "";
  if (epArray.length === 0) {
    episodeButtons.innerHTML = "<p>Nema epizoda za ovu seriju.</p>";
    return;
  }

  epArray.forEach((videoLink, i) => {
    const btn = document.createElement("button");
    btn.textContent = `Epizoda ${i+1}`;

    btn.addEventListener("click", async () => {
      document.querySelectorAll("#episodeButtons button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      const freshRes = await fetch(`${firebaseBaseURL}/${encodeURIComponent(name)}/${i}.json?_=${Date.now()}`);
      const freshUrl = await freshRes.json();

      videoSource.src = freshUrl;
      videoPlayer.load();
      videoPlayer.play();
      window.scrollTo({ top: videoPlayer.offsetTop - 20, behavior: 'smooth' });
    });

    episodeButtons.appendChild(btn);
  });

  // Auto play first (fresh)
  const firstEpisodeRes = await fetch(`${firebaseBaseURL}/${encodeURIComponent(name)}/0.json?_=${Date.now()}`);
  const firstUrl = await firstEpisodeRes.json();

  episodeButtons.querySelector("button").classList.add("active");
  videoSource.src = firstUrl;
  videoPlayer.load();

  // TMDb info
  try {
    const tmdbRes = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${tmdbApiKey}&query=${encodeURIComponent(name)}&language=sr`);
    const tmdbData = await tmdbRes.json();
    if (tmdbData.results && tmdbData.results.length > 0) {
      const show = tmdbData.results[0];
      seriesInfo.innerHTML = `
        <img src="https://image.tmdb.org/t/p/w200${show.poster_path}" alt="${name}">
        <strong>${show.name}</strong>
        <small>${show.first_air_date?.split("-")[0] || ""}</small>
        <p>${show.overview || "Nema opisa."}</p>
      `;
    } else {
      seriesInfo.innerHTML = `<p>Nema podataka o seriji.</p>`;
    }
  } catch(e){
    seriesInfo.innerHTML = `<p>Nema podataka o seriji.</p>`;
  }
}

// Spinner
videoPlayer.addEventListener("waiting", ()=>loadingSpinner.style.display="block");
videoPlayer.addEventListener("playing", ()=>loadingSpinner.style.display="none");

refreshBtn.addEventListener("click", loadSeries);
setInterval(loadSeries, 60*60*1000);

loadSeries();
</script>

</body>
</html>
