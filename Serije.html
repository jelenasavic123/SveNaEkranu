<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>▼KLIKNITE MENI ISPOD ZA LISTU SERIJA▼</title>
<style>
body { font-family: 'Segoe UI', sans-serif; background: #141414; color: #fff; margin: 20px; }
h1 { text-align: center; margin-bottom: 20px; }

.dropdown { position: relative; max-width: 600px; margin: 0 auto 20px; }
.dropdown-toggle { background: #333; padding: 12px 20px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.dropdown-toggle span { font-weight: bold; font-size: 1em; }
.dropdown-menu { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #222; max-height: 300px; overflow-y: auto; border-radius: 6px; margin-top: 5px; z-index: 10; }
.dropdown-item { display: flex; padding: 8px; cursor: pointer; align-items: center; transition: 0.2s; border-bottom: 1px solid #333; }
.dropdown-item img { width: 60px; height: 90px; object-fit: cover; border-radius: 4px; margin-right: 10px; }
.dropdown-item:hover { background: #e50914; }
.dropdown-item div { text-align: left; }
.dropdown-item div strong { display: block; font-size: 1em; }
.dropdown-item div small { display: block; font-size: 0.8em; color: #ccc; }

#videoWrapper { 
    max-width: 600px; /* smanjeno sa 800px na 600px */
    position: relative; 
    padding-top: 56.25%; /* 16:9 omjer */
    background: #000; 
    border-radius: 10px; 
    margin: auto; 
    margin-bottom: 15px; 
}
video { 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    border-radius: 8px; 
    background: black; 
}
#loadingSpinner { 
    position: absolute; 
    left: 50%; 
    top: 50%; 
    transform: translate(-50%, -50%); 
    border: 5px solid rgba(229, 9, 20, 0.3); 
    border-top: 5px solid #e50914; 
    border-radius: 50%; 
    width: 40px; /* smanjeno sa 50px */
    height: 40px; /* smanjeno sa 50px */
    animation: spin 1s linear infinite; 
    display: none; 
}
@keyframes spin { 
    0% { transform: translate(-50%, -50%) rotate(0deg);} 
    100% { transform: translate(-50%, -50%) rotate(360deg);} 
}


#episodeButtons { display: flex; flex-wrap: wrap; justify-content: center; margin-bottom: 15px; }
#episodeButtons button { background: #333; border: none; color: #eee; padding: 12px 18px; margin: 5px; border-radius: 5px; font-weight: 600; cursor: pointer; transition: 0.3s; }
#episodeButtons button:hover { background: #e50914; color: white; transform: scale(1.05); }
#episodeButtons button.active { background: #e50914; color: white; transform: scale(1.1); }

#seriesInfo { max-width: 800px; margin: auto; font-size: 1em; text-align: center; background: #222; padding: 15px; border-radius: 8px; }
#seriesInfo img { width: 150px; height: 225px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
#seriesInfo strong { display: block; font-size: 1.2em; margin-bottom: 5px; }
#seriesInfo small { display: block; font-size: 0.9em; color: #ccc; margin-bottom: 10px; }
</style>
</head>
<body>

<h1>Player za serije</h1>

<div class="dropdown">
  <div class="dropdown-toggle"><span>Izaberite seriju...</span> ▼</div>
  <div class="dropdown-menu"></div>
</div>

<div id="videoWrapper">
  <div id="loadingSpinner"></div>
  <video id="videoPlayer" controls>
    <source id="videoSource" src="" type="application/x-mpegURL">
  </video>
</div>

<div id="episodeButtons"></div>

<div id="seriesInfo"></div>

<script>
const firebaseBaseURL = "https://jsonserije-4d79b-default-rtdb.firebaseio.com";
const tmdbApiKey = "2701858e9bccab54d4d0e4931420a739";

const dropdownToggle = document.querySelector('.dropdown-toggle');
const dropdownMenu = document.querySelector('.dropdown-menu');
const dropdownSpan = dropdownToggle.querySelector('span');
const videoPlayer = document.getElementById("videoPlayer");
const videoSource = document.getElementById("videoSource");
const loadingSpinner = document.getElementById("loadingSpinner");
const seriesInfo = document.getElementById("seriesInfo");
const episodeButtons = document.getElementById("episodeButtons");

let currentVideoSrc = "";

// Toggle dropdown
dropdownToggle.addEventListener('click', () => {
  dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
});

// --- Učitaj serije sa Firebase ---
async function loadSeries() {
  try {
    const res = await fetch(`${firebaseBaseURL}/.json?_=${Date.now()}`);
    const data = await res.json();
    if (!data) return;

    dropdownMenu.innerHTML = "";

    for (const name of Object.keys(data)) {
      const div = document.createElement("div");
      div.className = "dropdown-item";
      div.innerHTML = `<img src="" alt="${name}"><div><strong>${name}</strong><small>Godina</small></div>`;
      div.addEventListener("click", () => selectSeries(name, div));
      dropdownMenu.appendChild(div);

      fetchTMDbInfo(name, div);
    }
  } catch(err) { console.error(err); }
}

// --- Dohvat TMDb podataka ---
async function fetchTMDbInfo(title, divElement) {
  try {
    const res = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${tmdbApiKey}&query=${encodeURIComponent(title)}&language=sr`);
    const data = await res.json();
    if (data.results && data.results.length > 0) {
      const show = data.results[0];
      divElement.querySelector("img").src = `https://image.tmdb.org/t/p/w200${show.poster_path}`;
      divElement.querySelector("small").textContent = `${show.first_air_date?.split("-")[0] || ""}`;
    }
  } catch(err) { console.error(err); }
}

// --- Klik na seriju ---
async function selectSeries(name, divElement) {
  dropdownSpan.textContent = name;
  dropdownMenu.style.display = 'none';

  const res = await fetch(`${firebaseBaseURL}/${encodeURIComponent(name)}.json?_=${Date.now()}`);
  const data = await res.json();
  if (!data || !data.epizode) return;

  // Normalizuj epizode: preskoči null i numeriši samo stvarne epizode
  const epArray = Object.values(data.epizode).filter(link => link); 

  episodeButtons.innerHTML = "";
  epArray.forEach((videoLink, i) => {
    const btn = document.createElement("button");
    btn.textContent = `Epizoda ${i + 1}`; // prva stvarna epizoda = 1
    btn.dataset.videoSrc = videoLink;
    btn.addEventListener("click", () => {
      document.querySelectorAll("#episodeButtons button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentVideoSrc = videoLink;
      videoSource.src = videoLink;
      videoPlayer.load();
      if(videoLink) videoPlayer.play();
    });
    episodeButtons.appendChild(btn);
  });

  // Postavi prvu stvarnu epizodu (ako postoji)
  if (epArray.length > 0) {
    currentVideoSrc = epArray[0];
    videoSource.src = currentVideoSrc;
    videoPlayer.load();
    const firstBtn = episodeButtons.querySelector("button");
    if (firstBtn) firstBtn.classList.add("active");
  } else {
    videoSource.src = "";
    videoPlayer.load();
  }

  // Info o seriji
  const tmdbRes = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${tmdbApiKey}&query=${encodeURIComponent(name)}&language=sr`);
  const tmdbData = await tmdbRes.json();
  if (tmdbData.results && tmdbData.results.length > 0) {
    const show = tmdbData.results[0];
    seriesInfo.innerHTML = `
      <img src="https://image.tmdb.org/t/p/w200${show.poster_path}" alt="${name}">
      <strong>${show.name}</strong>
      <small>${show.first_air_date?.split("-")[0] || ""} • Žanrovi: ${show.genre_ids?.join(", ") || "Nema"}</small>
      <p>${show.overview || "Nema opisa."}</p>
    `;
  } else {
    seriesInfo.innerHTML = `<p>Nema podataka o seriji.</p>`;
  }
}

videoPlayer.addEventListener("waiting", () => loadingSpinner.style.display = "block");
videoPlayer.addEventListener("playing", () => loadingSpinner.style.display = "none");

loadSeries();
</script>
</body>
</html>
