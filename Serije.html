<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obaveštenje</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        padding: 20px;
    }

    .box {
        background-color: #fff;
        padding: 30px 40px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        max-width: 400px;
    }

    h1 {
        font-size: 1.8em;
        margin-bottom: 20px;
    }

    p {
        font-size: 1.1em;
        margin-bottom: 25px;
        line-height: 1.5;
    }

    a {
        display: inline-block;
        padding: 12px 25px;
        background-color: #4CAF50;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
        transition: background 0.3s;
    }

    a:hover {
        background-color: #45a049;
    }
</style>
</head>
<body>
    <div class="box">
        <h1>Obaveštenje</h1>
        <p>
            Dragi posetioci,<br>
            Sajt više nije ovde.<br>
            Sve serije i sadržaj sada možete pratiti na novoj adresi:
        </p>
        <a href="https://www.sveNaDlanu.online">➡ Posetite novi sajt</a>
        <p style="margin-top:15px; font-size:0.9em; color:#666;">
            Bićete automatski preusmereni za nekoliko sekundi.
        </p>
    </div>

    <script>
        setTimeout(function() {
            window.location.href = "https://www.svenadlanu.online/p/serije.html";
        }, 8000);
    </script>
</body>
</html>
