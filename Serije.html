<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obaveštenje</title>

    <!-- AUTOMATSKO PREUSMERENJE (najpouzdanije) -->
    <meta http-equiv="refresh" content="8;url=https://www.svenadlanu.online/p/serije.html">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .box {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 100%;
        }

        h1 {
            font-size: 1.8em;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1em;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #4CAF50;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s;
        }

        a:hover {
            background-color: #45a049;
        }

        .small {
            margin-top: 15px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Obaveštenje</h1>
        <p>
            Dragi posetioci,<br>
            Sajt više nije aktivan na ovoj adresi.<br>
            Sav sadržaj je premešten na novi sajt:
        </p>

        <a href="https://www.svenadlanu.online/p/serije.html">
            ➡ Posetite novi sajt
        </a>

        <p class="small">
            Bićete automatski preusmereni za nekoliko sekundi.
        </p>
    </div>

</body>
</html>
