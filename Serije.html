<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serije Player</title>
<link href="https://vjs.zencdn.net/8.13.0/video-js.css" rel="stylesheet" />
<style>
/* Body i Grid */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #141414;
    color: #fff;
}

#seriesGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 15px;
    padding: 15px;
    justify-items: center;
}

/* Kartice serija */
.series-card {
    width: 140px;
    cursor: pointer;
    text-align: center;
    border-radius: 10px;
    overflow: hidden;
    transition: 0.3s;
    background: #1a1a1a;
}

.series-card:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
}

.series-card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-bottom: 2px solid #333;
}

.series-title {
    padding: 6px;
    font-size: 0.9em;
    font-weight: bold;
    text-transform: uppercase;
}

/* Video Wrapper i Player */
#videoWrapper {
    display: none;
    flex-direction: column;
    width: 90%;        /* 90% širine ekrana */
    max-width: 90%;
    margin: 20px auto; /* centriranje */
    background: #000;
    overflow: visible; /* epizode ispod */
    padding-bottom: 20px;
}

#playerContainer {
    position: relative;
    width: 100%;
    max-width: 100%;  /* ne širi više od wrappera */
    height: auto;     /* visina automatski po proporciji */
    background: black;
    margin: 0 auto;
}

.video-js {
    display: block;
    width: 100%;       /* prati širinu container-a */
    height: auto;      /* proporcionalno visina */
    border-radius: 8px;
    max-height: 60vh;  /* da player ne pređe ekran */
}

/* Dugmad nazad */
.back-btn {
    margin: 10px auto;
    padding: 8px 16px;
    background: #222;
    border: 1px solid #555;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: #fff;
    transition: 0.3s;
    display: block;
}

.back-btn:hover {
    background: #ff3d00;
    border-color: #ff3d00;
}

/* Naslov serije */
#seriesTitle {
    text-align: center;
    font-size: 1.5em;
    font-weight: bold;
    margin: 10px 0;
}

/* Lista epizoda */
#episodeList {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    padding: 10px;
    background: #141414; /* epizode ispod playera */
    z-index: 1;
}

.episode-btn {
    background: #222;
    color: #fff;
    border: 1px solid #555;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

.episode-btn.active {
    background: #ff3d00;
    border-color: #ff3d00;
}

/* Meta podaci serije */
#seriesMeta {
    text-align: center;
    padding: 15px;
}

#seriesMeta img {
    max-width: 120px;
    border-radius: 8px;
    margin-top: 10px;
}

/* Responsive prilagodbe */
@media (max-width: 768px) {
    #videoWrapper {
        width: 95%;
        max-width: 95%;
    }

    #playerContainer {
        max-height: 40vh; /* player manji na mobilnim uređajima */
    }

    .series-card img {
        height: 180px;
    }

    .episode-btn {
        padding: 6px 12px;
        font-size: 13px;
    }
}

</style>
</head>
<body>

<h1 style="text-align:center;">Popularne serije</h1>
<div id="seriesGrid"></div>

<div id="videoWrapper">
    <div id="playerContainer">
        <video-js id="video" class="video-js vjs-default-skin" controls autoplay></video-js>
    </div>
    <button class="back-btn" onclick="closeVideo()">⬅ Nazad</button>
    <div id="seriesTitle"></div>
    <div id="episodeList"></div>
    <div id="seriesMeta">
        <p id="seriesOverview"></p>
        <p id="seriesInfo"></p>
        <img id="seriesPoster" src="" alt="">
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://vjs.zencdn.net/8.13.0/video.min.js"></script>
<script>
const FIREBASE_URL = "https://jsonserije-4d79b-default-rtdb.firebaseio.com/.json";
const TMDB_API_KEY = "2701858e9bccab54d4d0e4931420a739";
const MAX_RETRY = 5;
const RETRY_DELAY = 2000;

let player;

async function fetchPoster(seriesName){
    try{
        let query = encodeURIComponent(seriesName.replace(/-/g,' '));
        let res = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&language=sr&query=${query}`);
        let data = await res.json();
        if(data.results && data.results[0]){
            return {
                poster: data.results[0].poster_path ? `https://image.tmdb.org/t/p/w500${data.results[0].poster_path}` : '',
                overview: data.results[0].overview || '',
                name: data.results[0].name || seriesName,
                first_air_date: data.results[0].first_air_date || '',
                genres: (data.results[0].genre_ids || []).join(', ')
            };
        }
        return {poster:'',overview:'',name:seriesName,first_air_date:'',genres:''};
    } catch(e){
        console.error(e);
        return {poster:'',overview:'',name:seriesName,first_air_date:'',genres:''};
    }
}

async function loadSeries(){
    const res = await fetch(FIREBASE_URL);
    const data = await res.json();
    const grid = document.getElementById("seriesGrid");
    grid.innerHTML = '';
    for(let key in data){
        let posterData = await fetchPoster(key);
        let card = document.createElement("div");
        card.className = "series-card";
        card.dataset.series = key;
        card.dataset.episodes = JSON.stringify(data[key]);
        card.dataset.poster = posterData.poster;
        card.dataset.overview = posterData.overview;
        card.dataset.airdate = posterData.first_air_date;
        card.dataset.genres = posterData.genres;
        card.dataset.title = posterData.name;
        card.innerHTML = `<img src="${posterData.poster}" alt="${key}"><div class="series-title">${posterData.name}</div>`;
        card.onclick = ()=>openSeries(card);
        grid.appendChild(card);
    }
}

function openSeries(card){
    document.getElementById("seriesGrid").style.display='none';
    const wrapper = document.getElementById("videoWrapper");
    wrapper.style.display='flex';

    const episodeList = document.getElementById("episodeList");
    episodeList.innerHTML='';
    const episodes = JSON.parse(card.dataset.episodes);
    for(let i=1;i<episodes.length;i++){ // ignorisati prvi null element
        let url = episodes[i];
        if(!url) continue;
        let btn = document.createElement("button");
        btn.className = "episode-btn";
        btn.textContent = "Epizoda " + i;
        btn.dataset.url = url;
        btn.dataset.seriesKey = card.dataset.series;
        btn.dataset.ep = i;
        btn.onclick = ()=>playEpisode(btn);
        episodeList.appendChild(btn);
    }

    document.getElementById("seriesTitle").textContent = card.dataset.title;
    document.getElementById("seriesOverview").textContent = card.dataset.overview;
    document.getElementById("seriesInfo").textContent = `Žanr: ${card.dataset.genres} | Godina: ${card.dataset.airdate}`;
    document.getElementById("seriesPoster").src = card.dataset.poster;

    if(!player) {
        player = videojs('video', { autoplay:true, controls:true, fluid:true });
    }

    const firstBtn = episodeList.querySelector(".episode-btn");
    if(firstBtn) firstBtn.click();
}

async function playEpisode(btn){
    // ukloni aktivnu klasu sa svih dugmadi
    document.querySelectorAll(".episode-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    // Scroll do vrha playera
    document.getElementById("videoWrapper").scrollIntoView({ behavior: 'smooth', block: 'start' });

    let attempt = 0;

    async function loadVideo(){
        try {
            const episodesData = await fetch(FIREBASE_URL).then(r=>r.json());
            const seriesKey = btn.dataset.seriesKey;
            const ep = btn.dataset.ep;
            let url = episodesData[seriesKey][ep];
            if(!url) return;
            url += "?t=" + new Date().getTime();

            // Potpuno resetuj player pre novog load-a
            if(player){
                if(player.hls){
                    player.hls.destroy();
                    player.hls = null;
                }
                player.reset();
            } else {
                player = videojs('video', { autoplay:true, controls:true, fluid:true });
            }

            if(Hls.isSupported()){
                let hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(player.tech().el());

                hls.on(Hls.Events.ERROR, function(event, data){
                    console.error("HLS error", data);
                    if(attempt < MAX_RETRY){
                        attempt++;
                        console.log(`Retrying video... Attempt ${attempt}`);
                        hls.destroy();
                        player.hls = null;
                        setTimeout(loadVideo, RETRY_DELAY);
                    }
                });

                hls.on(Hls.Events.MANIFEST_PARSED, ()=>player.play());
                player.hls = hls;
            } else if(player.tech().el().canPlayType('application/vnd.apple.mpegurl')){
                player.src({ src:url, type:'application/x-mpegURL' });
                player.play().catch(()=>{
                    if(attempt < MAX_RETRY){
                        attempt++;
                        console.log(`Retrying video... Attempt ${attempt}`);
                        setTimeout(loadVideo, RETRY_DELAY);
                    }
                });
            }
        } catch(e){
            console.error(e);
            if(attempt < MAX_RETRY){
                attempt++;
                console.log(`Retrying video... Attempt ${attempt}`);
                setTimeout(loadVideo, RETRY_DELAY);
            }
        }
    }

    loadVideo();
}

function closeVideo(){
    const wrapper = document.getElementById("videoWrapper");
    wrapper.style.display='none';
    document.getElementById("seriesGrid").style.display='grid';
    if(player && player.hls) { player.hls.destroy(); player.hls = null; }
}

// Pokreni inicijalno
loadSeries();
</script>

</body>
</html>
