<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serije Player</title>
<style>
body { margin:0; font-family:'Segoe UI', sans-serif; background:#141414; color:#fff; }
h1 { text-align:center; padding:10px 0; }
.series-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:15px; padding:15px; justify-items:center; }
.series-card { width:140px; cursor:pointer; text-align:center; border-radius:10px; overflow:hidden; transition:0.3s; background:#1a1a1a; }
.series-card:hover { transform:scale(1.05); box-shadow:0 0 20px rgba(255,255,255,0.6); }
.series-card img { width:100%; height:200px; object-fit:cover; border-bottom:2px solid #333; }
.series-title { padding:6px; font-size:0.9em; font-weight:bold; text-transform:uppercase; }
#videoWrapper { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:999; flex-direction:column; justify-content:flex-start; }
#playerContainer { position:relative; width:100%; height:50vh; background:black; }
#video { width:100%; height:100%; background:black; }
.back-btn { margin:8px; padding:8px 16px; background:#222; border:1px solid #555; border-radius:6px; cursor:pointer; font-size:14px; transition:0.3s; color:#fff; }
.back-btn:hover { background:#ff3d00; border-color:#ff3d00; }
#episodeList { display:flex; flex-wrap:wrap; gap:8px; padding:15px; }
.episode-btn { background:#222; color:#fff; border:1px solid #555; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:14px; }
.episode-btn.active { background:#ff3d00; border-color:#ff3d00; }
#seriesMeta { text-align:center; padding:10px; }
#seriesMeta img { max-width:120px; border-radius:8px; margin-top:10px; }
</style>
</head>
<body>

<h1>Popularne serije</h1>
<div id="seriesGrid" class="series-grid"></div>

<div id="videoWrapper" style="display:flex;">
    <div id="playerContainer">
        <video id="video" controls autoplay></video>
    </div>
    <button class="back-btn" onclick="closeVideo()">⬅ Nazad</button>
    <div id="episodeList"></div>
    <div id="seriesMeta">
        <h2 id="seriesTitle"></h2>
        <p id="seriesOverview"></p>
        <p id="seriesInfo"></p>
        <img id="seriesPoster" src="" alt="">
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const FIREBASE_URL = "https://jsonserije-4d79b-default-rtdb.firebaseio.com/serije.json";
const TMDB_API_KEY = "2701858e9bccab54d4d0e4931420a739";
let hls;

async function fetchPoster(seriesName){
    try{
        let query = encodeURIComponent(seriesName.replace(/-/g,' '));
        let res = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${query}`);
        let data = await res.json();
        if(data.results && data.results[0]){
            return {
                poster: data.results[0].poster_path ? `https://image.tmdb.org/t/p/w500${data.results[0].poster_path}` : '',
                overview: data.results[0].overview || '',
                name: data.results[0].name || seriesName,
                first_air_date: data.results[0].first_air_date || '',
                genres: (data.results[0].genre_ids || []).join(', ')
            };
        }
        return {poster:'',overview:'',name:seriesName,first_air_date:'',genres:''};
    } catch(e){console.error(e); return {poster:'',overview:'',name:seriesName,first_air_date:'',genres:''}; }
}

async function loadSeries(){
    const res = await fetch(FIREBASE_URL);
    const data = await res.json();
    const grid = document.getElementById("seriesGrid");
    grid.innerHTML = '';
    for(let key in data){
        let posterData = await fetchPoster(key);
        let card = document.createElement("div");
        card.className = "series-card";
        card.dataset.series = key;
        card.dataset.episodes = JSON.stringify(data[key]);
        card.dataset.poster = posterData.poster;
        card.dataset.overview = posterData.overview;
        card.dataset.airdate = posterData.first_air_date;
        card.dataset.genres = posterData.genres;
        card.dataset.title = posterData.name;
        card.innerHTML = `<img src="${posterData.poster}" alt="${key}"><div class="series-title">${posterData.name}</div>`;
        card.onclick = ()=>openSeries(card);
        grid.appendChild(card);
    }
}

function openSeries(card){
    document.getElementById("seriesGrid").style.display='none';
    const wrapper = document.getElementById("videoWrapper");
    wrapper.style.display='flex';
    const episodeList = document.getElementById("episodeList");
    episodeList.innerHTML='';
    const episodes = JSON.parse(card.dataset.episodes);
    for(let ep in episodes){
        if(ep === "poslednje_azuriranje") continue;
        let btn = document.createElement("button");
        btn.className = "episode-btn";
        btn.textContent = "Ep " + ep;
        btn.dataset.url = episodes[ep];
        btn.onclick = ()=>playEpisode(btn, btn.dataset.url);
        episodeList.appendChild(btn);
    }
    document.getElementById("seriesTitle").textContent = card.dataset.title;
    document.getElementById("seriesOverview").textContent = card.dataset.overview;
    document.getElementById("seriesInfo").textContent = `Žanr: ${card.dataset.genres} | Godina: ${card.dataset.airdate}`;
    document.getElementById("seriesPoster").src = card.dataset.poster;
    // automatski pokreni prvu epizodu
    const firstBtn = episodeList.querySelector(".episode-btn");
    if(firstBtn) firstBtn.click();
}

function playEpisode(btn,url){
    document.querySelectorAll(".episode-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const video = document.getElementById("video");
    if(hls){ hls.destroy(); }
    if(Hls.isSupported()){
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, ()=>video.play());
    } else if(video.canPlayType('application/vnd.apple.mpegurl')){
        video.src = url;
        video.play();
    }
}

function closeVideo(){
    const wrapper = document.getElementById("videoWrapper");
    wrapper.style.display='none';
    document.getElementById("seriesGrid").style.display='grid';
    if(hls) hls.destroy();
}
loadSeries();
</script>
</body>
</html>
